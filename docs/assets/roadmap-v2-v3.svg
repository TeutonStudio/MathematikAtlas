<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1690" viewBox="0 0 1200 1690" role="img" aria-labelledby="title description">
  <title id="title">Roadmap des Mathematik Atlas von Version 2.0.x bis 3.0.0</title>
  <desc id="description">Eine vertikale Entwicklungslinie mit zwölf Meilensteinen: funktionsfähige Grundlage, mathematische Visualisierung, Hilbert-Geometrie, Definitionskarten, TikZ und SVG, Manim, HTML, JavaScript und TypeScript, Kotlin und Java, Godot sowie die abschließende Überarbeitung der Knotenarchitektur.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="timeline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.28" stop-color="#3b82f6"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="0.76" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1690" rx="32" fill="#0f172a"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="82" fill="#f8fafc" font-size="42" font-weight="700">Mathematik Atlas · Roadmap</text>
    <text x="70" y="122" fill="#94a3b8" font-size="21">Von der funktionsfähigen v2-Basis zum konsistenten Gesamtsystem v3.0.0</text>

    <g font-size="16" font-weight="600">
      <g transform="translate(70 158)">
        <rect width="142" height="38" rx="19" fill="#052e16" stroke="#22c55e"/>
        <circle cx="20" cy="19" r="6" fill="#22c55e"/>
        <text x="35" y="25" fill="#dcfce7">Grundlage</text>
      </g>
      <g transform="translate(225 158)">
        <rect width="170" height="38" rx="19" fill="#172554" stroke="#3b82f6"/>
        <circle cx="20" cy="19" r="6" fill="#3b82f6"/>
        <text x="35" y="25" fill="#dbeafe">Mathematik</text>
      </g>
      <g transform="translate(408 158)">
        <rect width="205" height="38" rx="19" fill="#3b0764" stroke="#a855f7"/>
        <circle cx="20" cy="19" r="6" fill="#a855f7"/>
        <text x="35" y="25" fill="#f3e8ff">Grafik &amp; Animation</text>
      </g>
      <g transform="translate(626 158)">
        <rect width="190" height="38" rx="19" fill="#451a03" stroke="#f59e0b"/>
        <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
        <text x="35" y="25" fill="#fef3c7">Programmierung</text>
      </g>
      <g transform="translate(829 158)">
        <rect width="144" height="38" rx="19" fill="#450a0a" stroke="#ef4444"/>
        <circle cx="20" cy="19" r="6" fill="#ef4444"/>
        <text x="35" y="25" fill="#fee2e2">Abschluss</text>
      </g>
    </g>

    <rect x="594" y="235" width="12" height="1360" rx="6" fill="url(#timeline)" opacity="0.9"/>

    <!-- v2.0.x -->
    <line x1="550" y1="285" x2="600" y2="285" stroke="#22c55e" stroke-width="4"/>
    <circle cx="600" cy="285" r="14" fill="#22c55e" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(55 235)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#22c55e" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#052e16"/>
      <text x="68" y="39" fill="#86efac" text-anchor="middle" font-size="16" font-weight="700">v2.0.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Funktionsfähige Grundlage</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Karten, Knoten, Anschlüsse und Verbindungen funktionieren.</text>
    </g>

    <!-- v2.1.x -->
    <line x1="600" y1="405" x2="650" y2="405" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="600" cy="405" r="14" fill="#3b82f6" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(650 355)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#172554"/>
      <text x="68" y="39" fill="#93c5fd" text-anchor="middle" font-size="16" font-weight="700">v2.1.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Visualisierungskonzepte</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Weitere Darstellungen mathematischer Vorgänge und Objekte.</text>
    </g>

    <!-- v2.2.x -->
    <line x1="550" y1="525" x2="600" y2="525" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="600" cy="525" r="14" fill="#3b82f6" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(55 475)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#172554"/>
      <text x="68" y="39" fill="#93c5fd" text-anchor="middle" font-size="16" font-weight="700">v2.2.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Geometrie nach Hilbert</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Axiomatisch begründete geometrische Objekte und Relationen.</text>
    </g>

    <!-- v2.3.x -->
    <line x1="600" y1="645" x2="650" y2="645" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="600" cy="645" r="14" fill="#3b82f6" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(650 595)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#172554"/>
      <text x="68" y="39" fill="#93c5fd" text-anchor="middle" font-size="16" font-weight="700">v2.3.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Definitionskarten</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Definitionen und Sonderfälle vordefinierter Knoten.</text>
    </g>

    <!-- v2.4.x -->
    <line x1="550" y1="765" x2="600" y2="765" stroke="#a855f7" stroke-width="4"/>
    <circle cx="600" cy="765" r="14" fill="#a855f7" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(55 715)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#a855f7" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#3b0764"/>
      <text x="68" y="39" fill="#d8b4fe" text-anchor="middle" font-size="16" font-weight="700">v2.4.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">TikZ- &amp; SVG-Grafiken</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Grafiken visuell erzeugen, importieren und exportieren.</text>
    </g>

    <!-- v2.5.x -->
    <line x1="600" y1="885" x2="650" y2="885" stroke="#a855f7" stroke-width="4"/>
    <circle cx="600" cy="885" r="14" fill="#a855f7" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(650 835)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#a855f7" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#3b0764"/>
      <text x="68" y="39" fill="#d8b4fe" text-anchor="middle" font-size="16" font-weight="700">v2.5.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Manim-Animationen</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Zeitliche Abläufe und mathematische Animationen erzeugen.</text>
    </g>

    <!-- v2.6.x -->
    <line x1="550" y1="1005" x2="600" y2="1005" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="600" cy="1005" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(55 955)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#451a03"/>
      <text x="68" y="39" fill="#fcd34d" text-anchor="middle" font-size="16" font-weight="700">v2.6.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">HTML</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Dokumentstrukturen als visuell verbundene Knoten.</text>
    </g>

    <!-- v2.7.x -->
    <line x1="600" y1="1125" x2="650" y2="1125" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="600" cy="1125" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(650 1075)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#451a03"/>
      <text x="68" y="39" fill="#fcd34d" text-anchor="middle" font-size="16" font-weight="700">v2.7.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">JavaScript &amp; TypeScript</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Weblogik, Funktionen, Kontrollfluss und Typisierung.</text>
    </g>

    <!-- v2.8.x -->
    <line x1="550" y1="1245" x2="600" y2="1245" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="600" cy="1245" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(55 1195)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#451a03"/>
      <text x="68" y="39" fill="#fcd34d" text-anchor="middle" font-size="16" font-weight="700">v2.8.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Kotlin &amp; Java</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Gemeinsame JVM-Konzepte im Knotensystem abbilden.</text>
    </g>

    <!-- v2.9.x -->
    <line x1="600" y1="1365" x2="650" y2="1365" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="600" cy="1365" r="14" fill="#f59e0b" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(650 1315)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
      <rect x="22" y="18" width="92" height="30" rx="15" fill="#451a03"/>
      <text x="68" y="39" fill="#fcd34d" text-anchor="middle" font-size="16" font-weight="700">v2.9.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Godot .scn &amp; GDScript</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Szenenbäume, Ressourcen, Signale und Spiellogik.</text>
    </g>

    <!-- v2.10.x -->
    <line x1="550" y1="1485" x2="600" y2="1485" stroke="#ef4444" stroke-width="4"/>
    <circle cx="600" cy="1485" r="14" fill="#ef4444" stroke="#0f172a" stroke-width="6"/>
    <g transform="translate(55 1435)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#111827" stroke="#ef4444" stroke-width="2"/>
      <rect x="22" y="18" width="102" height="30" rx="15" fill="#450a0a"/>
      <text x="73" y="39" fill="#fca5a5" text-anchor="middle" font-size="16" font-weight="700">v2.10.x</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Knotenarchitektur überarbeiten</text>
      <text x="22" y="92" fill="#94a3b8" font-size="15">Konzepte, Anschlüsse und Wechselwirkungen vereinheitlichen.</text>
    </g>

    <!-- v3.0.0 -->
    <line x1="600" y1="1605" x2="650" y2="1605" stroke="#ef4444" stroke-width="4"/>
    <circle cx="600" cy="1605" r="19" fill="#ef4444" stroke="#fecaca" stroke-width="5"/>
    <g transform="translate(650 1555)" filter="url(#shadow)">
      <rect width="495" height="100" rx="18" fill="#1f1218" stroke="#ef4444" stroke-width="3"/>
      <rect x="22" y="18" width="102" height="30" rx="15" fill="#7f1d1d"/>
      <text x="73" y="39" fill="#fee2e2" text-anchor="middle" font-size="16" font-weight="700">v3.0.0</text>
      <text x="22" y="72" fill="#f8fafc" font-size="22" font-weight="700">Neuausrichtung abgeschlossen</text>
      <text x="22" y="92" fill="#cbd5e1" font-size="15">Ein konsistenter Atlas für Mathematik, Grafik und Code.</text>
