<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1710" viewBox="0 0 1200 1710" role="img" aria-labelledby="title description">
  <title id="title">Roadmap des Mathematik Atlas von Version 2 bis Version 8</title>
  <desc id="description">Eine vertikale Roadmap mit Versionsräumen für den mathematischen Kern, Grafik- und Dokumenterzeugung, Animation, JavaScript und TypeScript, Kotlin und Java sowie zwei Ausbaustufen der Godot-Integration. Neue y-Versionen ergänzen Knoten, neue x-Versionen enthalten sonstige Änderungen.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="timeline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.25" stop-color="#3b82f6"/>
      <stop offset="0.50" stop-color="#a855f7"/>
      <stop offset="0.75" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1710" rx="32" fill="#0f172a"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="78" fill="#f8fafc" font-size="42" font-weight="700">Mathematik Atlas · Roadmap</text>
    <text x="70" y="118" fill="#94a3b8" font-size="21">Versionsräume für Mathematik, Medienerzeugung, Programmierung und Godot</text>

    <g filter="url(#shadow)">
      <rect x="70" y="155" width="1060" height="92" rx="18" fill="#172033" stroke="#334155"/>
      <text x="100" y="191" fill="#f8fafc" font-size="20" font-weight="700">Versionsschema vM.y.x</text>
      <text x="100" y="222" fill="#cbd5e1" font-size="17">
        <tspan font-weight="700" fill="#60a5fa">M</tspan><tspan> = Versionsraum</tspan>
        <tspan dx="42" font-weight="700" fill="#a78bfa">y</tspan><tspan> = neue Knoten oder Knotenfamilien</tspan>
        <tspan dx="42" font-weight="700" fill="#fbbf24">x</tspan><tspan> = sonstige Änderungen, Korrekturen und Ausbau</tspan>
      </text>
    </g>

    <line x1="600" y1="285" x2="600" y2="1445" stroke="url(#timeline)" stroke-width="8" stroke-linecap="round"/>

    <!-- v2 -->
    <g filter="url(#shadow)">
      <rect x="70" y="285" width="470" height="150" rx="20" fill="#172033" stroke="#22c55e" stroke-width="2"/>
      <rect x="94" y="307" width="104" height="35" rx="17" fill="#14532d"/>
      <text x="146" y="331" text-anchor="middle" fill="#bbf7d0" font-size="17" font-weight="700">v2.y.x</text>
      <text x="94" y="374" fill="#f8fafc" font-size="24" font-weight="700">Mathematischer Kern</text>
      <text x="94" y="405" fill="#cbd5e1" font-size="16">
        <tspan x="94">Funktionsfähige Basis, Visualisierungskonzepte,</tspan>
        <tspan x="94" dy="24">Hilbert-basierte Geometrie und Definitionskarten.</tspan>
      </text>
      <line x1="540" y1="360" x2="592" y2="360" stroke="#22c55e" stroke-width="3"/>
      <circle cx="600" cy="360" r="14" fill="#22c55e" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- v3 -->
    <g filter="url(#shadow)">
      <rect x="660" y="455" width="470" height="150" rx="20" fill="#172033" stroke="#3b82f6" stroke-width="2"/>
      <rect x="684" y="477" width="104" height="35" rx="17" fill="#1e3a8a"/>
      <text x="736" y="501" text-anchor="middle" fill="#bfdbfe" font-size="17" font-weight="700">v3.y.x</text>
      <text x="684" y="544" fill="#f8fafc" font-size="24" font-weight="700">Grafik &amp; Dokumente</text>
      <text x="684" y="575" fill="#cbd5e1" font-size="16">
        <tspan x="684">Knoten für SVG, TikZ, LaTeX, Mermaid und HTML</tspan>
        <tspan x="684" dy="24">sowie deren gemeinsame Konzepte und Exporte.</tspan>
      </text>
      <line x1="608" y1="530" x2="660" y2="530" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="600" cy="530" r="14" fill="#3b82f6" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- v4 -->
    <g filter="url(#shadow)">
      <rect x="70" y="625" width="470" height="150" rx="20" fill="#172033" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="94" y="647" width="104" height="35" rx="17" fill="#4c1d95"/>
      <text x="146" y="671" text-anchor="middle" fill="#ddd6fe" font-size="17" font-weight="700">v4.y.x</text>
      <text x="94" y="714" fill="#f8fafc" font-size="24" font-weight="700">Animation</text>
      <text x="94" y="745" fill="#cbd5e1" font-size="16">
        <tspan x="94">Animationserzeugung mit Manim und geeigneten</tspan>
        <tspan x="94" dy="24">Alternativen auf Basis gemeinsamer Zeitkonzepte.</tspan>
      </text>
      <line x1="540" y1="700" x2="592" y2="700" stroke="#8b5cf6" stroke-width="3"/>
      <circle cx="600" cy="700" r="14" fill="#8b5cf6" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- v5 -->
    <g filter="url(#shadow)">
      <rect x="660" y="795" width="470" height="150" rx="20" fill="#172033" stroke="#eab308" stroke-width="2"/>
      <rect x="684" y="817" width="104" height="35" rx="17" fill="#713f12"/>
      <text x="736" y="841" text-anchor="middle" fill="#fef08a" font-size="17" font-weight="700">v5.y.x</text>
      <text x="684" y="884" fill="#f8fafc" font-size="24" font-weight="700">JavaScript &amp; TypeScript</text>
      <text x="684" y="915" fill="#cbd5e1" font-size="16">
        <tspan x="684">Weblogik, Funktionen, Kontrollfluss und typisierte</tspan>
        <tspan x="684" dy="24">Programmstrukturen als verbundene Knoten.</tspan>
      </text>
      <line x1="608" y1="870" x2="660" y2="870" stroke="#eab308" stroke-width="3"/>
      <circle cx="600" cy="870" r="14" fill="#eab308" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- v6 -->
    <g filter="url(#shadow)">
      <rect x="70" y="965" width="470" height="150" rx="20" fill="#172033" stroke="#f97316" stroke-width="2"/>
      <rect x="94" y="987" width="104" height="35" rx="17" fill="#7c2d12"/>
      <text x="146" y="1011" text-anchor="middle" fill="#fed7aa" font-size="17" font-weight="700">v6.y.x</text>
      <text x="94" y="1054" fill="#f8fafc" font-size="24" font-weight="700">Kotlin &amp; Java</text>
      <text x="94" y="1085" fill="#cbd5e1" font-size="16">
        <tspan x="94">JVM-Sprachmodelle, Klassen, Typen und gemeinsame</tspan>
        <tspan x="94" dy="24">Konzepte ohne unnötige doppelte Knotenfamilien.</tspan>
      </text>
      <line x1="540" y1="1040" x2="592" y2="1040" stroke="#f97316" stroke-width="3"/>
      <circle cx="600" cy="1040" r="14" fill="#f97316" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- v7 -->
    <g filter="url(#shadow)">
      <rect x="660" y="1135" width="470" height="150" rx="20" fill="#172033" stroke="#06b6d4" stroke-width="2"/>
      <rect x="684" y="1157" width="104" height="35" rx="17" fill="#164e63"/>
      <text x="736" y="1181" text-anchor="middle" fill="#a5f3fc" font-size="17" font-weight="700">v7.y.x</text>
      <text x="684" y="1224" fill="#f8fafc" font-size="24" font-weight="700">Godot-Grundintegration</text>
      <text x="684" y="1255" fill="#cbd5e1" font-size="16">
        <tspan x="684">Godot-Szenen und GDScript; der Orchestrator dient</tspan>
        <tspan x="684" dy="24">als Vorlage für strukturierte Szenen-Workflows.</tspan>
      </text>
      <line x1="608" y1="1210" x2="660" y2="1210" stroke="#06b6d4" stroke-width="3"/>
      <circle cx="600" cy="1210" r="14" fill="#06b6d4" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- v8 -->
    <g filter="url(#shadow)">
      <rect x="70" y="1305" width="470" height="150" rx="20" fill="#172033" stroke="#ef4444" stroke-width="2"/>
      <rect x="94" y="1327" width="104" height="35" rx="17" fill="#7f1d1d"/>
      <text x="146" y="1351" text-anchor="middle" fill="#fecaca" font-size="17" font-weight="700">v8.y.x</text>
      <text x="94" y="1394" fill="#f8fafc" font-size="24" font-weight="700">Godot-Erweiterungen</text>
      <text x="94" y="1425" fill="#cbd5e1" font-size="16">
        <tspan x="94">Integration von NobodyWho, Voxel Tools und</tspan>
        <tspan x="94" dy="24">LimboAI in das visuelle Orchestrierungsmodell.</tspan>
      </text>
      <line x1="540" y1="1380" x2="592" y2="1380" stroke="#ef4444" stroke-width="3"/>
      <circle cx="600" cy="1380" r="14" fill="#ef4444" stroke="#0f172a" stroke-width="6"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="1500" width="1060" height="145" rx="22" fill="#172033" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8"/>
      <text x="100" y="1542" fill="#f8fafc" font-size="23" font-weight="700">Geplant, aber noch keinem Versionsraum zugeordnet</text>
      <text x="100" y="1582" fill="#cbd5e1" font-size="18">C# · C++ · C · Rust · Python · weitere Sprachen und Laufzeitumgebungen</text>
      <text x="100" y="1617" fill="#94a3b8" font-size="16">Die Zuordnung erfolgt erst, wenn Umfang, gemeinsame Sprachkonzepte und Abhängigkeiten ausreichend geklärt sind.</text>
    </g>
  </g>
</svg>
