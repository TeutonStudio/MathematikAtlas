<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2090" viewBox="0 0 1200 2090" role="img" aria-labelledby="title description">
  <title id="title">Roadmap des Mathematik Atlas von v2.y.x bis v8.y.x</title>
  <desc id="description">Die Grafik erklärt das Versionsschema vM.y.x. M bezeichnet einen fachlichen Versionsraum, y eine Veröffentlichung mit neuen Knoten und x sonstige Änderungen. Darunter folgen die Versionsräume für Mathematik, Grafik und Dokumente, Animation, JavaScript und TypeScript, Kotlin und Java sowie zwei Stufen der Godot-Integration. C#, C++, C, Rust und Python sind geplant, aber noch nicht versioniert.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="timeline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.24" stop-color="#3b82f6"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="0.72" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="2090" rx="32" fill="#0f172a"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="70" y="78" fill="#f8fafc" font-size="42" font-weight="700">Mathematik Atlas · Roadmap</text>
    <text x="70" y="118" fill="#94a3b8" font-size="21">Versionsräume für Mathematik, Medienerzeugung, Programmierung und Godot</text>

    <!-- Versionsschema -->
    <g filter="url(#shadow)">
      <rect x="70" y="155" width="330" height="142" rx="20" fill="#172033" stroke="#334155"/>
      <text x="96" y="190" fill="#94a3b8" font-size="16">Hauptversion</text>
      <text x="96" y="242" fill="#60a5fa" font-size="42" font-weight="700">vM</text>
      <text x="96" y="274" fill="#cbd5e1" font-size="16">Neuer fachlicher Versionsraum</text>

      <rect x="435" y="155" width="330" height="142" rx="20" fill="#172033" stroke="#334155"/>
      <text x="461" y="190" fill="#94a3b8" font-size="16">Knoten-Version</text>
      <text x="461" y="242" fill="#a78bfa" font-size="42" font-weight="700">y</text>
      <text x="461" y="274" fill="#cbd5e1" font-size="16">Neue Knoten oder Knotenfamilien</text>

      <rect x="800" y="155" width="330" height="142" rx="20" fill="#172033" stroke="#334155"/>
      <text x="826" y="190" fill="#94a3b8" font-size="16">Änderungs-Version</text>
      <text x="826" y="242" fill="#fbbf24" font-size="42" font-weight="700">x</text>
      <text x="826" y="274" fill="#cbd5e1" font-size="16">Korrekturen und sonstiger Ausbau</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="330" width="1060" height="104" rx="18" fill="#172033" stroke="#475569"/>
      <text x="100" y="369" fill="#f8fafc" font-size="21" font-weight="700">Entscheidungsregel</text>
      <text x="100" y="404" fill="#cbd5e1" font-size="17">
        <tspan fill="#a78bfa" font-weight="700">Neue Knoten vorhanden:</tspan><tspan> y erhöhen und x auf 0 setzen.</tspan>
        <tspan dx="40" fill="#fbbf24" font-weight="700">Keine neuen Knoten:</tspan><tspan> nur x erhöhen.</tspan>
      </text>
    </g>

    <!-- Timeline -->
    <line x1="600" y1="490" x2="600" y2="1658" stroke="url(#timeline)" stroke-width="8" stroke-linecap="round"/>

    <!-- v2 -->
    <g filter="url(#shadow)">
      <rect x="70" y="475" width="470" height="150" rx="20" fill="#172033" stroke="#22c55e" stroke-width="2"/>
      <rect x="94" y="497" width="104" height="35" rx="17" fill="#14532d"/>
      <text x="146" y="521" text-anchor="middle" fill="#bbf7d0" font-size="17" font-weight="700">v2.y.x</text>
      <text x="94" y="564" fill="#f8fafc" font-size="24" font-weight="700">Mathematischer Kern</text>
      <text x="94" y="595" fill="#cbd5e1" font-size="16">
        <tspan x="94">Funktionsfähige Basis, Visualisierungskonzepte,</tspan>
        <tspan x="94" dy="24">Hilbert-Geometrie und Definitionskarten.</tspan>
      </text>
      <line x1="540" y1="550" x2="592" y2="550" stroke="#22c55e" stroke-width="3"/>
      <circle cx="600" cy="550" r="14" fill="#22c55e" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- v3 -->
    <g filter="url(#shadow)">
      <rect x="660" y="645" width="470" height="150" rx="20" fill="#172033" stroke="#3b82f6" stroke-width="2"/>
      <rect x="684" y="667" width="104" height="35" rx="17" fill="#1e3a8a"/>
      <text x="736" y="691" text-anchor="middle" fill="#bfdbfe" font-size="17" font-weight="700">v3.y.x</text>
      <text x="684" y="734" fill="#f8fafc" font-size="24" font-weight="700">Grafik &amp; Dokumente</text>
      <text x="684" y="765" fill="#cbd5e1" font-size="16">
        <tspan x="684">SVG, TikZ, LaTeX, Mermaid und HTML</tspan>
        <tspan x="684" dy="24">mit gemeinsamen Knoten und Exportmodellen.</tspan>
      </text>
      <line x1="608" y1="720" x2="660" y2="720" stroke="#3b82f6" stroke-width="3"/>
      <circle cx="600" cy="720" r="14" fill="#0f172a" stroke="#3b82f6" stroke-width="6"/>
    </g>

    <!-- v4 -->
    <g filter="url(#shadow)">
      <rect x="70" y="815" width="470" height="150" rx="20" fill="#172033" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="94" y="837" width="104" height="35" rx="17" fill="#4c1d95"/>
      <text x="146" y="861" text-anchor="middle" fill="#ddd6fe" font-size="17" font-weight="700">v4.y.x</text>
      <text x="94" y="904" fill="#f8fafc" font-size="24" font-weight="700">Animation</text>
      <text x="94" y="935" fill="#cbd5e1" font-size="16">
        <tspan x="94">Manim und geeignete Alternativen auf Basis</tspan>
        <tspan x="94" dy="24">gemeinsamer Zeit-, Übergangs- und Szenenknoten.</tspan>
      </text>
      <line x1="540" y1="890" x2="592" y2="890" stroke="#8b5cf6" stroke-width="3"/>
      <rect x="590" y="880" width="20" height="20" rx="2" fill="#8b5cf6" stroke="#0f172a" stroke-width="5" transform="rotate(45 600 890)"/>
    </g>

    <!-- v5 -->
    <g filter="url(#shadow)">
      <rect x="660" y="985" width="470" height="150" rx="20" fill="#172033" stroke="#eab308" stroke-width="2"/>
      <rect x="684" y="1007" width="104" height="35" rx="17" fill="#713f12"/>
      <text x="736" y="1031" text-anchor="middle" fill="#fef08a" font-size="17" font-weight="700">v5.y.x</text>
      <text x="684" y="1074" fill="#f8fafc" font-size="24" font-weight="700">JavaScript &amp; TypeScript</text>
      <text x="684" y="1105" fill="#cbd5e1" font-size="16">
        <tspan x="684">Weblogik, Funktionen, Kontrollfluss und</tspan>
        <tspan x="684" dy="24">typisierte Programmstrukturen als Knoten.</tspan>
      </text>
      <line x1="608" y1="1060" x2="660" y2="1060" stroke="#eab308" stroke-width="3"/>
      <rect x="589" y="1049" width="22" height="22" rx="3" fill="#eab308" stroke="#0f172a" stroke-width="5"/>
    </g>

    <!-- v6 -->
    <g filter="url(#shadow)">
      <rect x="70" y="1155" width="470" height="150" rx="20" fill="#172033" stroke="#f97316" stroke-width="2"/>
      <rect x="94" y="1177" width="104" height="35" rx="17" fill="#7c2d12"/>
      <text x="146" y="1201" text-anchor="middle" fill="#fed7aa" font-size="17" font-weight="700">v6.y.x</text>
      <text x="94" y="1244" fill="#f8fafc" font-size="24" font-weight="700">Kotlin &amp; Java</text>
      <text x="94" y="1275" fill="#cbd5e1" font-size="16">
        <tspan x="94">JVM-Sprachmodelle, Klassen, Typen und</tspan>
        <tspan x="94" dy="24">gemeinsame wiederverwendbare Knotenfamilien.</tspan>
      </text>
      <line x1="540" y1="1230" x2="592" y2="1230" stroke="#f97316" stroke-width="3"/>
      <circle cx="600" cy="1230" r="14" fill="#0f172a" stroke="#f97316" stroke-width="6"/>
    </g>

    <!-- v7 -->
    <g filter="url(#shadow)">
      <rect x="660" y="1325" width="470" height="150" rx="20" fill="#172033" stroke="#06b6d4" stroke-width="2"/>
      <rect x="684" y="1347" width="104" height="35" rx="17" fill="#164e63"/>
      <text x="736" y="1371" text-anchor="middle" fill="#a5f3fc" font-size="17" font-weight="700">v7.y.x</text>
      <text x="684" y="1414" fill="#f8fafc" font-size="24" font-weight="700">Godot-Grundintegration</text>
      <text x="684" y="1445" fill="#cbd5e1" font-size="16">
        <tspan x="684">Godot-Szenen, GDScript und ein Orchestrator</tspan>
        <tspan x="684" dy="24">als Vorlage für strukturierte Szenenabläufe.</tspan>
      </text>
      <line x1="608" y1="1400" x2="660" y2="1400" stroke="#06b6d4" stroke-width="3"/>
      <rect x="590" y="1390" width="20" height="20" rx="2" fill="#06b6d4" stroke="#0f172a" stroke-width="5" transform="rotate(45 600 1400)"/>
    </g>

    <!-- v8 -->
    <g filter="url(#shadow)">
      <rect x="70" y="1495" width="470" height="150" rx="20" fill="#172033" stroke="#ef4444" stroke-width="2"/>
      <rect x="94" y="1517" width="104" height="35" rx="17" fill="#7f1d1d"/>
      <text x="146" y="1541" text-anchor="middle" fill="#fecaca" font-size="17" font-weight="700">v8.y.x</text>
      <text x="94" y="1584" fill="#f8fafc" font-size="24" font-weight="700">Godot-Erweiterungen</text>
      <text x="94" y="1615" fill="#cbd5e1" font-size="16">
        <tspan x="94">NobodyWho, Voxel Tools und LimboAI</tspan>
        <tspan x="94" dy="24">im gemeinsamen Orchestrierungsmodell.</tspan>
      </text>
      <line x1="540" y1="1570" x2="592" y2="1570" stroke="#ef4444" stroke-width="3"/>
      <circle cx="600" cy="1570" r="14" fill="#ef4444" stroke="#0f172a" stroke-width="6"/>
    </g>

    <!-- Unversioniert -->
    <g filter="url(#shadow)">
      <rect x="70" y="1710" width="1060" height="137" rx="22" fill="#172033" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8"/>
      <rect x="96" y="1734" width="132" height="34" rx="17" fill="#293548"/>
      <text x="162" y="1757" text-anchor="middle" fill="#cbd5e1" font-size="16" font-weight="700">Unversioniert</text>
      <text x="96" y="1800" fill="#f8fafc" font-size="23" font-weight="700">Weitere Programmiersprachen</text>
      <text x="96" y="1831" fill="#cbd5e1" font-size="17">C# · C++ · C · Rust · Python · weitere Sprachen und Laufzeitumgebungen</text>
    </g>

    <!-- Beispiele -->
    <g filter="url(#shadow)">
      <rect x="70" y="1885" width="515" height="135" rx="20" fill="#172033" stroke="#8b5cf6"/>
      <text x="96" y="1922" fill="#94a3b8" font-size="16">Neue Knoten nach v2.3.16</text>
      <text x="96" y="1970" fill="#c4b5fd" font-size="34" font-weight="700">v2.4.0</text>
      <text x="96" y="2000" fill="#cbd5e1" font-size="16">y steigt, x beginnt wieder bei 0</text>

      <rect x="615" y="1885" width="515" height="135" rx="20" fill="#172033" stroke="#eab308"/>
      <text x="641" y="1922" fill="#94a3b8" font-size="16">Andere Änderung nach v2.3.16</text>
      <text x="641" y="1970" fill="#fde68a" font-size="34" font-weight="700">v2.3.17</text>
      <text x="641" y="2000" fill="#cbd5e1" font-size="16">y bleibt, nur x steigt</text>
    </g>
  </g>
</svg>