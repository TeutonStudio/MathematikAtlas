name: Funktion oder Knoten vorschlagen
description: Neue Funktion, mathematisches Konzept oder Knotentyp strukturiert vorschlagen
title: "[Vorschlag] "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Welches Problem soll gelöst oder welches mathematische Konzept dargestellt werden?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Aktueller Zustand
      description: Wie wird das Problem derzeit behandelt und warum reicht das nicht aus?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Gewünschtes Verhalten
      description: Beschreibe Bedienung, Datenfluss und sichtbares Ergebnis möglichst konkret.
    validations:
      required: true
  - type: textarea
    id: math
    attributes:
      label: Mathematische Semantik
      description: Nenne Definition, Definitionsbereich, Wertebereich, Randfälle und mögliche Mehrdeutigkeiten.
  - type: textarea
    id: connections
    attributes:
      label: Knoten und Anschlüsse
      description: Welche Ein- und Ausgänge, Typen, Kardinalitäten und Inspector-Einstellungen werden benötigt?
  - type: dropdown
    id: new_node
    attributes:
      label: Entsteht ein neuer separat erzeugbarer Knotentyp?
      options:
        - Ja
        - Nein, ein vorhandener Knoten wird erweitert
        - Noch unklar
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen und Abgrenzung
      description: Welche vorhandenen Knoten, Karten oder Lösungswege wurden berücksichtigt?
