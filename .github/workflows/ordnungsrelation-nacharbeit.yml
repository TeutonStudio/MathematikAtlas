name: Ordnungsrelation Nacharbeit

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  nacharbeit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Stil und Migrationstest nacharbeiten
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def ersetze(path: str, alt: str, neu: str) -> None:
              datei = Path(path)
              text = datei.read_text()
              if text.count(alt) != 1:
                  raise SystemExit(f'{path}: erwartete genau ein Vorkommen für Nacharbeit.')
              datei.write_text(text.replace(alt, neu, 1))

          ersetze(
              'MathematikKartenAdapter/src/main/kotlin/de/TeutonStudio/MathematikKartenAdapter/KartenAuswerter.kt',
              dedent('''\
              "mathematik.gleichheit" -> mapOf("aussage" to binär("="))
              "mathematik.ordnungsrelation" -> mapOf(
                  "aussage" to binär(when (knoten.parameter["relation"]) {
                      "kleiner" -> "<"
                      "kleinerGleich" -> "\\\\le"
                      "größer" -> ">"
                      "größerGleich" -> "\\\\ge"
                      else -> error("Unbekannte Ordnungsrelation.")
                  }),
              )
              '''),
              dedent('''\
                          "mathematik.gleichheit" -> mapOf("aussage" to binär("="))
                          "mathematik.ordnungsrelation" -> mapOf(
                              "aussage" to binär(when (knoten.parameter["relation"]) {
                                  "kleiner" -> "<"
                                  "kleinerGleich" -> "\\\\le"
                                  "größer" -> ">"
                                  "größerGleich" -> "\\\\ge"
                                  else -> error("Unbekannte Ordnungsrelation.")
                              }),
                          )
              '''),
          )

          ersetze(
              'app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/konzepte/KonzeptModell.kt',
              dedent('''\
              fun fürKnoten(knoten: KnotenDaten): KonzeptDefinition? =
                  if (knoten.art == MathematikKnotenVorlagen.ORDNUNGSRELATION_ART) {
                      OrdnungsrelationDefinitionsKarten.fürKnoten(knoten)
                  } else {
                      nachArt[knoten.art]
                  }
              '''),
              dedent('''\
                  fun fürKnoten(knoten: KnotenDaten): KonzeptDefinition? =
                      if (knoten.art == MathematikKnotenVorlagen.ORDNUNGSRELATION_ART) {
                          OrdnungsrelationDefinitionsKarten.fürKnoten(knoten)
                      } else {
                          nachArt[knoten.art]
                      }
              '''),
          )

          ersetze(
              'MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt',
              dedent('''\
                  private fun vergleichVorlage(name: String, zeichen: String, relation: String) = KnotenVorlage(
                  ORDNUNGSRELATION_ART,
                  name,
                  "Aussagen: Zahlenprädikate",
                  "Vergleicht zwei Zahlterme mit $zeichen.",
                  GraphGröße(220f, 110f),
                  listOf(
                      eingang("links", MathematikAnschlussArten.Zahl.id, 0),
                      eingang("rechts", MathematikAnschlussArten.Zahl.id, 1),
                      ausgang("aussage", MathematikAnschlussArten.Aussage.id),
                  ),
                  mapOf("relation" to relation),
              )
              '''),
              dedent('''\
                  private fun vergleichVorlage(name: String, zeichen: String, relation: String) = KnotenVorlage(
                      ORDNUNGSRELATION_ART,
                      name,
                      "Aussagen: Zahlenprädikate",
                      "Vergleicht zwei Zahlterme mit $zeichen.",
                      GraphGröße(220f, 110f),
                      listOf(
                          eingang("links", MathematikAnschlussArten.Zahl.id, 0),
                          eingang("rechts", MathematikAnschlussArten.Zahl.id, 1),
                          ausgang("aussage", MathematikAnschlussArten.Aussage.id),
                      ),
                      mapOf("relation" to relation),
                  )
              '''),
          )

          ersetze(
              'MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt',
              dedent('''\
              private fun iterierteAussagenVorlage(name: String, beschreibung: String, operator: String) = KnotenVorlage(
                  ITERIERTE_AUSSAGENVERKNÜPFUNG_ART,
                  name,
                  "Operatoren",
                  beschreibung,
                  GraphGröße(270f, 120f),
                  listOf(
                      eingang("methode", MathematikAnschlussArten.AussageFunktion.id),
                      eingang("indexmenge", MathematikAnschlussArten.Menge.id, 1),
                      ausgang("aussage", MathematikAnschlussArten.Aussage.id),
                  ),
                  mapOf("operator" to operator),
              )
              '''),
              dedent('''\
                  private fun iterierteAussagenVorlage(name: String, beschreibung: String, operator: String) = KnotenVorlage(
                      ITERIERTE_AUSSAGENVERKNÜPFUNG_ART,
                      name,
                      "Operatoren",
                      beschreibung,
                      GraphGröße(270f, 120f),
                      listOf(
                          eingang("methode", MathematikAnschlussArten.AussageFunktion.id),
                          eingang("indexmenge", MathematikAnschlussArten.Menge.id, 1),
                          ausgang("aussage", MathematikAnschlussArten.Aussage.id),
                      ),
                      mapOf("operator" to operator),
                  )
              '''),
          )

          testpfad = Path('app/src/test/kotlin/de/TeutonStudio/MathematikAtlas/OrdnungsrelationDefinitionsKarteTest.kt')
          test = testpfad.read_text().replace(
              'import de.TeutonStudio.KnotenKartenVerwalter.daten.GraphPunkt',
              'import de.TeutonStudio.KnotenKartenVerwalter.daten.*',
          )
          marker = '\n    @Test\n    fun `Knotendefinition folgt der ausgewählten Relation`() {'
          migrationstest = dedent('''

              @Test
              fun `alte Vergleichsarten werden ohne Anschlussverlust migriert`() {
                  val alt = MathematikKnotenVorlagen.Kleiner.erzeuge(GraphPunkt.Zero).copy(
                      art = "mathematik.kleiner",
                      parameter = emptyMap(),
                  )
                  val verbindung = VerbindungDaten(
                      von = AnschlussVerweis(KnotenId("quelle"), AnschlussId("ausgang")),
                      zu = AnschlussVerweis(alt.id, alt.anschlüsse.first { it.name == "links" }.id),
                  )
                  val migriert = migriereOrdnungsrelation(
                      KartenDaten(knoten = listOf(alt), verbindungen = listOf(verbindung)),
                  )
                  val neu = migriert.knoten.single()

                  assertEquals(MathematikKnotenVorlagen.ORDNUNGSRELATION_ART, neu.art)
                  assertEquals("kleiner", neu.parameter["relation"])
                  assertEquals(alt.id, neu.id)
                  assertEquals(alt.anschlüsse, neu.anschlüsse)
                  assertEquals(listOf(verbindung), migriert.verbindungen)
              }
          ''').rstrip()
          if test.count(marker) != 1:
              raise SystemExit('Einfügemarke für den Migrationstest fehlt.')
          testpfad.write_text(test.replace(marker, migrationstest + marker, 1))
          PY

      - name: Repository prüfen
        run: python3 scripts/pruefe_repository.py

      - name: Tests
        run: ./gradlew test

      - name: Debug-App bauen
        run: ./gradlew :app:assembleDebug

      - name: Nacharbeit committen
        shell: bash
        run: |
          rm .github/workflows/ordnungsrelation-nacharbeit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bereinigt Ordnungsrelation-Umsetzung"
          git push origin HEAD:${{ github.head_ref }}
