name: Agent Small Issues Batch

on:
  push:
    branches:
      - agent/resolve-small-issues-batch

permissions:
  contents: write

jobs:
  implementieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolve-small-issues-batch
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK vorbereiten
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Änderungen anwenden und prüfen
        id: pruefung
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python3 scripts/agent_resolve_small_issues.py
            python3 scripts/pruefe_architektur.py
            ./gradlew --stacktrace test :app:assembleDebug
          } 2>&1 | tee /tmp/agent-small-issues.log
      - name: Fehlerbericht schreiben
        if: steps.pruefung.outcome == 'failure'
        run: |
          cp /tmp/agent-small-issues.log /tmp/agent-small-issues-full.log
          git reset --hard HEAD
          tail -n 400 /tmp/agent-small-issues-full.log > agent-small-issues-failure.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-small-issues-failure.txt
          git commit -m 'chore: record small-issues batch failure'
          git push origin HEAD:agent/resolve-small-issues-batch
      - name: Implementierung committen
        if: steps.pruefung.outcome == 'success'
        run: |
          rm -f agent-small-issues-failure.txt
          rm scripts/agent_resolve_small_issues.py
          rm .github/workflows/agent-small-issues-batch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement small issue batch'
          git push origin HEAD:agent/resolve-small-issues-batch
      - name: Lauf als fehlgeschlagen markieren
        if: steps.pruefung.outcome == 'failure'
        run: exit 1
