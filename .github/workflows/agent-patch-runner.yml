name: Agent Patch Runner

on:
  pull_request:
    branches:
      - agent/patch-runner

permissions:
  contents: write

jobs:
  anwenden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Patch-Pull-Request auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch und Commitnachricht sichern
        run: |
          cp .agent-patch/change.patch "$RUNNER_TEMP/change.patch"
          cp .agent-patch/message.txt "$RUNNER_TEMP/message.txt"
      - name: Aktuellen Releasebranch auschecken
        run: |
          git fetch origin release/v2.16.0-offene-issues
          git checkout -B release/v2.16.0-offene-issues origin/release/v2.16.0-offene-issues
      - name: Patch prüfen und anwenden
        run: |
          git apply --check --whitespace=error-all "$RUNNER_TEMP/change.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/change.patch"
      - name: Einzelnen Issue-Commit veröffentlichen
        run: |
          git config user.name "TeutonStudio Agent"
          git config user.email "46108494+TeutonStudio@users.noreply.github.com"
          git commit -F "$RUNNER_TEMP/message.txt"
          git push origin HEAD:release/v2.16.0-offene-issues
