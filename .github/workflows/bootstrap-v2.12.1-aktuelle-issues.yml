name: Bootstrap v2.12.1 aktuelle Issues

on:
  push:
    branches:
      - agent/v2.12.1-aktuelle-issues

permissions:
  contents: write

jobs:
  umsetzen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Issues 59 und 61 umsetzen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (root / path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: erwartete genau 1 Fundstelle, gefunden {count}")
              return text.replace(old, new, 1)

          # Issue #59: Adjunktion konsistent mit einem ausgefüllten Punkt darstellen.
          for path in root.rglob('*.kt'):
              text = path.read_text(encoding='utf-8')
              neu = text.replace(
                  r'\\stackrel{\\circ}{\\lor}',
                  r'\\stackrel{\\bullet}{\\lor}',
              ).replace(
                  r'\\stackrel{\\circ}{\\bigvee}',
                  r'\\stackrel{\\bullet}{\\bigvee}',
              )
              if neu != text:
                  path.write_text(neu, encoding='utf-8')

          latex_path = 'MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/LatexText.kt'
          text = read(latex_path)
          text = replace_once(text, 'ausgabe.append("∨̊")', 'ausgabe.append("∨̇")', 'binäre Adjunktion im Latex-Renderer')
          text = replace_once(text, 'ausgabe.append("⋁̊")', 'ausgabe.append("⋁̇")', 'iterierte Adjunktion im Latex-Renderer')
          text = replace_once(
              text,
              '"circ" to "∘", "forall" to "∀"',
              '"circ" to "∘", "bullet" to "•", "forall" to "∀"',
              'bullet-Befehl im Latex-Renderer',
          )
          write(latex_path, text)

          adapter_path = 'MathematikKartenAdapter/src/main/kotlin/de/TeutonStudio/MathematikKartenAdapter/KartenAuswerter.kt'
          text = read(adapter_path)
          text = replace_once(
              text,
              '            "mathematik.konjunktion", "mathematik.adjunktion" -> mapOf("aussage" to geordnet().joinToString(" \\\\land "))',
              '            "mathematik.konjunktion" -> mapOf("aussage" to geordnet().joinToString(" \\\\land "))\n'
              '            "mathematik.adjunktion" -> mapOf("aussage" to geordnet().joinToString(" \\\\stackrel{\\\\bullet}{\\\\lor} "))',
              'Adjunktionsdarstellung im Kartenadapter',
          )
          write(adapter_path, text)

          # Issue #61: graue, einsbasierte Zeilennummer links in beiden Wahrheitstabellen.
          dialog_path = 'app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/AussagenOperatorDialog.kt'
          text = read(dialog_path)
          text = replace_once(
              text,
              'private val ERGEBNIS_ZELLEN_BREITE = 136.dp\nprivate val TABELLEN_TRENNER_BREITE = 2.dp',
              'private val ERGEBNIS_ZELLEN_BREITE = 136.dp\nprivate val ZEILENINDEX_ZELLEN_BREITE = 56.dp\nprivate val TABELLEN_TRENNER_BREITE = 2.dp',
              'Breite der direkten Zeilenindexspalte',
          )
          breite_alt = '''val tabellenBreite = EINGANGS_ZELLEN_BREITE * {anzahl}.toFloat() +
        TABELLEN_TRENNER_BREITE + ERGEBNIS_ZELLEN_BREITE'''
          for anzahl in ('anzahlEingänge', 'eingänge.size'):
              old = breite_alt.format(anzahl=anzahl)
              new = f'''val tabellenBreite = ZEILENINDEX_ZELLEN_BREITE +
        EINGANGS_ZELLEN_BREITE * {anzahl}.toFloat() +
        TABELLEN_TRENNER_BREITE + ERGEBNIS_ZELLEN_BREITE'''
              text = replace_once(text, old, new, f'Tabellenbreite für {anzahl}')
          text = replace_once(
              text,
              '                    Row(Modifier.height(IntrinsicSize.Min)) {\n                        eingänge.indices.forEach { index -> TabellenKopfZelle("A${index + 1}") }',
              '                    Row(Modifier.height(IntrinsicSize.Min)) {\n                        TabellenKopfZelle("Nr.", ZEILENINDEX_ZELLEN_BREITE)\n                        eingänge.indices.forEach { index -> TabellenKopfZelle("A${index + 1}") }',
              'Kopf der direkten Wahrheitstabelle',
          )
          text = replace_once(
              text,
              '                            Row(Modifier.height(IntrinsicSize.Min)) {\n                                zeile.eingänge.forEach { wert -> WahrheitswertZelle(wert) }',
              '                            Row(Modifier.height(IntrinsicSize.Min)) {\n                                TabellenIndexZelle(zeile.index + BigInteger.ONE)\n                                zeile.eingänge.forEach { wert -> WahrheitswertZelle(wert) }',
              'Zeilen der direkten Wahrheitstabelle',
          )
          index_funktion = '''@Composable
private fun TabellenIndexZelle(index: BigInteger) {
    Box(
        Modifier.width(ZEILENINDEX_ZELLEN_BREITE).padding(horizontal = 8.dp, vertical = 8.dp),
        contentAlignment = Alignment.Center,
    ) {
        Text(
            index.toString(),
            style = MaterialTheme.typography.bodySmall,
            color = MaterialTheme.colorScheme.onSurfaceVariant,
        )
    }
}

'''
          text = replace_once(
              text,
              '@Composable\nprivate fun TabellenKopfZelle',
              index_funktion + '@Composable\nprivate fun TabellenKopfZelle',
              'Indexzelle der direkten Wahrheitstabelle',
          )
          write(dialog_path, text)

          karten_tabelle_path = 'app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/KartenWahrheitstabellenTabelle.kt'
          text = read(karten_tabelle_path)
          text = replace_once(
              text,
              'internal val KARTEN_ERGEBNIS_ZELLEN_BREITE = 152.dp\ninternal val KARTEN_TABELLEN_TRENNER_BREITE = 2.dp',
              'internal val KARTEN_ERGEBNIS_ZELLEN_BREITE = 152.dp\ninternal val KARTEN_ZEILENINDEX_ZELLEN_BREITE = 56.dp\ninternal val KARTEN_TABELLEN_TRENNER_BREITE = 2.dp',
              'Breite der Karten-Zeilenindexspalte',
          )
          text = replace_once(
              text,
              '                Row(Modifier.height(IntrinsicSize.Min)) {\n                    for (feld in eingänge) {',
              '                Row(Modifier.height(IntrinsicSize.Min)) {\n                    KartenTabellenKopfZelle("Nr.", KARTEN_ZEILENINDEX_ZELLEN_BREITE)\n                    for (feld in eingänge) {',
              'Kopf der Karten-Wahrheitstabelle',
          )
          text = replace_once(
              text,
              '                    Row(Modifier.height(IntrinsicSize.Min)) {\n                        for (wert in zeile.eingänge) {',
              '                    Row(Modifier.height(IntrinsicSize.Min)) {\n                        KartenTabellenIndexZelle(zeile.index + BigInteger.ONE)\n                        for (wert in zeile.eingänge) {',
              'Zeilen der Karten-Wahrheitstabelle',
          )
          karten_index_funktion = '''@Composable
private fun KartenTabellenIndexZelle(index: BigInteger) {
    Box(
        Modifier.width(KARTEN_ZEILENINDEX_ZELLEN_BREITE).padding(horizontal = 8.dp, vertical = 8.dp),
        contentAlignment = Alignment.Center,
    ) {
        Text(
            index.toString(),
            style = MaterialTheme.typography.bodySmall,
            color = MaterialTheme.colorScheme.onSurfaceVariant,
        )
    }
}

'''
          text = replace_once(
              text,
              '@Composable\nprivate fun KartenTabellenKopfZelle',
              karten_index_funktion + '@Composable\nprivate fun KartenTabellenKopfZelle',
              'Indexzelle der Karten-Wahrheitstabelle',
          )
          write(karten_tabelle_path, text)

          karten_dialog_path = 'app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/KartenWahrheitstabellenDialog.kt'
          text = read(karten_dialog_path)
          text = replace_once(
              text,
              '    val tabellenBreite = KARTEN_EINGANGS_ZELLEN_BREITE * freieLogischeEingänge.size.toFloat() +',
              '    val tabellenBreite = KARTEN_ZEILENINDEX_ZELLEN_BREITE +\n        KARTEN_EINGANGS_ZELLEN_BREITE * freieLogischeEingänge.size.toFloat() +',
              'Breite der Karten-Wahrheitstabelle',
          )
          write(karten_dialog_path, text)

          # Release v2.12.1 als x-Schritt.
          gradle_path = 'app/build.gradle.kts'
          text = read(gradle_path)
          text = replace_once(text, 'versionCode = 2012000', 'versionCode = 2012001', 'Android versionCode')
          text = replace_once(text, 'versionName = "2.12.0"', 'versionName = "2.12.1"', 'Android versionName')
          write(gradle_path, text)

          roadmap_path = 'release/roadmap.toml'
          text = read(roadmap_path)
          text = replace_once(text, 'current_version = "2.12.0"', 'current_version = "2.12.1"', 'aktuelle Releaseversion')
          eintrag = '''

[[releases]]
version = "2.12.1"
title = "Adjunktionssymbol und nummerierte Wahrheitstabellen"
roadmap = "v2.12.x Aussagenlogik und Bedienoberfläche"
status = "released"
previous_release = "2.12.0"
branch = "agent/v2.12.1-aktuelle-issues"
kind = "fix"
version_axis = "x"
reason = "Korrigiert die sichtbare Adjunktion konsistent auf einen ausgefüllten Punkt, behebt die fehlerhafte UND-Darstellung im Kartenadapter und ergänzt graue Zeilenindizes in direkten sowie kartenbasierten Wahrheitstabellen, ohne einen neuen Knotentyp einzuführen."
'''
          if 'version = "2.12.1"' in text:
              raise SystemExit('Release 2.12.1 ist bereits im Plan vorhanden.')
          write(roadmap_path, text.rstrip() + eintrag)

          plan = root / 'docs/codex/plans/completed/2026-08-01-v2.12.1-aktuelle-issues.md'
          plan.write_text('''# v2.12.1 Adjunktionssymbol und nummerierte Wahrheitstabellen

## Umfang

- Issue #59: `\\stackrel{\\bullet}{\\lor}` und die entsprechende große Adjunktion werden im Rechenkern, Renderer, Dialog und Kartenadapter konsistent verwendet.
- Issue #61: Direkte und kartenbasierte Wahrheitstabellen erhalten links eine graue, einsbasierte Zeilennummer.
- Issue #60 ist bereits durch v2.11.1 umgesetzt und benötigt keine erneute Codeänderung.
- Issues #63 und #64 bleiben eigenständige Architekturvorhaben.

## Abnahme

- Keine Adjunktionsdarstellung verwendet weiterhin `\\stackrel{\\circ}`.
- Der Kartenadapter überschreibt Adjunktion nicht mehr als Konjunktion.
- Tabellenbreiten berücksichtigen die neue Indexspalte.
- Releaseplan, Architekturprüfung, Tests und Debug-Build sind erfolgreich.
''', encoding='utf-8')

          workflow = root / '.github/workflows/bootstrap-v2.12.1-aktuelle-issues.yml'
          workflow.unlink()
          PY
      - name: Veraltete Adjunktionsnotation ausschließen
        run: |
          if grep -R --line-number --fixed-strings '\\stackrel{\\circ}' \
            MathematikRechenSystem/src MathematikKartenAdapter/src MathematikKnoten/src app/src; then
            echo 'Veraltete Adjunktionsnotation gefunden.' >&2
            exit 1
          fi
      - name: Releaseplan prüfen
        run: python3 scripts/pruefe_releaseplan.py
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Einzelnen Produktcommit erzeugen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          basis="$(git rev-parse HEAD^)"
          git add -A
          git reset --soft "$basis"
          git commit -m "v2.12.1 Adjunktionssymbol und nummerierte Wahrheitstabellen"
          git push --force-with-lease origin HEAD:agent/v2.12.1-aktuelle-issues
