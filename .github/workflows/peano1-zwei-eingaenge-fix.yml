name: Peano1Fix

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/fix-peano1-zwei-eingaenge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch anwenden
        run: |
          echo '' | base64 -d > /tmp/peano_patch.py
          python3 /tmp/peano_patch.py
      - name: Rechenkern testen
        run: ./gradlew :MathematikRechenSystem:test --stacktrace
      - name: Definitionskarten testen
        run: ./gradlew :app:testDebugUnitTest --tests '*AxiomPraedikatDefinitionsKartenTest*' --stacktrace
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/peano1-zwei-eingaenge-fix.yml
          git add MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatoren.kt
          git add MathematikRechenSystem/src/test/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatorenTest.kt
          git commit -m 'fix: Peano 1 auf Menge und Multiplikation reduzieren'
          git push origin HEAD:agent/fix-peano1-zwei-eingaenge
