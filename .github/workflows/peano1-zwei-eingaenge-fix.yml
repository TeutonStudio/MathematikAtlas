name: Peano1Fix

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/fix-peano1-zwei-eingaenge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Peano 1 korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          axiom_path = Path("MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatoren.kt")
          text = axiom_path.read_text()

          if "private fun neutralesElementExistiertAussage" not in text:
              marker = "    private fun inversAussage("
              index = text.index(marker)
              helper = '''    private fun neutralesElementExistiertAussage(menge: MengenAusdruck, op: Methode): Aussage? =
              endlich(menge) { elemente ->
                  val kandidaten = elemente.map { neutral ->
                      checkNotNull(neutralAussage(menge, op, neutral))
                  }
                  when (kandidaten.size) {
                      0 -> WahrheitsKonstante(false)
                      1 -> kandidaten.single()
                      else -> Disjunktion(kandidaten)
                  }
              }

          '''
              text = text[:index] + helper + text[index:]

          start = text.index('        d(\n            "axiom.peano.null"')
          end = text.index('        d(\n            "axiom.peano.nachfolgerAbgeschlossen"', start)
          peano = r'''        d(
              "axiom.peano.null", "Peano 1 · Neutrales Element", setOf("peano"), "Natürliche Zahlen · Peano",
              "\\exists e\\in M:\\;\\forall n\\in M:\\;e\\cdot n=n=n\\cdot e",
              setOf("Peano 1", "neutrales Element", "Identität", "Null gehört zu N"),
              a("menge", AxiomArgumentArt.MENGE),
              a("multiplikation", AxiomArgumentArt.METHODE, 2),
          ) { w ->
              val n = menge(w, 0); val mal = methode(w, 1)
              instanz(
                  "axiom.peano.null",
                  "Peano 1 · Neutrales Element",
                  setOf("peano"),
                  "\\exists e\\in${n.zuLatex()}:\\;\\forall n\\in${n.zuLatex()}:\\;${mal.name}(e,n)=n=${mal.name}(n,e)",
                  runCatching { neutralesElementExistiertAussage(n, mal) }.getOrNull(),
              )
          },
          '''
          axiom_path.write_text(text[:start] + peano + text[end:])

          test_path = Path("MathematikRechenSystem/src/test/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatorenTest.kt")
          test = test_path.read_text()
          start = test.index("    @Test\n    fun `Peano 1")
          end = test.index("    @Test\n    fun `Peano Nachfolgerabschluss", start)
          replacement = r'''    @Test
              fun `Peano 1 hat nur Menge und Multiplikation und fordert ein internes neutrales Element`() {
                  val singleton = EndlicheMenge(setOf(RationaleZahl.Null))
                  val mitNeutral = konstanteBinaereOperation(singleton, RationaleZahl.Null)
                  val ohneNeutral = konstanteBinaereOperation(zweiElemente, RationaleZahl.Null)
                  val definition = checkNotNull(AxiomOperatoren.vonIdOderNull("axiom.peano.null"))

                  assertEquals(listOf("menge", "multiplikation"), definition.argumente.map(AxiomArgument::rolle))
                  assertEquals("Peano 1 · Neutrales Element", definition.titel)

                  val wahr = definition.werteAus(
                      mapOf<String, MathematischesObjekt>(
                          "menge" to singleton,
                          "multiplikation" to mitNeutral,
                      ),
                  )
                  val falsch = definition.werteAus(
                      mapOf<String, MathematischesObjekt>(
                          "menge" to zweiElemente,
                          "multiplikation" to ohneNeutral,
                      ),
                  )

                  assertEquals(Wahrheitswert.Wahr, wahr.entscheide().wahrheitswert)
                  assertEquals(Wahrheitswert.Lüge, falsch.entscheide().wahrheitswert)
                  assertTrue(wahr.zuLatex().contains("\\exists e\\in"))
              }

          '''
          test_path.write_text(test[:start] + replacement + test[end:])
          PY

      - name: Rechenkern testen
        run: ./gradlew :MathematikRechenSystem:test --stacktrace

      - name: Knoten-Schnittstelle testen
        run: ./gradlew :MathematikKnoten:testDebugUnitTest --stacktrace

      - name: Definitionskartengenerator strukturell prüfen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/konzepte/AxiomPraedikatDefinitionsKarten.kt').read_text()
          assert 'val schnittstelle = praedikatAnschluesse(definition)' in text
          assert 'definition.argumente[index]' in text
          print('Definitionskarte wird weiterhin direkt aus der Axiom-Schnittstelle erzeugt.')
          PY

      - name: Korrektur committen
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/peano1-zwei-eingaenge-fix.yml .github/workflows/peano1-diagnose.yml
          git add MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatoren.kt
          git add MathematikRechenSystem/src/test/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatorenTest.kt
          git commit -m 'fix: Peano 1 auf Menge und Multiplikation reduzieren'
          git push origin HEAD:agent/fix-peano1-zwei-eingaenge
