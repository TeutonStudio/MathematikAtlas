name: Zahlenrechner v2.21.0 einmalig korrigieren

on:
  push:
    branches: [agent/v2.21.0-universeller-zahlenrechner]

permissions:
  contents: write

jobs:
  korrigieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.21.0-universeller-zahlenrechner
      - name: Korrekturen anwenden
        run: python3 scripts/korrigiere_zahlenrechner_v2_21_0.py
      - name: Hilfsdateien entfernen und Ergebnis speichern
        run: |
          git rm .github/workflows/zahlenrechner-v2-21-korrektur-einmalig.yml scripts/korrigiere_zahlenrechner_v2_21_0.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MathematikRechenSystem MathematikKnoten app
          git commit -m "Zahlenrechner-Integration nach CI korrigieren"
          git push origin HEAD:agent/v2.21.0-universeller-zahlenrechner
