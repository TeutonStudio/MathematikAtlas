name: v2.16.1 im Releaseplan reservieren

on:
  push:
    branches:
      - release/v2.16.1-strukturvertraege

permissions:
  contents: write

jobs:
  reservieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.16.1-strukturvertraege
          fetch-depth: 0

      - name: Roadmap aktualisieren und Werkzeug entfernen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('release/roadmap.toml')
          text = path.read_text()
          text = text.replace('current_version = "2.16.0"', 'current_version = "2.16.1"', 1)
          block = '''

[[releases]]
version = "2.16.1"
title = "Kartesische Tupel und gemeinsame Strukturverträge"
roadmap = "v2.16.x Strukturverträge und lineare Algebra"
status = "planned"
previous_release = "2.16.0"
branch = "release/v2.16.1-strukturvertraege"
kind = "feature"
version_axis = "x"
reason = "Erweitert bestehende mathematische Laufzeittypen um zentrale Struktur-, Komponenten- und Tensorverträge, ohne einen neuen registrierten Knotentyp einzuführen."
'''
          if 'version = "2.16.1"' not in text:
              text = text.rstrip() + block + '\n'
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reserve-v2.16.1.yml .github/release-v2.16.1.trigger
          git add release/roadmap.toml
          git commit -m "chore: v2.16.1 im Releaseplan reservieren"
          git push origin HEAD:release/v2.16.1-strukturvertraege
