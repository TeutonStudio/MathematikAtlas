name: Android-Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug

  v2115-anwenden:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v2.1.15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.1.15
          fetch-depth: 0
      - name: Kartenparameter und Mengenknoten implementieren
        run: |
          python3 .github/scripts/fix_apply_v2_1_15.py
          python3 .github/scripts/apply_v2_1_15.py > /tmp/v2_1_15_apply.log 2>&1
      - name: Patchfehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-1-15-apply-log
          path: /tmp/v2_1_15_apply.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Änderungen prüfen
        run: |
          set -o pipefail
          python3 scripts/pruefe_architektur.py 2>&1 | tee /tmp/v2_1_15_build.log
          ./gradlew --stacktrace test :app:assembleDebug 2>&1 | tee -a /tmp/v2_1_15_build.log
      - name: Buildfehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-1-15-build-log
          path: /tmp/v2_1_15_build.log
      - name: Quelländerungen speichern
        run: |
          git checkout origin/master -- .github/workflows/build.yml
          git rm .github/scripts/apply_v2_1_15.py .github/scripts/fix_apply_v2_1_15.py
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add \
            MathematikKartenAdapter/src/main/kotlin/de/TeutonStudio/MathematikKartenAdapter/Auswertung.kt \
            MathematikKartenAdapter/src/main/kotlin/de/TeutonStudio/MathematikKartenAdapter/KartenAuswerter.kt \
            MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikAuswerter.kt \
            MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt \
            MathematikKnoten/src/test/kotlin/de/TeutonStudio/MathematikKnoten/MengenKnotenTest.kt \
            MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/Mengen.kt \
            MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/Funktionen.kt \
            MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/Wertebereiche.kt \
            .github/workflows/build.yml
          git diff --cached --check
          git commit -m "Implementiere Kartenparameter und Mengenknoten"
          git push origin HEAD:agent/v2.1.15
