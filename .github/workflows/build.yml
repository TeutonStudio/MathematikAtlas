name: Android-Build

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Exporter varianten- und dateisystemfest machen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/test/kotlin/de/TeutonStudio/MathematikAtlas/RestmigrationExportTest.kt')
          text = path.read_text()
          text = text.replace(
              'wissensId = eintrag.id.wert,\n                    konzept = konzept,',
              'wissensId = eintrag.id.wert,\n                    variantenId = variantenId,\n                    konzept = konzept,',
          )
          text = text.replace(
              'private fun exportiereKonzept(\n        wissensId: String,\n        konzept: KonzeptDefinition,',
              'private fun exportiereKonzept(\n        wissensId: String,\n        variantenId: String,\n        konzept: KonzeptDefinition,',
          )
          text = text.replace(
              'exportiereKarte(\n                wissensId,\n                reiter,',
              'exportiereKarte(\n                wissensId,\n                variantenId,\n                reiter,',
          )
          text = text.replace(
              'exportiereKarte(\n                    wissensId,\n                    reiter,',
              'exportiereKarte(\n                    wissensId,\n                    variantenId,\n                    reiter,',
          )
          text = text.replace(
              'private fun exportiereKarte(\n        wissensId: String,\n        reiter: KonzeptReiter,',
              'private fun exportiereKarte(\n        wissensId: String,\n        variantenId: String,\n        reiter: KonzeptReiter,',
          )
          text = text.replace(
              'val referenzId = "$wissensId.${reiter.id}$suffix"',
              'val variantenSchluessel = variantenId.hashCode().toUInt().toString(16)\n        val referenzId = "$wissensId.$variantenSchluessel.${reiter.id}$suffix"',
          )
          text = text.replace(
              'val datei = "${slug(referenzId)}-v1.json"',
              'val dateiSchluessel = "$referenzId:${text.hashCode()}".hashCode().toUInt().toString(16)\n        val datei = "konzeptkarte-$dateiSchluessel-v1.json"',
          )
          path.write_text(text)
          PY
      - name: Bauen, testen und Restbestand exportieren
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Quellstand für Restmigration verpacken
        if: always()
        run: |
          mkdir -p build/restmigration-export
          tar --exclude=.git --exclude='./build' --exclude='*/build' -czf build/restmigration-export/quellstand.tar.gz .
      - name: Restmigration-Inventar hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restmigration-export
          path: build/restmigration-export
          if-no-files-found: error
          retention-days: 1
