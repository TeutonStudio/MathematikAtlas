name: Einmalige Releasebranch-Korrektur

on:
  push:
    branches:
      - release/v2.25.2-auswerten-aufloesen

permissions:
  contents: write

jobs:
  korrigieren:
    if: ${{ !contains(github.event.head_commit.message, '[releasebranch-korrigiert]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.25.2-auswerten-aufloesen
          fetch-depth: 0
      - name: Releaseplan korrigieren
        run: python3 scripts/agent_fix_release_branch.py
      - name: Korrektur committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Releasebranch für v2.25.2 korrigieren [releasebranch-korrigiert]"
          git push origin HEAD:release/v2.25.2-auswerten-aufloesen
