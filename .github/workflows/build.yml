name: Android-Build

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace test :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
      - name: Gradle-Protokoll bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn
          retention-days: 1
