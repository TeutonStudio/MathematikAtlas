name: Android-Build

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Tupelargument-Reihenfolge finalisieren
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/resolve-small-issues-batch'
        run: python3 scripts/finalize_tuple_argument_order.py
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Geprüfte Reihenfolge zurückschreiben
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/resolve-small-issues-batch'
        run: |
          rm -f scripts/finalize_tuple_argument_order.py
          git show origin/master:.github/workflows/build.yml > .github/workflows/build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize tuple argument ordering'
            git push origin HEAD:agent/resolve-small-issues-batch
          fi
