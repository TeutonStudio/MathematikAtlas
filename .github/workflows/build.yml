name: Android-Build

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quellbaum verpacken
        run: tar --exclude=.git -czf "$RUNNER_TEMP/MathematikAtlas-abschluss-source.tar.gz" .
      - name: Quellbaum als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: MathematikAtlas-abschluss-source
          path: ${{ runner.temp }}/MathematikAtlas-abschluss-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
