name: Android-Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  v2113-anwenden:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v2.1.13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.1.13
          fetch-depth: 0
      - name: Fallunterscheidung umbauen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          vorlagen = Path('MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt')
          text = vorlagen.read_text()
          text, count = re.subn(
              r'    val Fall = KnotenVorlage\(\n.*?\n    \)\n    val Konjunktion',
              '''    val Fall = KnotenVorlage(
                  "mathematik.fall", "Fallunterscheidung", "Steuerung", "Wählt abhängig vom Wahrheitswert einer Aussage einen von zwei beliebigen Werten aus.", GraphGröße(260f, 150f),
                  listOf(
                      eingang("wahr", MathematikAnschlussArten.Objekt.id, 0),
                      eingang("aussage", MathematikAnschlussArten.Aussage.id, 1),
                      eingang("lüge", MathematikAnschlussArten.Objekt.id, 2),
                      ausgang("wert", MathematikAnschlussArten.Objekt.id),
                  ),
              )
              val Konjunktion''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Fall-Vorlage wurde nicht eindeutig gefunden.')
          vorlagen.write_text(text)

          auswerter = Path('MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikAuswerter.kt')
          text = auswerter.read_text()
          text, count = re.subn(
              r'        registriere\("mathematik\.fall"\) \{ k ->\n.*?\n        \}\n        registriere\("mathematik\.konjunktion"\)',
              '''        registriere("mathematik.fall") { k ->
                  val wahr = k.eingänge["wahr"] ?: error("Wahr-Eingang fehlt.")
                  val lüge = k.eingänge["lüge"] ?: error("Lüge-Eingang fehlt.")
                  val aussageWert = k.eingänge["aussage"] ?: error("Aussage-Eingang fehlt.")
                  val aussage = aussageWert.objekt as? Aussage ?: error("Der Aussage-Eingang enthält keine Aussage.")
                  val kontext = k.rechenKontext.copy(annahmen = k.rechenKontext.annahmen + aussageWert.annahmen)
                  val ausgewählt = when (aussage.entscheide(kontext).wahrheitswert) {
                      Wahrheitswert.Wahr -> wahr
                      Wahrheitswert.Falsch -> lüge
                      null -> error("Die Aussage der Fallunterscheidung ist im aktuellen Rechenkontext nicht entscheidbar.")
                  }
                  KnotenAuswertungsErgebnis(mapOf(
                      "wert" to ausgewählt.copy(annahmen = ausgewählt.annahmen + aussageWert.annahmen),
                  ))
              }
              registriere("mathematik.konjunktion")''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Fall-Auswerter wurde nicht eindeutig gefunden.')
          auswerter.write_text(text)

          Path('MathematikKnoten/src/test/kotlin/de/TeutonStudio/MathematikKnoten/FallunterscheidungTest.kt').write_text('''package de.TeutonStudio.MathematikKnoten

          import de.TeutonStudio.KnotenKartenVerwalter.daten.AnschlussRichtung
          import de.TeutonStudio.KnotenKartenVerwalter.daten.GraphPunkt
          import de.TeutonStudio.MathematikKartenAdapter.BedingterWert
          import de.TeutonStudio.MathematikKartenAdapter.KnotenAuswertungsKontext
          import de.TeutonStudio.MathematikRechenSystem.kern.EndlicheMenge
          import de.TeutonStudio.MathematikRechenSystem.kern.Gleichheit
          import de.TeutonStudio.MathematikRechenSystem.kern.RationaleZahl
          import de.TeutonStudio.MathematikRechenSystem.kern.RechenKontext
          import de.TeutonStudio.MathematikRechenSystem.kern.Variable
          import de.TeutonStudio.MathematikRechenSystem.kern.WahrheitsKonstante
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertFailsWith

          class FallunterscheidungTest {
              private val register = StandardMathematikAuswerter.erzeugeRegister()

              @Test
              fun `Aussage liegt zwischen Wahr- und Lüge-Eingang`() {
                  val knoten = MathematikKnotenVorlagen.Fall.erzeuge(GraphPunkt.Zero)
                  val eingänge = knoten.anschlüsse.filter { it.richtung == AnschlussRichtung.Eingang }.sortedBy { it.reihenfolge }
                  val ausgänge = knoten.anschlüsse.filter { it.richtung == AnschlussRichtung.Ausgang }

                  assertEquals(listOf("wahr", "aussage", "lüge"), eingänge.map { it.name })
                  assertEquals(listOf(MathematikAnschlussArten.Objekt.id, MathematikAnschlussArten.Aussage.id, MathematikAnschlussArten.Objekt.id), eingänge.map { it.art })
                  assertEquals(listOf("wert"), ausgänge.map { it.name })
                  assertEquals(MathematikAnschlussArten.Objekt.id, ausgänge.single().art)
              }

              @Test
              fun `wahre Aussage wählt ersten Alles-Eingang`() {
                  val ergebnis = werteAus(
                      wahr = BedingterWert(RationaleZahl.von(7)),
                      aussage = BedingterWert(WahrheitsKonstante(true)),
                      lüge = BedingterWert(EndlicheMenge(setOf(RationaleZahl.Eins))),
                  )
                  assertEquals(RationaleZahl.von(7), ergebnis.objekt)
              }

              @Test
              fun `falsche Aussage wählt zweiten Alles-Eingang`() {
                  val falschWert = EndlicheMenge(setOf(RationaleZahl.von(2), RationaleZahl.von(3)))
                  val ergebnis = werteAus(
                      wahr = BedingterWert(RationaleZahl.von(7)),
                      aussage = BedingterWert(WahrheitsKonstante(false)),
                      lüge = BedingterWert(falschWert),
                  )
                  assertEquals(falschWert, ergebnis.objekt)
              }

              @Test
              fun `unentscheidbare Aussage liefert einen klaren Fehler`() {
                  assertFailsWith<IllegalStateException> {
                      werteAus(
                          wahr = BedingterWert(RationaleZahl.Eins),
                          aussage = BedingterWert(Gleichheit(Variable("x"), RationaleZahl.Eins)),
                          lüge = BedingterWert(RationaleZahl.Null),
                      )
                  }
              }

              private fun werteAus(wahr: BedingterWert, aussage: BedingterWert, lüge: BedingterWert): BedingterWert {
                  val knoten = MathematikKnotenVorlagen.Fall.erzeuge(GraphPunkt.Zero)
                  return register.finde(knoten.art)!!.auswerten(
                      KnotenAuswertungsKontext(knoten, mapOf("wahr" to wahr, "aussage" to aussage, "lüge" to lüge), RechenKontext()),
                  ).ausgaben.getValue("wert")
              }
          }
          '''.replace('\n          ', '\n').lstrip())

          Path('.github/workflows/v2-1-13-apply.yml').unlink(missing_ok=True)
          Path('.github/workflows/build.yml').write_text('''name: Android-Build

          on:
            push:
            pull_request:

          jobs:
            pruefen:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v3
                - name: Android SDK 36 installieren
                  run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
                - name: Architektur prüfen
                  run: python3 scripts/pruefe_architektur.py
                - name: Bauen und testen
                  run: ./gradlew --stacktrace test :app:assembleDebug
          '''.replace('\n          ', '\n').lstrip())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Prüfen
        run: |
          ./gradlew --stacktrace :MathematikKnoten:test :app:testDebugUnitTest
          python3 scripts/pruefe_architektur.py
          git diff --check
      - name: Änderungen speichern
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add -A
          git commit -m "Implement v2.1.13"
          git push origin HEAD:agent/v2.1.13

  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
