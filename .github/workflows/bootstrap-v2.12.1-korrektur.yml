name: Bootstrap v2.12.1 Korrektur

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  umsetzen:
    if: github.head_ref == 'agent/v2.12.1-aktuelle-issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.12.1-aktuelle-issues
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Korrigierten Produktpatch ausführen
        shell: bash
        run: |
          python3 - <<'RUNNER'
          from pathlib import Path

          quelle = Path('.github/workflows/bootstrap-v2.12.1-aktuelle-issues.yml').read_text(encoding='utf-8')
          anfang = quelle.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          ende = quelle.index("\n          PY", anfang)
          zeilen = quelle[anfang:ende].splitlines()
          skript = "\n".join(zeile[10:] if zeile.startswith("          ") else zeile for zeile in zeilen)
          skript = skript.replace(
              "if 'version = \\\"2.12.1\\\"' in text:",
              "if '\\nversion = \\\"2.12.1\\\"' in text:",
          )
          exec(compile(skript, 'bootstrap-v2.12.1', 'exec'))
          for pfad in (
              '.github/workflows/bootstrap-v2.12.1-pr.yml',
              '.github/workflows/bootstrap-v2.12.1-korrektur.yml',
          ):
              datei = Path(pfad)
              if datei.exists():
                  datei.unlink()
          RUNNER
      - name: Veraltete Adjunktionsnotation ausschließen
        run: |
          if grep -R --line-number --fixed-strings '\\stackrel{\\circ}' \
            MathematikRechenSystem/src MathematikKartenAdapter/src MathematikKnoten/src app/src; then
            echo 'Veraltete Adjunktionsnotation gefunden.' >&2
            exit 1
          fi
      - name: Releaseplan prüfen
        run: python3 scripts/pruefe_releaseplan.py
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Einzelnen Produktcommit erzeugen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          basis="$(git merge-base HEAD origin/master)"
          git add -A
          git reset --soft "$basis"
          git commit -m "v2.12.1 Adjunktionssymbol und nummerierte Wahrheitstabellen"
          git push --force origin HEAD:agent/v2.12.1-aktuelle-issues
