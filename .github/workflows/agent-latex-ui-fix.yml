name: Knoten-Icon und LaTeX reparieren

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/agent-latex-ui-fix.yml
      - .github/agent-latex-ui-fix.py

permissions:
  contents: write

concurrency:
  group: agent-latex-ui-fix
  cancel-in-progress: false

jobs:
  reparieren:
    if: github.head_ref == 'agent/fix-icon-tabs-interval-latex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-icon-tabs-interval-latex
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Reparaturen anwenden
        shell: bash
        run: |
          if [[ ! -f .github/agent-latex-ui-fix.py ]]; then
            echo "Reparatur wurde bereits angewendet."
            exit 0
          fi
          python3 .github/agent-latex-ui-fix.py
          rm -f .github/agent-latex-ui-fix.py .github/workflows/agent-latex-ui-fix.yml
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Reparatur committen
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Keine weiteren Änderungen."
            exit 0
          fi
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Knoten-Icon und LaTeX-Darstellung reparieren" -m "- färbt nur das Zahnrad kontrastadaptiv aus der Profilfarbe\n- normalisiert LaTeX-Reitertitel und unterstützt mathbb mit und ohne Gruppenklammern\n- rendert historische mathopen- und mathclose-Ausdrücke ohne sichtbare Befehlsnamen\n- stellt reelle Intervalle als annotierte beschränkte reelle Zahlmengen dar\n- ergänzt Regressionstests für Kontrast, Tabs, Doppelstrichzeichen und Intervalle\n\nCloses #287\nCloses #289\nRefs #157"
          git push origin HEAD:agent/fix-icon-tabs-interval-latex
