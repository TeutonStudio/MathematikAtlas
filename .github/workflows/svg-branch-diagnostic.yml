name: SVG branch diagnostic

on:
  push:
    branches:
      - agent/v2.34.0-svg-operatoren-planung

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Capture Gradle build
        id: gradle
        shell: bash
        run: |
          set +e
          ./gradlew test :app:assembleDebug --no-daemon > svg-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: svg-build-log
          path: svg-build.log
      - name: Fail after artifact upload
        shell: bash
        run: exit "${{ steps.gradle.outputs.status }}"
