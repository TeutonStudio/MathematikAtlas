name: Append v2.20.1 release

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  append-release:
    if: github.head_ref == 'release/v2.20.1-lineare-strukturen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.20.1-lineare-strukturen
          fetch-depth: 0
      - name: Append release entry
        shell: python
        run: |
          from pathlib import Path

          path = Path("release/roadmap.toml")
          text = path.read_text(encoding="utf-8")
          marker = '\nversion = "2.20.1"\n'
          block = '''

          [[releases]]
          version = "2.20.1"
          title = "Lineare Strukturknoten konsolidieren"
          roadmap = "v2.20.x Tensorrechnung und lineare Strukturverträge"
          status = "released"
          previous_release = "2.20.0"
          branch = "release/v2.20.1-lineare-strukturen"
          kind = "feature"
          version_axis = "x"
          reason = "Erweitert vorhandene Matrix-, Skalarprodukt- und Tensorrechner-Knoten um gemeinsame Komponentenansichten, dynamische Operatoranschlüsse und lokale Fehlerzustände, ohne einen neuen registrierten Knotentyp einzuführen."
          '''
          if marker not in text:
              text = text.rstrip() + block
          path.write_text(text.rstrip() + "\n", encoding="utf-8")
      - name: Commit release entry and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/roadmap.toml
          git rm --ignore-unmatch .github/workflows/append-v2.20.1-release.yml
          git commit -m "v2.20.1: Releaseeintrag ergänzen"
          git push origin HEAD:release/v2.20.1-lineare-strukturen
