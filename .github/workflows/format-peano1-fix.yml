name: FormatPeano1Fix

on:
  push:
    paths:
      - .github/workflows/format-peano1-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/agent/fix-peano1-zwei-eingaenge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Einrückung bereinigen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatoren.kt')
          text = path.read_text()
          text = text.replace('''    private fun neutralesElementExistiertAussage(menge: MengenAusdruck, op: Methode): Aussage? =
          endlich(menge) { elemente ->
              val kandidaten = elemente.map { neutral ->
                  checkNotNull(neutralAussage(menge, op, neutral))
              }
              when (kandidaten.size) {
                  0 -> WahrheitsKonstante(false)
                  1 -> kandidaten.single()
                  else -> Disjunktion(kandidaten)
              }
          }
''', '''    private fun neutralesElementExistiertAussage(menge: MengenAusdruck, op: Methode): Aussage? =
              endlich(menge) { elemente ->
                  val kandidaten = elemente.map { neutral ->
                      checkNotNull(neutralAussage(menge, op, neutral))
                  }
                  when (kandidaten.size) {
                      0 -> WahrheitsKonstante(false)
                      1 -> kandidaten.single()
                      else -> Disjunktion(kandidaten)
                  }
              }
''', 1)
          start = text.index('        d(\n    "axiom.peano.null"')
          end = text.index('        d(\n            "axiom.peano.nachfolgerAbgeschlossen"', start)
          block = r'''        d(
              "axiom.peano.null", "Peano 1 · Neutrales Element", setOf("peano"), "Natürliche Zahlen · Peano",
              "\\exists e\\in M:\\;\\forall n\\in M:\\;e\\cdot n=n=n\\cdot e",
              setOf("Peano 1", "neutrales Element", "Identität", "Null gehört zu N"),
              a("menge", AxiomArgumentArt.MENGE),
              a("multiplikation", AxiomArgumentArt.METHODE, 2),
          ) { w ->
              val n = menge(w, 0); val mal = methode(w, 1)
              instanz(
                  "axiom.peano.null",
                  "Peano 1 · Neutrales Element",
                  setOf("peano"),
                  "\\exists e\\in${n.zuLatex()}:\\;\\forall n\\in${n.zuLatex()}:\\;${mal.name}(e,n)=n=${mal.name}(n,e)",
                  runCatching { neutralesElementExistiertAussage(n, mal) }.getOrNull(),
              )
          },
'''
          path.write_text(text[:start] + block + text[end:])
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/format-peano1-fix.yml
          git add MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/AxiomOperatoren.kt
          git commit -m 'style: Peano-1-Axiomformatierung bereinigen'
          git push origin HEAD:agent/fix-peano1-zwei-eingaenge
