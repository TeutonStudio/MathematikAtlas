name: v2.7.0 Ordnungsrelation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  release-vorbereiten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Releaseplan und Android-Version aktualisieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          plan_pfad = Path('release/roadmap.toml')
          plan = plan_pfad.read_text()
          plan = plan.replace('current_series = "2.6.x"', 'current_series = "2.7.x"', 1)
          plan = plan.replace('current_version = "2.6.1"', 'current_version = "2.7.0"', 1)
          eintrag = '''

          [[releases]]
          version = "2.7.0"
          title = "Ordnungsrelation und iterierte Aussagenverknüpfungen"
          roadmap = "v2.7.x Ordnungsrelationen und Aussagenoperatoren"
          status = "released"
          previous_release = "2.6.1"
          branch = "release/v2.7.0-ordnungsrelation"
          kind = "feature"
          version_axis = "y"
          new_node_types = ["mathematik.ordnungsrelation", "mathematik.iterierteAussagenverknüpfung"]
          reason = "Vereinigt vier separat registrierte Vergleichsknoten zu einer parametrierten Ordnungsrelation und führt mit der iterierten Aussagenverknüpfung einen neuen erzeugbaren Knotentyp ein."
          '''
          if 'version = "2.7.0"' not in plan:
              plan = plan.rstrip() + eintrag
          plan_pfad.write_text(plan.rstrip() + '\n')

          gradle_pfad = Path('app/build.gradle.kts')
          gradle = gradle_pfad.read_text()
          gradle = gradle.replace('versionCode = 2006001', 'versionCode = 2007000', 1)
          gradle = gradle.replace('versionName = "2.6.1"', 'versionName = "2.7.0"', 1)
          gradle_pfad.write_text(gradle)
          PY

      - name: Releaseplan prüfen
        run: python3 scripts/pruefe_releaseplan.py

      - name: Versionsfolge prüfen
        run: python3 scripts/pruefe_versionsfolge.py

      - name: Repository prüfen
        run: python3 scripts/pruefe_repository.py

      - name: Tests
        run: ./gradlew test

      - name: Debug-App bauen
        run: ./gradlew :app:assembleDebug

      - name: Release-Vorbereitung committen
        shell: bash
        run: |
          rm .github/workflows/v270-ordnungsrelation-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bereitet v2.7.0 Ordnungsrelation vor"
          git push origin HEAD:${{ github.head_ref }}
