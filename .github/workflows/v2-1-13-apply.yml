name: Apply v2.1.13

on:
  push:
    branches:
      - agent/v2.1.13

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Prepare v2.1.13 implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.1.13
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              "MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt",
              '''    val Fall = KnotenVorlage(
                  "mathematik.fall", "Fallunterscheidung", "Steuerung", "Verzweigt einen Ausdruck anhand einer Aussage und gibt die Annahmen weiter.", GraphGröße(250f, 140f),
                  listOf(eingang("term", MathematikAnschlussArten.Objekt.id, 0), eingang("aussage", MathematikAnschlussArten.Aussage.id, 1), ausgang("fall", MathematikAnschlussArten.Objekt.id, 0), ausgang("sonst", MathematikAnschlussArten.Objekt.id, 1)),
              )''',
              '''    val Fall = KnotenVorlage(
                  "mathematik.fall", "Fallunterscheidung", "Steuerung", "Wählt abhängig vom Wahrheitswert einer Aussage einen von zwei beliebigen Werten aus.", GraphGröße(260f, 150f),
                  listOf(
                      eingang("wahr", MathematikAnschlussArten.Objekt.id, 0),
                      eingang("aussage", MathematikAnschlussArten.Aussage.id, 1),
                      eingang("lüge", MathematikAnschlussArten.Objekt.id, 2),
                      ausgang("wert", MathematikAnschlussArten.Objekt.id),
                  ),
              )''',
          )

          replace_exact(
              "MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikAuswerter.kt",
              '''        registriere("mathematik.fall") { k ->
                      val wert = k.eingänge["term"] ?: error("Term fehlt.")
                      val bedingung = k.eingänge["aussage"]?.objekt as? Aussage ?: error("Aussage fehlt.")
                      KnotenAuswertungsErgebnis(mapOf(
                          "fall" to wert.copy(annahmen = wert.annahmen + bedingung),
                          "sonst" to wert.copy(annahmen = wert.annahmen + Negation(bedingung)),
                      ))
                  }''',
              '''        registriere("mathematik.fall") { k ->
                      val wahr = k.eingänge["wahr"] ?: error("Wahr-Eingang fehlt.")
                      val lüge = k.eingänge["lüge"] ?: error("Lüge-Eingang fehlt.")
                      val aussageWert = k.eingänge["aussage"] ?: error("Aussage-Eingang fehlt.")
                      val aussage = aussageWert.objekt as? Aussage ?: error("Der Aussage-Eingang enthält keine Aussage.")
                      val kontext = k.rechenKontext.copy(annahmen = k.rechenKontext.annahmen + aussageWert.annahmen)
                      val ausgewählt = when (aussage.entscheide(kontext).wahrheitswert) {
                          Wahrheitswert.Wahr -> wahr
                          Wahrheitswert.Falsch -> lüge
                          null -> error("Die Aussage der Fallunterscheidung ist im aktuellen Rechenkontext nicht entscheidbar.")
                      }
                      KnotenAuswertungsErgebnis(mapOf(
                          "wert" to ausgewählt.copy(annahmen = ausgewählt.annahmen + aussageWert.annahmen),
                      ))
                  }''',
          )

          replace_exact(
              "app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/AtlasZustand.kt",
              '''    val migriert = migriereAbbildZuAllgemeinerMethode(migriereTermZuMethodeUndVariablen(migriereKartenAusgangZuEinzelanschluss(karte)))''',
              '''    val migriert = migriereFallunterscheidung(
                  migriereAbbildZuAllgemeinerMethode(migriereTermZuMethodeUndVariablen(migriereKartenAusgangZuEinzelanschluss(karte))),
              )''',
          )

          marker = '''private val assoziativeKnotenArten = setOf('''
          migration = '''/** Überführt die alte verzweigende Fall-Karte in einen auswählenden Drei-Eingang-Knoten. */
          internal fun migriereFallunterscheidung(karte: KartenDaten): KartenDaten {
              val ausgangUmleitungen = mutableMapOf<AnschlussVerweis, AnschlussVerweis>()
              val knoten = karte.knoten.map { alt ->
                  if (alt.art != "mathematik.fall" || alt.anschlüsse.any { it.name == "wahr" }) return@map alt

                  val wahr = alt.anschlüsse.firstOrNull { it.name == "term" && it.richtung == AnschlussRichtung.Eingang }
                      ?: AnschlussDaten(name = "wahr", richtung = AnschlussRichtung.Eingang, kante = AnschlussKante.Links, art = MathematikAnschlussArten.Objekt.id)
                  val aussage = alt.anschlüsse.firstOrNull { it.name == "aussage" && it.richtung == AnschlussRichtung.Eingang }
                      ?: AnschlussDaten(name = "aussage", richtung = AnschlussRichtung.Eingang, kante = AnschlussKante.Links, art = MathematikAnschlussArten.Aussage.id)
                  val lüge = AnschlussDaten(name = "lüge", richtung = AnschlussRichtung.Eingang, kante = AnschlussKante.Links, art = MathematikAnschlussArten.Objekt.id, reihenfolge = 2)
                  val alterWert = alt.anschlüsse.firstOrNull { it.name == "wert" && it.richtung == AnschlussRichtung.Ausgang }
                      ?: alt.anschlüsse.firstOrNull { it.name == "fall" && it.richtung == AnschlussRichtung.Ausgang }
                      ?: AnschlussDaten(name = "wert", richtung = AnschlussRichtung.Ausgang, kante = AnschlussKante.Rechts, art = MathematikAnschlussArten.Objekt.id)
                  val wert = alterWert.copy(name = "wert", richtung = AnschlussRichtung.Ausgang, kante = AnschlussKante.Rechts, art = MathematikAnschlussArten.Objekt.id, reihenfolge = 0, kannSichErweitern = false, dynamischErzeugt = false)
                  val wertVerweis = AnschlussVerweis(alt.id, wert.id)
                  alt.anschlüsse.filter { it.richtung == AnschlussRichtung.Ausgang && it.name in setOf("fall", "sonst", "wert") }
                      .forEach { ausgangUmleitungen[AnschlussVerweis(alt.id, it.id)] = wertVerweis }

                  alt.copy(
                      anschlüsse = listOf(
                          wahr.copy(name = "wahr", richtung = AnschlussRichtung.Eingang, kante = AnschlussKante.Links, art = MathematikAnschlussArten.Objekt.id, reihenfolge = 0, kannSichErweitern = false, dynamischErzeugt = false),
                          aussage.copy(name = "aussage", richtung = AnschlussRichtung.Eingang, kante = AnschlussKante.Links, art = MathematikAnschlussArten.Aussage.id, reihenfolge = 1, kannSichErweitern = false, dynamischErzeugt = false),
                          lüge,
                          wert,
                      ),
                  )
              }
              val gültigeAnschlüsse = knoten.flatMap { knotenDaten -> knotenDaten.anschlüsse.map { AnschlussVerweis(knotenDaten.id, it.id) } }.toSet()
              return karte.copy(
                  knoten = knoten,
                  verbindungen = karte.verbindungen.map { verbindung ->
                      verbindung.copy(von = ausgangUmleitungen[verbindung.von] ?: verbindung.von)
                  }.filter { it.von in gültigeAnschlüsse && it.zu in gültigeAnschlüsse }.distinct(),
              )
          }

          '''
          atlas = Path("app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/AtlasZustand.kt")
          atlas_text = atlas.read_text()
          if marker not in atlas_text:
              raise SystemExit("Migration marker not found")
          atlas.write_text(atlas_text.replace(marker, migration + marker, 1))

          test = Path("MathematikKnoten/src/test/kotlin/de/TeutonStudio/MathematikKnoten/FallunterscheidungTest.kt")
          test.write_text('''package de.TeutonStudio.MathematikKnoten

          import de.TeutonStudio.KnotenKartenVerwalter.daten.AnschlussRichtung
          import de.TeutonStudio.KnotenKartenVerwalter.daten.GraphPunkt
          import de.TeutonStudio.MathematikKartenAdapter.BedingterWert
          import de.TeutonStudio.MathematikKartenAdapter.KnotenAuswertungsKontext
          import de.TeutonStudio.MathematikRechenSystem.kern.EndlicheMenge
          import de.TeutonStudio.MathematikRechenSystem.kern.Gleichheit
          import de.TeutonStudio.MathematikRechenSystem.kern.RationaleZahl
          import de.TeutonStudio.MathematikRechenSystem.kern.RechenKontext
          import de.TeutonStudio.MathematikRechenSystem.kern.Variable
          import de.TeutonStudio.MathematikRechenSystem.kern.WahrheitsKonstante
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertFailsWith

          class FallunterscheidungTest {
              private val auswerter = StandardMathematikAuswerter.erzeugeRegister()

              @Test
              fun `Vorlage ordnet Aussage zwischen Wahr- und Lüge-Eingang an`() {
                  val knoten = MathematikKnotenVorlagen.Fall.erzeuge(GraphPunkt.Zero)
                  val eingänge = knoten.anschlüsse.filter { it.richtung == AnschlussRichtung.Eingang }.sortedBy { it.reihenfolge }
                  val ausgänge = knoten.anschlüsse.filter { it.richtung == AnschlussRichtung.Ausgang }

                  assertEquals(listOf("wahr", "aussage", "lüge"), eingänge.map { it.name })
                  assertEquals(listOf(MathematikAnschlussArten.Objekt.id, MathematikAnschlussArten.Aussage.id, MathematikAnschlussArten.Objekt.id), eingänge.map { it.art })
                  assertEquals(listOf("wert"), ausgänge.map { it.name })
                  assertEquals(MathematikAnschlussArten.Objekt.id, ausgänge.single().art)
              }

              @Test
              fun `wahre Aussage wählt ersten Eingang`() {
                  val ergebnis = werteAus(
                      wahr = BedingterWert(RationaleZahl.von(7)),
                      aussage = BedingterWert(WahrheitsKonstante(true)),
                      lüge = BedingterWert(EndlicheMenge(setOf(RationaleZahl.Eins))),
                  )

                  assertEquals(RationaleZahl.von(7), ergebnis.objekt)
              }

              @Test
              fun `falsche Aussage wählt zweiten Eingang`() {
                  val falschWert = EndlicheMenge(setOf(RationaleZahl.von(2), RationaleZahl.von(3)))
                  val ergebnis = werteAus(
                      wahr = BedingterWert(RationaleZahl.von(7)),
                      aussage = BedingterWert(WahrheitsKonstante(false)),
                      lüge = BedingterWert(falschWert),
                  )

                  assertEquals(falschWert, ergebnis.objekt)
              }

              @Test
              fun `unentscheidbare Aussage bricht verständlich ab`() {
                  assertFailsWith<IllegalStateException> {
                      werteAus(
                          wahr = BedingterWert(RationaleZahl.Eins),
                          aussage = BedingterWert(Gleichheit(Variable("x"), RationaleZahl.Eins)),
                          lüge = BedingterWert(RationaleZahl.Null),
                      )
                  }
              }

              private fun werteAus(wahr: BedingterWert, aussage: BedingterWert, lüge: BedingterWert): BedingterWert {
                  val knoten = MathematikKnotenVorlagen.Fall.erzeuge(GraphPunkt.Zero)
                  return auswerter.finde(knoten.art)!!.auswerten(
                      KnotenAuswertungsKontext(knoten, mapOf("wahr" to wahr, "aussage" to aussage, "lüge" to lüge), RechenKontext()),
                  ).ausgaben.getValue("wert")
              }
          }
          '''.replace("\n          ", "\n").lstrip())

          Path(".github/workflows/v2-1-13-apply.yml").unlink()
          PY

      - name: Verify
        shell: bash
        run: |
          ./gradlew :MathematikKnoten:test :app:testDebugUnitTest
          python3 scripts/pruefe_repository.py
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add -A
          git commit -m "Implement v2.1.13"
          git push origin HEAD:agent/v2.1.13
