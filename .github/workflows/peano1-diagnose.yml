name: Peano1Diagnose

on:
  push:
    paths:
      - .github/workflows/peano1-diagnose.yml

jobs:
  diagnose:
    if: github.ref == 'refs/heads/agent/fix-peano1-zwei-eingaenge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vorhandenen Patch anwenden
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess
          text = Path('.github/workflows/peano1-zwei-eingaenge-fix.yml').read_text()
          line = next(line for line in text.splitlines() if " | base64 -d > /tmp/peano_patch.py" in line)
          payload = line.split("echo '", 1)[1].split("' | base64", 1)[0]
          Path('/tmp/peano_patch.py').write_bytes(base64.b64decode(payload))
          subprocess.run(['python3', '/tmp/peano_patch.py'], check=True)
          PY
      - name: Axiomtest mit Diagnose
        shell: bash
        run: |
          set +e
          ./gradlew :MathematikRechenSystem:test --tests '*AxiomOperatorenTest*' --stacktrace
          rc=$?
          echo '--- JUnit XML ---'
          find MathematikRechenSystem/build/test-results/test -name '*.xml' -type f -print -exec cat {} \;
          exit $rc
