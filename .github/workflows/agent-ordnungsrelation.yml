name: Agent Ordnungsrelation

on:
  push:
    branches:
      - agent/ordnungsrelation

permissions:
  contents: write

jobs:
  implementieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ordnungsrelation
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ordnungsrelation implementieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              datei = Path(path)
              text = datei.read_text()
              gefunden = text.count(old)
              if gefunden != count:
                  raise SystemExit(f"{path}: erwartete {count} Vorkommen, gefunden {gefunden}\n--- gesucht ---\n{old}")
              datei.write_text(text.replace(old, new, count))

          # Gemeinsame Vorlagenarten und weiterhin vier sichtbare Alias-Einträge.
          path = "MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt"
          replace(path, "object MathematikKnotenVorlagen {\n", dedent('''\
          object MathematikKnotenVorlagen {
              const val ORDNUNGSRELATION_ART = "mathematik.ordnungsrelation"
              const val ITERIERTE_AUSSAGENVERKNÜPFUNG_ART = "mathematik.iterierteAussagenverknüpfung"
          '''))
          replace(path, dedent('''\
              val Kleiner = vergleichVorlage("mathematik.kleiner", "Kleiner", "<")
              val Größer = vergleichVorlage("mathematik.größer", "Größer", ">")
              val KleinerGleich = vergleichVorlage("mathematik.kleinerGleich", "Kleiner oder gleich", "≤")
              val GrößerGleich = vergleichVorlage("mathematik.größerGleich", "Größer oder gleich", "≥")
          '''), dedent('''\
              val Kleiner = vergleichVorlage("Kleiner", "<", "kleiner")
              val Größer = vergleichVorlage("Größer", ">", "größer")
              val KleinerGleich = vergleichVorlage("Kleiner oder gleich", "≤", "kleinerGleich")
              val GrößerGleich = vergleichVorlage("Größer oder gleich", "≥", "größerGleich")
          '''))
          replace(path, dedent('''\
              val IteriertesProdukt = KnotenVorlage(
                  "mathematik.iteriertesProdukt", "Iteriertes Produkt", "Operatoren", "Multipliziert die Werte einer Zahlfunktion über einer Indexmenge.", GraphGröße(250f, 120f),
                  listOf(eingang("methode", MathematikAnschlussArten.ZahlFunktion.id), eingang("indexmenge", MathematikAnschlussArten.Menge.id, 1), ausgang("wert", MathematikAnschlussArten.Zahl.id)),
              )
          '''), dedent('''\
              val IteriertesProdukt = KnotenVorlage(
                  "mathematik.iteriertesProdukt", "Iteriertes Produkt", "Operatoren", "Multipliziert die Werte einer Zahlfunktion über einer Indexmenge.", GraphGröße(250f, 120f),
                  listOf(eingang("methode", MathematikAnschlussArten.ZahlFunktion.id), eingang("indexmenge", MathematikAnschlussArten.Menge.id, 1), ausgang("wert", MathematikAnschlussArten.Zahl.id)),
              )
              val IterierteKonjunktion = iterierteAussagenVorlage(
                  "Iterierte Konjunktion",
                  "Verknüpft die Aussagenwerte einer Methode über einer Indexmenge mit ∧.",
                  "konjunktion",
              )
              val IterierteDisjunktion = iterierteAussagenVorlage(
                  "Iterierte Disjunktion",
                  "Verknüpft die Aussagenwerte einer Methode über einer Indexmenge mit ∨.",
                  "disjunktion",
              )
              val IterierteAdjunktion = iterierteAussagenVorlage(
                  "Iterierte Adjunktion",
                  "Verknüpft die Aussagenwerte einer Methode über einer Indexmenge als iteriertes binäres UND.",
                  "adjunktion",
              )
          '''))
          replace(path, dedent('''\
              val TermZuMethode = KnotenVorlage(
                  "mathematik.termZuMethode", "Term zu Methode", "Methoden", "Erzeugt aus einem allgemeinen Term eine Methode mit automatisch abgeleiteten Variablen und Zielmenge.", GraphGröße(265f, 135f),
                  listOf(eingang("term", MathematikAnschlussArten.Objekt.id, 0), ausgang("methode", MathematikAnschlussArten.Funktion.id)),
                  mapOf("name" to "f", "argumentReihenfolge" to ""),
              )
          '''), dedent('''\
              val TermZuMethode = KnotenVorlage(
                  "mathematik.termZuMethode", "Term zu Methode", "Methoden", "Erzeugt aus einem allgemeinen Term eine Methode mit automatisch abgeleiteten Variablen und Zielmenge.", GraphGröße(265f, 135f),
                  listOf(eingang("term", MathematikAnschlussArten.Objekt.id, 0), ausgang("methode", MathematikAnschlussArten.Funktion.id)),
                  mapOf("name" to "f", "argumentReihenfolge" to ""),
              )
              val AussageZuMethode = KnotenVorlage(
                  "mathematik.termZuMethode", "Aussage zu Methode", "Methoden", "Erzeugt aus einer Aussage eine typisierte Aussagenmethode.", GraphGröße(265f, 135f),
                  listOf(eingang("term", MathematikAnschlussArten.Aussage.id, 0), ausgang("methode", MathematikAnschlussArten.AussageFunktion.id)),
                  mapOf("name" to "P", "argumentReihenfolge" to ""),
              )
          '''))
          replace(path,
              "Mächtigkeit, IterierteSumme, IteriertesProdukt, IterierteVereinigung",
              "Mächtigkeit, IterierteSumme, IteriertesProdukt, IterierteKonjunktion, IterierteDisjunktion, IterierteAdjunktion, IterierteVereinigung",
          )
          replace(path, "Abbild, TermZuMethode, Komposition", "Abbild, TermZuMethode, AussageZuMethode, Komposition")
          replace(path, dedent('''\
              private fun vergleichVorlage(art: String, name: String, zeichen: String) = aussagenVorlage(art, name, "Vergleicht zwei Zahlterme mit $zeichen.", MathematikAnschlussArten.Zahl.id, MathematikAnschlussArten.Zahl.id, "Aussagen: Zahlenprädikate")
          '''), dedent('''\
              private fun vergleichVorlage(name: String, zeichen: String, relation: String) = KnotenVorlage(
                  ORDNUNGSRELATION_ART,
                  name,
                  "Aussagen: Zahlenprädikate",
                  "Vergleicht zwei Zahlterme mit $zeichen.",
                  GraphGröße(220f, 110f),
                  listOf(
                      eingang("links", MathematikAnschlussArten.Zahl.id, 0),
                      eingang("rechts", MathematikAnschlussArten.Zahl.id, 1),
                      ausgang("aussage", MathematikAnschlussArten.Aussage.id),
                  ),
                  mapOf("relation" to relation),
              )
          '''))
          replace(path, dedent('''\
              private fun methodenAnalysisVorlage(art: String, name: String, beschreibung: String, funktion: AnschlussArtId) = KnotenVorlage(art, name, "Abbildungen", beschreibung, GraphGröße(260f, 105f), listOf(eingang("methode", funktion), ausgang("methode", funktion)))
          '''), dedent('''\
              private fun methodenAnalysisVorlage(art: String, name: String, beschreibung: String, funktion: AnschlussArtId) = KnotenVorlage(art, name, "Abbildungen", beschreibung, GraphGröße(260f, 105f), listOf(eingang("methode", funktion), ausgang("methode", funktion)))
              private fun iterierteAussagenVorlage(name: String, beschreibung: String, operator: String) = KnotenVorlage(
                  ITERIERTE_AUSSAGENVERKNÜPFUNG_ART,
                  name,
                  "Operatoren",
                  beschreibung,
                  GraphGröße(270f, 120f),
                  listOf(
                      eingang("methode", MathematikAnschlussArten.AussageFunktion.id),
                      eingang("indexmenge", MathematikAnschlussArten.Menge.id, 1),
                      ausgang("aussage", MathematikAnschlussArten.Aussage.id),
                  ),
                  mapOf("operator" to operator),
              )
          '''))

          # Rechenkern: sichere symbolische Quantoren und iterierte Adjunktion.
          path = "MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/IterierteOperatoren.kt"
          replace(path, dedent('''\
          data class IterierteKonjunktion(val methode: Funktion, val indexMenge: MengenAusdruck) : Aussage {
              override fun entscheide(kontext: RechenKontext) = iteriereAussagen(methode, indexMenge, true).entscheide(kontext)
              override fun zuLatex() = "\\\\bigwedge_{${methode.parameter.single().zuLatex()} \\\\in ${indexMenge.zuLatex()}} ${methode.name}(${methode.parameter.single().zuLatex()})"
          }
          data class IterierteDisjunktion(val methode: Funktion, val indexMenge: MengenAusdruck) : Aussage {
              override fun entscheide(kontext: RechenKontext) = iteriereAussagen(methode, indexMenge, false).entscheide(kontext)
              override fun zuLatex() = "\\\\bigvee_{${methode.parameter.single().zuLatex()} \\\\in ${indexMenge.zuLatex()}} ${methode.name}(${methode.parameter.single().zuLatex()})"
          }
          '''), dedent('''\
          data class IterierteKonjunktion(val methode: Funktion, val indexMenge: MengenAusdruck) : Aussage {
              override fun entscheide(kontext: RechenKontext): AussageErgebnis =
                  if (indexMenge is EndlicheMenge) iteriereAussagen(methode, indexMenge, IterierteAussagenArt.Konjunktion).entscheide(kontext)
                  else symbolischeAussagenIteration()
              override fun zuLatex() = "\\\\bigwedge_{${methode.parameter.single().zuLatex()} \\\\in ${indexMenge.zuLatex()}} ${methode.name}(${methode.parameter.single().zuLatex()})"
          }
          data class IterierteDisjunktion(val methode: Funktion, val indexMenge: MengenAusdruck) : Aussage {
              override fun entscheide(kontext: RechenKontext): AussageErgebnis =
                  if (indexMenge is EndlicheMenge) iteriereAussagen(methode, indexMenge, IterierteAussagenArt.Disjunktion).entscheide(kontext)
                  else symbolischeAussagenIteration()
              override fun zuLatex() = "\\\\bigvee_{${methode.parameter.single().zuLatex()} \\\\in ${indexMenge.zuLatex()}} ${methode.name}(${methode.parameter.single().zuLatex()})"
          }
          data class IterierteAdjunktion(val methode: Funktion, val indexMenge: MengenAusdruck) : Aussage {
              override fun entscheide(kontext: RechenKontext): AussageErgebnis =
                  if (indexMenge is EndlicheMenge) iteriereAussagen(methode, indexMenge, IterierteAussagenArt.Adjunktion).entscheide(kontext)
                  else symbolischeAussagenIteration()
              override fun zuLatex() = "\\\\mathop{\\\\&}_{${methode.parameter.single().zuLatex()} \\\\in ${indexMenge.zuLatex()}} ${methode.name}(${methode.parameter.single().zuLatex()})"
          }

          private fun symbolischeAussagenIteration() = AussageErgebnis(
              wahrheitswert = null,
              status = EntscheidungsStatus.Unbekannt,
              begründung = "Die Aussage wird über einer nicht endlich auswertbaren Indexmenge symbolisch dargestellt.",
          )
          '''))
          replace(path, dedent('''\
          fun iterierteKonjunktion(methode: Funktion, indexMenge: MengenAusdruck): Aussage = iteriereAussagen(methode, indexMenge, true)
          fun iterierteDisjunktion(methode: Funktion, indexMenge: MengenAusdruck): Aussage = iteriereAussagen(methode, indexMenge, false)
          private fun iteriereAussagen(methode: Funktion, indexMenge: MengenAusdruck, konjunktion: Boolean): Aussage {
              require(methode.parameter.size == 1 && methode.ausgaben.size == 1 && methode.einzigeAusgabe().second is Aussage) { "Die Abbildung muss einwertig eine Aussage liefern." }
              if (indexMenge !is EndlicheMenge) return if (konjunktion) IterierteKonjunktion(methode, indexMenge) else IterierteDisjunktion(methode, indexMenge)
              val p = methode.parameter.single()
              val aussagen = indexMenge.elemente.map { index ->
                  val zahl = index as? ZahlAusdruck ?: error("Indexmenge muss Zahlen enthalten.")
                  methode.wendeAn(mapOf(p.name to zahl)).values.single() as? Aussage ?: error("Abbildung liefert keine Aussage.")
              }
              return if (konjunktion) Konjunktion(aussagen) else Disjunktion(aussagen)
          }
          '''), dedent('''\
          private enum class IterierteAussagenArt { Konjunktion, Disjunktion, Adjunktion }

          fun iterierteKonjunktion(methode: Funktion, indexMenge: MengenAusdruck): Aussage =
              iteriereAussagen(methode, indexMenge, IterierteAussagenArt.Konjunktion)
          fun iterierteDisjunktion(methode: Funktion, indexMenge: MengenAusdruck): Aussage =
              iteriereAussagen(methode, indexMenge, IterierteAussagenArt.Disjunktion)
          fun iterierteAdjunktion(methode: Funktion, indexMenge: MengenAusdruck): Aussage =
              iteriereAussagen(methode, indexMenge, IterierteAussagenArt.Adjunktion)

          private fun iteriereAussagen(
              methode: Funktion,
              indexMenge: MengenAusdruck,
              art: IterierteAussagenArt,
          ): Aussage {
              require(methode.parameter.size == 1 && methode.ausgaben.size == 1 && methode.einzigeAusgabe().second is Aussage) {
                  "Die Abbildung muss einwertig eine Aussage liefern."
              }
              if (indexMenge !is EndlicheMenge) return when (art) {
                  IterierteAussagenArt.Konjunktion -> IterierteKonjunktion(methode, indexMenge)
                  IterierteAussagenArt.Disjunktion -> IterierteDisjunktion(methode, indexMenge)
                  IterierteAussagenArt.Adjunktion -> IterierteAdjunktion(methode, indexMenge)
              }
              val p = methode.parameter.single()
              val aussagen = indexMenge.elemente.map { index ->
                  val zahl = index as? ZahlAusdruck ?: error("Indexmenge muss Zahlen enthalten.")
                  methode.wendeAn(mapOf(p.name to zahl)).values.single() as? Aussage
                      ?: error("Abbildung liefert keine Aussage.")
              }
              return when (art) {
                  IterierteAussagenArt.Konjunktion -> Konjunktion(aussagen)
                  IterierteAussagenArt.Disjunktion -> Disjunktion(aussagen)
                  IterierteAussagenArt.Adjunktion -> aussagen.reduceOrNull { links, rechts -> Adjunktion(links, rechts) }
                      ?: WahrheitsKonstante(true)
              }
          }
          '''))

          # Substitution und Variablenanalyse kennen die neue Aussageform.
          path = "MathematikRechenSystem/src/main/kotlin/de/TeutonStudio/MathematikRechenSystem/kern/Funktionen.kt"
          replace(path,
              "    is IterierteDisjunktion -> objekt.copy(indexMenge = ersetze(objekt.indexMenge, bindungen) as MengenAusdruck)\n",
              "    is IterierteDisjunktion -> objekt.copy(indexMenge = ersetze(objekt.indexMenge, bindungen) as MengenAusdruck)\n    is IterierteAdjunktion -> objekt.copy(indexMenge = ersetze(objekt.indexMenge, bindungen) as MengenAusdruck)\n",
          )
          replace(path,
              "    is IterierteDisjunktion -> setOf(methode, indexMenge).enthalteneFunktionsParameter()\n",
              "    is IterierteDisjunktion -> setOf(methode, indexMenge).enthalteneFunktionsParameter()\n    is IterierteAdjunktion -> setOf(methode, indexMenge).enthalteneFunktionsParameter()\n",
          )

          # Registry: eine Ordnungsrelation und ein parametrisierter iterierter Aussagenoperator.
          path = "MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikAuswerter.kt"
          replace(path, dedent('''\
                  registriere("mathematik.kleiner") { k -> vergleich(k, VergleichsArt.Kleiner) }
                  registriere("mathematik.größer") { k -> vergleich(k, VergleichsArt.Größer) }
                  registriere("mathematik.kleinerGleich") { k -> vergleich(k, VergleichsArt.KleinerGleich) }
                  registriere("mathematik.größerGleich") { k -> vergleich(k, VergleichsArt.GrößerGleich) }
          '''), dedent('''\
                  registriere(MathematikKnotenVorlagen.ORDNUNGSRELATION_ART) { k ->
                      vergleich(k, vergleichsArt(k.knoten.parameter["relation"]))
                  }
                  // Alte Schlüssel bleiben für importierte Karten bis zur Lade-Migration auswertbar.
                  registriere("mathematik.kleiner") { k -> vergleich(k, VergleichsArt.Kleiner) }
                  registriere("mathematik.größer") { k -> vergleich(k, VergleichsArt.Größer) }
                  registriere("mathematik.kleinerGleich") { k -> vergleich(k, VergleichsArt.KleinerGleich) }
                  registriere("mathematik.größerGleich") { k -> vergleich(k, VergleichsArt.GrößerGleich) }
          '''))
          replace(path, dedent('''\
                  registriere("mathematik.iteriertesProdukt") { k ->
                      val methode = k.eingänge["methode"]?.objekt as? Funktion ?: error("Zahlfunktion fehlt.")
                      val indexMenge = k.eingänge["indexmenge"]?.objekt as? MengenAusdruck ?: error("Indexmenge fehlt.")
                      KnotenAuswertungsErgebnis(mapOf("wert" to BedingterWert(iteriertesProdukt(methode, indexMenge), annahmen(k))))
                  }
          '''), dedent('''\
                  registriere("mathematik.iteriertesProdukt") { k ->
                      val methode = k.eingänge["methode"]?.objekt as? Funktion ?: error("Zahlfunktion fehlt.")
                      val indexMenge = k.eingänge["indexmenge"]?.objekt as? MengenAusdruck ?: error("Indexmenge fehlt.")
                      KnotenAuswertungsErgebnis(mapOf("wert" to BedingterWert(iteriertesProdukt(methode, indexMenge), annahmen(k))))
                  }
                  registriere(MathematikKnotenVorlagen.ITERIERTE_AUSSAGENVERKNÜPFUNG_ART) { k ->
                      val methode = k.eingänge["methode"]?.objekt as? Funktion ?: error("Aussagenmethode fehlt.")
                      val indexMenge = k.eingänge["indexmenge"]?.objekt as? MengenAusdruck ?: error("Indexmenge fehlt.")
                      val aussage = when (k.knoten.parameter["operator"]) {
                          "konjunktion" -> iterierteKonjunktion(methode, indexMenge)
                          "disjunktion" -> iterierteDisjunktion(methode, indexMenge)
                          "adjunktion" -> iterierteAdjunktion(methode, indexMenge)
                          else -> error("Unbekannte iterierte Aussagenverknüpfung.")
                      }
                      KnotenAuswertungsErgebnis(mapOf("aussage" to BedingterWert(aussage, annahmen(k))))
                  }
          '''))
          replace(path, dedent('''\
              private fun vergleich(k: KnotenAuswertungsKontext, art: VergleichsArt) = KnotenAuswertungsErgebnis(
                  mapOf("aussage" to BedingterWert(Vergleich(k.zahl("links"), art, k.zahl("rechts")), annahmen(k))),
              )
          '''), dedent('''\
              private fun vergleichsArt(wert: String?): VergleichsArt = when (wert) {
                  "kleiner" -> VergleichsArt.Kleiner
                  "kleinerGleich" -> VergleichsArt.KleinerGleich
                  "größer" -> VergleichsArt.Größer
                  "größerGleich" -> VergleichsArt.GrößerGleich
                  else -> error("Unbekannte Ordnungsrelation '$wert'.")
              }
              private fun vergleich(k: KnotenAuswertungsKontext, art: VergleichsArt) = KnotenAuswertungsErgebnis(
                  mapOf("aussage" to BedingterWert(Vergleich(k.zahl("links"), art, k.zahl("rechts")), annahmen(k))),
              )
          '''))

          # Pfadgebundene LaTeX-Darstellung folgt dem Relationsparameter.
          path = "MathematikKartenAdapter/src/main/kotlin/de/TeutonStudio/MathematikKartenAdapter/KartenAuswerter.kt"
          replace(path,
              '            "mathematik.gleichheit" -> mapOf("aussage" to binär("="))\n',
              dedent('''\
                          "mathematik.gleichheit" -> mapOf("aussage" to binär("="))
                          "mathematik.ordnungsrelation" -> mapOf(
                              "aussage" to binär(when (knoten.parameter["relation"]) {
                                  "kleiner" -> "<"
                                  "kleinerGleich" -> "\\\\le"
                                  "größer" -> ">"
                                  "größerGleich" -> "\\\\ge"
                                  else -> error("Unbekannte Ordnungsrelation.")
                              }),
                          )
              '''),
          )

          # Renderer ergänzt die drei iterierten Aussagenvarianten.
          path = "MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenRenderer.kt"
          replace(path, dedent('''\
                  val zeichen = when (knoten.art) {
                      "mathematik.iterierteSumme" -> "\\\\sum"
                      "mathematik.iteriertesProdukt" -> "\\\\prod"
                      "mathematik.iterierteVereinigung" -> "\\\\bigcup"
                      "mathematik.iteriertesKartesischesProdukt" -> "\\\\mathop{\\\\times}"
                      else -> "\\\\bigcap"
                  }
          '''), dedent('''\
                  val zeichen = when (knoten.art) {
                      "mathematik.iterierteSumme" -> "\\\\sum"
                      "mathematik.iteriertesProdukt" -> "\\\\prod"
                      "mathematik.iterierteVereinigung" -> "\\\\bigcup"
                      "mathematik.iteriertesKartesischesProdukt" -> "\\\\mathop{\\\\times}"
                      MathematikKnotenVorlagen.ITERIERTE_AUSSAGENVERKNÜPFUNG_ART -> when (knoten.parameter["operator"]) {
                          "konjunktion" -> "\\\\bigwedge"
                          "disjunktion" -> "\\\\bigvee"
                          "adjunktion" -> "\\\\mathop{\\\\&}"
                          else -> "?"
                      }
                      else -> "\\\\bigcap"
                  }
          '''))
          replace(path,
              '        val iterativeArten = setOf("mathematik.iterierteSumme", "mathematik.iteriertesProdukt", "mathematik.iterierteVereinigung", "mathematik.iterierterSchnitt", "mathematik.iteriertesKartesischesProdukt")\n',
              '        val iterativeArten = setOf("mathematik.iterierteSumme", "mathematik.iteriertesProdukt", "mathematik.iterierteVereinigung", "mathematik.iterierterSchnitt", "mathematik.iteriertesKartesischesProdukt", MathematikKnotenVorlagen.ITERIERTE_AUSSAGENVERKNÜPFUNG_ART)\n',
          )

          # Inspector: Relation auswählbar, Standardname folgt mit, eigene Namen bleiben erhalten.
          path = "app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/KnotenInspektoren.kt"
          replace(path,
              "    fun parameter(schlüssel: String, wert: String)\n",
              "    fun parameter(schlüssel: String, wert: String)\n    fun name(wert: String)\n",
          )
          replace(path,
              '        "mathematik.termZuMethode" to TermZuMethodeInspektor,\n',
              '        "mathematik.termZuMethode" to TermZuMethodeInspektor,\n        "mathematik.ordnungsrelation" to OrdnungsrelationInspektor,\n',
          )
          replace(path, "private object VariablenInspektor : KnotenInspektor {\n", dedent('''\
          private object OrdnungsrelationInspektor : KnotenInspektor {
              private val relationen = listOf(
                  Triple("kleiner", "<", "Kleiner"),
                  Triple("kleinerGleich", "≤", "Kleiner oder gleich"),
                  Triple("größer", ">", "Größer"),
                  Triple("größerGleich", "≥", "Größer oder gleich"),
              )

              @Composable
              override fun Inhalt(
                  knoten: KnotenDaten,
                  ergebnis: KnotenAuswertungsErgebnis?,
                  aktionen: KnotenInspektorAktionen,
              ) {
                  val aktuell = knoten.parameter["relation"] ?: "kleiner"
