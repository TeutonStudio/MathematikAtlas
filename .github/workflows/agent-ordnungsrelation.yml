                          richtung = AnschlussRichtung.Ausgang,
                          kante = AnschlussKante.Rechts,
                          art = MathematikAnschlussArten.Zahl.id,
                      ),
                  ),
                  parameter = mapOf(
                      "typ" to MathematikAnschlussArten.Zahl.id.wert,
                      "variabel" to "false",
                      "folgtEingang" to "",
                  ),
