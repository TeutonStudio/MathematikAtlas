                  },
                  parameter = vorlage.standardParameter + parameter,
              )
          }

          private fun KnotenDaten.ordnungsAnschluss(name: String, richtung: AnschlussRichtung): AnschlussDaten =
              anschlüsse.single { it.name == name && it.richtung == richtung }
