name: Fix tensor formula connector

on:
  push:
    branches:
      - samai/v2.25.0-strukturformelrechner

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samai/v2.25.0-strukturformelrechner
          fetch-depth: 0
      - name: Preserve the specific tensor connector type
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/StrukturFormelRechner.kt")
          text = path.read_text(encoding="utf-8")
          old = "FormelTyp.TENSOR -> MathematikAnschlussArten.Objekt.id"
          new = "FormelTyp.TENSOR -> MathematikAnschlussArten.Tensor.id"
          if old not in text:
              raise SystemExit("Expected tensor connector mapping was not found.")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/samai-v2.25.0-tensor-anschluss.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: erhalte spezifische Tensor-Anschlussart"
          git push origin HEAD:samai/v2.25.0-strukturformelrechner
