name: Roadmap v2.21.0 einmalig aktualisieren

on:
  push:
    branches: [agent/v2.21.0-universeller-zahlenrechner]

permissions:
  contents: write

jobs:
  aktualisieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.21.0-universeller-zahlenrechner
      - name: Releaseplan aktualisieren
        run: python3 scripts/aktualisiere_v2_21_0.py
      - name: Einmalige Hilfsdateien entfernen und Ergebnis speichern
        run: |
          git rm .github/workflows/roadmap-v2-21-einmalig.yml scripts/aktualisiere_v2_21_0.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/roadmap.toml
          git commit -m "Releaseplan für v2.21.0 aktualisieren"
          git push origin HEAD:agent/v2.21.0-universeller-zahlenrechner
