name: v2.2.1 PR-Reparatur

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  reparieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.2.1-geometrie-knotenauswahl
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Reparaturen anwenden
        run: python3 scripts/repariere_v2_2_1.py
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Reparaturen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/MathematikAtlasApp.kt \
                  MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/geometrie/GeometrieKnotenVorlagen.kt \
                  MathematikKnoten/src/test/kotlin/de/TeutonStudio/MathematikKnoten/GeometrieVorlagenIntegrationTest.kt
          git commit -m "Geometrie-Knotenauswahl reparieren"
          git push origin HEAD:agent/v2.2.1-geometrie-knotenauswahl
