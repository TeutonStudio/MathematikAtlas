name: v2.2.1 Reparatur

on:
  push:
    branches:
      - agent/v2.2.1-geometrie-knotenauswahl

permissions:
  contents: write

jobs:
  reparieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.2.1-geometrie-knotenauswahl
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Geometrie-Knotenauswahl reparieren
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: erwartete genau eine Fundstelle, gefunden: {count}\n--- gesucht ---\n{old}")
              p.write_text(text.replace(old, new))

          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: erwartete {expected} Fundstellen, gefunden: {count}\n--- gesucht ---\n{old}")
              p.write_text(text.replace(old, new))

          app = "app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/MathematikAtlasApp.kt"
          replace_once(
              app,
              '                val matrizen = sichtbareVorlagen.filter { it.kategorie == "Matrizen" }\n                val tabs = listOf(',
              '                val matrizen = sichtbareVorlagen.filter { it.kategorie == "Matrizen" }\n                val geometrie = sichtbareVorlagen.filter { it.kategorie.startsWith("Geometrie:") }\n                val tabs = listOf(',
          )
          replace_once(
              app,
              '                    KnotenAuswahlTab("Matrizen", matrizen),\n                    KnotenAuswahlTab("Aussagen", sichtbareVorlagen.filter { it.kategorie == "Aussage" || it.kategorie.startsWith("Aussagen:") }),',
              '                    KnotenAuswahlTab("Matrizen", matrizen),\n                    KnotenAuswahlTab("Geometrie", geometrie),\n                    KnotenAuswahlTab("Aussagen", sichtbareVorlagen.filter { it.kategorie == "Aussage" || it.kategorie.startsWith("Aussagen:") }),',
          )
          replace_once(
              app,
              '                val aktiverTab = tabs.firstOrNull { it.name == ausgewählterTab } ?: tabs.first()',
              '                val aktiverTab = tabs.firstOrNull { it.name == ausgewählterTab && it.anzahl > 0 }\n                    ?: tabs.firstOrNull { it.anzahl > 0 }\n                    ?: tabs.first()',
          )
          replace_once(
              app,
              '    "Rechnen", "Mengen", "Mengenrechnung", "Abbildungen", "Vektoren", "Matrizen", "Aussagenlogik", "Mengenprädikate", "Zahlenprädikate", "Aussagenprädikate", "Aussage", "Karten",',
              '    "Rechnen", "Mengen", "Mengenrechnung", "Abbildungen", "Vektoren", "Matrizen",\n    "Geometrie: Räume", "Geometrie: Grundobjekte", "Geometrie: Konstruktionen", "Geometrie: Relationen",\n    "Geometrie: Struktur", "Geometrie: Mengen", "Geometrie: Transformationen", "Geometrie: Darstellung",\n    "Aussagenlogik", "Mengenprädikate", "Zahlenprädikate", "Aussagenprädikate", "Aussage", "Karten",',
          )
          replace_once(
              app,
              'private fun anschlussFarbe(id: String) = when (id) {\n    "mathematik.zahl" -> androidx.compose.ui.graphics.Color(0xFF2563EB)',
              'private fun anschlussFarbe(id: String) = when {\n    id.startsWith("mathematik.geometrie.") -> androidx.compose.ui.graphics.Color(0xFF0891B2)\n    id == "mathematik.zahl" -> androidx.compose.ui.graphics.Color(0xFF2563EB)',
          )
          replace_once(app, '    "mathematik.aussage" -> androidx.compose.ui.graphics.Color(0xFF7C3AED)', '    id == "mathematik.aussage" -> androidx.compose.ui.graphics.Color(0xFF7C3AED)')
          replace_once(app, '    "mathematik.menge" -> androidx.compose.ui.graphics.Color(0xFF059669)', '    id == "mathematik.menge" -> androidx.compose.ui.graphics.Color(0xFF059669)')
          replace_once(app, '    "mathematik.vektor", "mathematik.matrix" -> androidx.compose.ui.graphics.Color(0xFFEA580C)', '    id in setOf("mathematik.vektor", "mathematik.matrix") -> androidx.compose.ui.graphics.Color(0xFFEA580C)')
          replace_once(app, '    "mathematik.funktion" -> androidx.compose.ui.graphics.Color(0xFFDB2777)', '    id == "mathematik.funktion" -> androidx.compose.ui.graphics.Color(0xFFDB2777)')

          vorlagen = "MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/geometrie/GeometrieKnotenVorlagen.kt"
          replace_once(
              vorlagen,
              '            eingang("koordinaten", GeometrieAnschlussArten.KoordinatenTupel.id, 1),',
              '            eingang("koordinaten", MathematikAnschlussArten.Tupel.id, 1),',
          )
          replace_all(
              vorlagen,
              '            eingang("punkt", GeometrieAnschlussArten.KoordinatenTupel.id, 0),',
              '            eingang("punkt", MathematikAnschlussArten.Tupel.id, 0),',
              2,
          )
          replace_once(
              vorlagen,
              '            eingang("translation", GeometrieAnschlussArten.KoordinatenTupel.id, 2),',
              '            eingang("translation", MathematikAnschlussArten.Tupel.id, 2),',
          )
          replace_once(
              vorlagen,
              '            eingang("translation", GeometrieAnschlussArten.KoordinatenTupel.id, 3),',
              '            eingang("translation", MathematikAnschlussArten.Tupel.id, 3),',
          )

          test = Path("MathematikKnoten/src/test/kotlin/de/TeutonStudio/MathematikKnoten/GeometrieVorlagenIntegrationTest.kt")
          test.write_text('''package de.TeutonStudio.MathematikKnoten

import de.TeutonStudio.KnotenKartenVerwalter.daten.*
import de.TeutonStudio.KnotenKartenVerwalter.logik.*
import kotlin.test.*

class GeometrieVorlagenIntegrationTest {
    @Test
    fun `alle Geometrievorlagen besitzen eindeutige Arten und Auswerter`() {
        val arten = GeometrieKnotenVorlagen.alle.map { it.art }
        assertEquals(arten.size, arten.toSet().size, "Geometrie-Knotenarten müssen eindeutig sein.")

        val register = GesamterMathematikAuswerter.erzeugeRegister()
        assertEquals(emptyList(), arten.filter { register.finde(it) == null }, "Jede Geometrievorlage benötigt einen Auswerter.")
    }

    @Test
    fun `normales Tupel kann einen Punkt speisen`() {
        val tupel = MathematikKnotenVorlagen.Tupel.erzeuge(GraphPunkt.Zero)
        val punkt = GeometrieKnotenVorlagen.PunktAusKoordinaten.erzeuge(GraphPunkt(300f, 0f))
        assertVerbindbar(tupel, "tupel", punkt, "koordinaten")
    }

    @Test
    fun `normales Tupel kann lineare und affine Punkttransformationen speisen`() {
        val tupel = MathematikKnotenVorlagen.Tupel.erzeuge(GraphPunkt.Zero)
        val linear = GeometrieKnotenVorlagen.LinearePunkttransformation.erzeuge(GraphPunkt(300f, 0f))
        val affin = GeometrieKnotenVorlagen.AffinePunkttransformation.erzeuge(GraphPunkt(600f, 0f))
        val affineAbbildung = GeometrieKnotenVorlagen.AffineTransformation.erzeuge(GraphPunkt(900f, 0f))

        assertVerbindbar(tupel, "tupel", linear, "punkt")
        assertVerbindbar(tupel, "tupel", affin, "punkt")
        assertVerbindbar(tupel, "tupel", affin, "translation")
        assertVerbindbar(tupel, "tupel", affineAbbildung, "translation")
    }

    private fun assertVerbindbar(quelle: KnotenDaten, ausgang: String, ziel: KnotenDaten, eingang: String) {
        val karte = KartenDaten(name = "Geometrie-Integration", knoten = listOf(quelle, ziel))
        val von = AnschlussVerweis(quelle.id, quelle.anschlüsse.single { it.name == ausgang }.id)
        val zu = AnschlussVerweis(ziel.id, ziel.anschlüsse.single { it.name == eingang }.id)
        val prüfung = GraphPrüfung(AnschlussArtRegister(MathematikAnschlussArten.alle)).prüfe(karte, von, zu)
        assertIs<VerbindungsPrüfung.Erlaubt>(prüfung)
    }
}
''')
          PY
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Reparaturen committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/MathematikAtlasApp.kt \
                  MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/geometrie/GeometrieKnotenVorlagen.kt \
                  MathematikKnoten/src/test/kotlin/de/TeutonStudio/MathematikKnoten/GeometrieVorlagenIntegrationTest.kt
          git commit -m "Geometrie-Knotenauswahl reparieren"
          git push origin HEAD:agent/v2.2.1-geometrie-knotenauswahl
