name: Gradle-Wrapper v2.27.3 reparieren

on:
  push:
    branches:
      - samai/v2.27.3-standardkarten-seeding

permissions:
  contents: write

jobs:
  wrapper:
    if: github.repository == 'TeutonStudio/MathematikAtlas'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Offiziellen Gradle-9.5.0-Wrapper laden und prüfen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradle/wrapper/gradle-wrapper.jar' \
            --output gradle/wrapper/gradle-wrapper.jar.new
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar.new' | sha256sum --check --strict
          mv gradle/wrapper/gradle-wrapper.jar.new gradle/wrapper/gradle-wrapper.jar

      - name: Geprüften Wrapper in den Releasebranch übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git add gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo 'Wrapper ist bereits exakt auf Gradle 9.5.0 synchronisiert.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Offiziellen Gradle-9.5-Wrapper synchronisieren'
          git push origin HEAD:samai/v2.27.3-standardkarten-seeding
