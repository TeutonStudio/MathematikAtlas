name: Bootstrap v2.11.1 KartenKnoten

on:
  push:
    branches:
      - agent/v2.11.1-kartenknoten
    paths:
      - scripts/bootstrap_v2111.py
      - .github/workflows/bootstrap-v2.11.1.yml
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2.11.1-kartenknoten
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Änderungen anwenden
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/bootstrap_v2111.py')
          text = p.read_text()
          text = text.replace(
              "append_once('release/roadmap.toml', 'version = \"2.11.1\"',",
              "append_once('release/roadmap.toml', 'title = \"Versionierte KartenKnoten und Karten-Drag-and-drop\"',",
          )
          p.write_text(text)
          PY
          python3 scripts/bootstrap_v2111.py
          sed -i '/import androidx.compose.ui.input.pointer.consume/d' app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/KartenDrag.kt
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/AtlasMigrationen.kt')
          text = migration.read_text()
          alt = '''    .sortedWith(compareBy({ it.first.position.y }, { it.first.position.x }, { it.first.id.wert }))
    .distinctBy { it.second }
'''
          neu = '''    .withIndex()
    .distinctBy { it.value.second }
    .sortedWith(compareBy({ it.value.first.position.y }, { it.value.first.position.x }, { it.index }))
    .map { it.value }
'''
          if text.count(alt) != 1:
              raise RuntimeError('Schnittstellen-Deduplizierung nicht eindeutig gefunden.')
          migration.write_text(text.replace(alt, neu, 1))

          kartenknoten = Path('app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/KartenKnoten.kt')
          text = kartenknoten.read_text()
          alt = '''    return refs.any { ref -> !besucht.add(ref) || speicher.lade(ref)?.let { referenziertKarte(it, gesuchteId, besucht) } == true }
'''
          neu = '''    return refs.any { ref ->
        if (!besucht.add(ref)) false
        else speicher.lade(ref)?.let { referenziertKarte(it, gesuchteId, besucht) } == true
    }
'''
          if text.count(alt) != 1:
              raise RuntimeError('Kartenreferenz-Rekursion nicht eindeutig gefunden.')
          kartenknoten.write_text(text.replace(alt, neu, 1))
          PY
      - name: Releaseplan prüfen
        run: |
          python3 scripts/pruefe_releaseplan.py
          python3 scripts/pruefe_versionsfolge.py
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Tests und Debug-Build
        run: ./gradlew test :app:assembleDebug --stacktrace
      - name: Finalen Commit erzeugen
        run: |
          rm -f scripts/bootstrap_v2111.py .github/workflows/bootstrap-v2.11.1.yml sitecustomize.py
          git config user.name "Mathematik-Atlas Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v2.11.1 KartenKnoten und Karten-Drag-and-drop"
          git push origin HEAD:agent/v2.11.1-kartenknoten
