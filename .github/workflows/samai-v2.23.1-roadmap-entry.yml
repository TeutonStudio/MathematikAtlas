name: SamAI v2.23.1 Roadmap Entry

on:
  push:
    branches:
      - samai/v2.23.1-auswerten-umformung

permissions:
  contents: write

jobs:
  append-roadmap-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samai/v2.23.1-auswerten-umformung
          fetch-depth: 0
      - name: Append roadmap entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("release/roadmap.toml")
          content = path.read_text()
          marker = '\nversion = "2.23.1"\n'
          if marker not in content:
              content = content.rstrip() + '''

          [[releases]]
          version = "2.23.1"
          title = "Interaktive Gauß- und Umformungstabelle"
          roadmap = "v2.23.x Lineare Algebra und Bedienoberfläche"
          status = "released"
          previous_release = "2.23.0"
          branch = "samai/v2.23.1-auswerten-umformung"
          kind = "feature"
          version_axis = "x"
          reason = "Vervollständigt den vorhandenen Auswerten-Knoten um Inspector-Modi und eine interaktive strukturierte Gauß-/Gauß-Jordan-Tabelle, ohne einen neuen registrierten Knotentyp einzuführen."
          '''
          path.write_text(content)
          Path(".github/workflows/samai-v2.23.1-roadmap-entry.yml").unlink()
          PY
      - name: Commit roadmap entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/roadmap.toml .github/workflows/samai-v2.23.1-roadmap-entry.yml
          git commit -m "v2.23.1: Roadmapeintrag ergänzen [v2.23.1-roadmap]"
          git push origin HEAD:samai/v2.23.1-auswerten-umformung
