name: Interner Definitionskarten-Patch

on:
  push:
    branches:
      - agent/standardwerte-inspektor-layout

permissions:
  contents: write

jobs:
  patchen:
    if: ${{ !contains(github.event.head_commit.message, '[definitionskarte-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/standardwerte-inspektor-layout
          fetch-depth: 0

      - name: Zahnrad-Darstellung explizit konfigurierbar machen
        shell: python
        run: |
          from pathlib import Path

          editor_path = Path("KnotenKartenVerwalter/src/main/kotlin/de/TeutonStudio/KnotenKartenVerwalter/schnittstelle/KnotenKartenEditor.kt")
          editor = editor_path.read_text(encoding="utf-8")

          replacements = [
              (
                  "    beiKnotenDoppelklick: (KnotenDaten) -> Unit = {},\n    beiKnotenInspektor: (KnotenDaten) -> Unit = { InspektorSichtbarkeit.öffnen() },",
                  "    beiKnotenDoppelklick: (KnotenDaten) -> Unit = {},\n    zeigeKnotenInspektor: Boolean = true,\n    beiKnotenInspektor: (KnotenDaten) -> Unit = { InspektorSichtbarkeit.öffnen() },",
              ),
              (
                  "                        beiDoppelklick = { beiKnotenDoppelklick(knoten) },\n                        beiInspektorÖffnen = { beiKnotenInspektor(knoten) },",
                  "                        beiDoppelklick = { beiKnotenDoppelklick(knoten) },\n                        zeigeKnotenInspektor = zeigeKnotenInspektor,\n                        beiInspektorÖffnen = { beiKnotenInspektor(knoten) },",
              ),
              (
                  "    beiVerbindungAufHintergrund: (AnschlussVerweis, GraphPunkt) -> Unit,\n    beiDoppelklick: () -> Unit,\n    beiInspektorÖffnen: () -> Unit,",
                  "    beiVerbindungAufHintergrund: (AnschlussVerweis, GraphPunkt) -> Unit,\n    beiDoppelklick: () -> Unit,\n    zeigeKnotenInspektor: Boolean,\n    beiInspektorÖffnen: () -> Unit,",
              ),
              (
                  "        IconButton(\n            onClick = {\n                zustand.wähleKnoten(knoten.id)\n                beiInspektorÖffnen()\n            },\n            modifier = Modifier\n                .align(Alignment.TopEnd)\n                .size(40.dp)\n                .semantics { contentDescription = \"Inspektor öffnen\" },\n        ) {\n            Text(\"⚙\", style = MaterialTheme.typography.titleMedium)\n        }",
                  "        if (zeigeKnotenInspektor) {\n            IconButton(\n                onClick = {\n                    zustand.wähleKnoten(knoten.id)\n                    beiInspektorÖffnen()\n                },\n                modifier = Modifier\n                    .align(Alignment.TopEnd)\n                    .size(40.dp)\n                    .semantics { contentDescription = \"Inspektor öffnen\" },\n            ) {\n                Text(\"⚙\", style = MaterialTheme.typography.titleMedium)\n            }\n        }",
              ),
          ]

          for old, new in replacements:
              count = editor.count(old)
              if count != 1:
                  raise SystemExit(f"Erwartete Editor-Stelle {count} statt genau einmal gefunden: {old[:80]!r}")
              editor = editor.replace(old, new, 1)
          editor_path.write_text(editor, encoding="utf-8")

          concept_path = Path("app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/konzepte/KonzeptUi.kt")
          concept = concept_path.read_text(encoding="utf-8")
          old = "        farbeFürAnschluss = { anschluss -> anschlussFarbe(anschluss.art.wert) },\n    )"
          new = "        farbeFürAnschluss = { anschluss -> anschlussFarbe(anschluss.art.wert) },\n        zeigeKnotenInspektor = false,\n    )"
          count = concept.count(old)
          if count != 1:
              raise SystemExit(f"Unveränderliche Konzeptkarte nicht eindeutig gefunden: {count}")
          concept_path.write_text(concept.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/agent-hide-definition-gear.yml").unlink()

      - name: Patch committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnotenKartenVerwalter/src/main/kotlin/de/TeutonStudio/KnotenKartenVerwalter/schnittstelle/KnotenKartenEditor.kt \
                  app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/konzepte/KonzeptUi.kt \
                  .github/workflows/agent-hide-definition-gear.yml
          git commit -m "Zahnrad in unveränderlichen Definitionskarten ausblenden [definitionskarte-patched]"
          git push origin HEAD:agent/standardwerte-inspektor-layout
