name: SamAI Issue 208 Inspector Patch

on:
  push:
    branches:
      - samai/v2.23.1-auswerten-umformung

permissions:
  contents: write

jobs:
  patch-inspector-registry:
    if: ${{ !contains(github.event.head_commit.message, '[issue-208-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samai/v2.23.1-auswerten-umformung
          fetch-depth: 0
      - name: Register Auswerten inspector
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/KnotenInspektoren.kt")
          content = path.read_text()
          anchor = '        "mathematik.matrixdiagonale" to MatrixdiagonaleInspektor,\n'
          addition = anchor + '        "mathematik.auswerten" to AuswertenInspektor,\n'
          if '"mathematik.auswerten" to AuswertenInspektor' not in content:
              if anchor not in content:
                  raise SystemExit("Inspector registry anchor not found")
              path.write_text(content.replace(anchor, addition, 1))

          Path(".github/workflows/samai-issue-208-patch.yml").unlink()
      - name: Commit registry patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/KnotenInspektoren.kt .github/workflows/samai-issue-208-patch.yml
          git commit -m "Issue 208: Auswertungsinspektor registrieren [issue-208-patched]"
          git push origin HEAD:samai/v2.23.1-auswerten-umformung
