name: Issue 67 Testmigration

on:
  pull_request:
    branches:
      - release/v2.16.0-abschluss

permissions:
  contents: write

jobs:
  korrigieren-und-pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Methodentests auf den kanonischen Vertrag migrieren
        shell: bash
        run: |
          git reset --hard 7e39bed00c8aa22c24ac126dedc46895f7c4e303
          python3 - <<'PY'
          from pathlib import Path

          dateien = [
              Path("MathematikRechenSystem/src/test/kotlin/de/TeutonStudio/MathematikRechenSystem/IterierteOperatorenTest.kt"),
              Path("MathematikRechenSystem/src/test/kotlin/de/TeutonStudio/MathematikRechenSystem/MathematikRechenSystemTest.kt"),
          ]
          for datei in dateien:
              text = datei.read_text()
              neu = text.replace('.auswerten().getValue("wert")', '.auswerten()')
              if neu == text:
                  raise SystemExit(f"Kein veralteter Zugriff in {datei}")
              datei.write_text(neu)

          karten_test = Path("MathematikKartenAdapter/src/test/kotlin/de/TeutonStudio/MathematikKartenAdapter/KartenMethodenTest.kt")
          text = karten_test.read_text()
          veraltet = "        assertEquals(ReelleZahlen, methode.zielMenge)\n"
          if text.count(veraltet) != 1:
              raise SystemExit("Der widersprüchliche Einzelzielmengen-Test wurde nicht eindeutig gefunden")
          karten_test.write_text(text.replace(veraltet, ""))
          PY
          git add MathematikRechenSystem/src/test/kotlin/de/TeutonStudio/MathematikRechenSystem/IterierteOperatorenTest.kt
          git add MathematikRechenSystem/src/test/kotlin/de/TeutonStudio/MathematikRechenSystem/MathematikRechenSystemTest.kt
          git add MathematikKartenAdapter/src/test/kotlin/de/TeutonStudio/MathematikKartenAdapter/KartenMethodenTest.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Repository und Architektur prüfen
        run: |
          python3 scripts/pruefe_repository.py
          python3 scripts/pruefe_architektur.py

      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug

      - name: Einzelcommit veröffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Methodentests auf kanonischen Rückgabevertrag migrieren (#67)" \
            -m "- gebundene Einzelmethoden direkt als MathematischesObjekt prüfen" \
            -m "- veraltete getValue-Zugriffe aus der früheren Mehrfachausgabe-API entfernen" \
            -m "- Karten mit mehreren Ausgängen ausschließlich gegen ihre Produktzielmenge prüfen" \
            -m "- vollständigen Test- und Android-Debug-Build absichern"
          git push --force origin HEAD:agent/issue-67-testmigration
