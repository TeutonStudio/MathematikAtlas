name: v2.1.16 und v2.1.17 abschließend prüfen

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: rebuild-v2.1.16-v2.1.17
  cancel-in-progress: false

jobs:
  korrigieren-testen-veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository vollständig auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commitfolge ab v2.1.15 rekonstruieren
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard 9e46f436ae537e07a1352e1886dbbc789323e378
          git cherry-pick 0b05f3d677fc2f22c4fe06c597970352f59de076

      - name: Abbruch und bewusstes Hintergrund-Ablegen trennen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          zustand = Path('KnotenKartenVerwalter/src/main/kotlin/de/TeutonStudio/KnotenKartenVerwalter/zustand/KartenEditorZustand.kt')
          text = zustand.read_text(encoding='utf-8')
          marker = '    fun anschlussAngeklickt(ref: AnschlussVerweis) {'
          ergänzung = '''    /** Bricht einen Pointer-Drag ab, ohne eine bestehende Verbindung zu verändern. */
              fun brecheVerbindungsVorschauAb() {
                  verwerfeVerbindungsInteraktion()
              }

          '''.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit('Einfügepunkt für brecheVerbindungsVorschauAb ist nicht eindeutig.')
          zustand.write_text(text.replace(marker, ergänzung + marker), encoding='utf-8')

          editor = Path('KnotenKartenVerwalter/src/main/kotlin/de/TeutonStudio/KnotenKartenVerwalter/schnittstelle/KnotenKartenEditor.kt')
          text = editor.read_text(encoding='utf-8')
          alt = '''                    onDragCancel = {
                                  zugPosition = null
                                  zustand.beendeVerbindungsVorschau()
                              },'''.replace('                              ', '')
          neu = '''                    onDragCancel = {
                                  zugPosition = null
                                  zustand.brecheVerbindungsVorschauAb()
                              },'''.replace('                              ', '')
          if text.count(alt) != 1:
              raise SystemExit('onDragCancel-Aufruf konnte nicht eindeutig ersetzt werden.')
          editor.write_text(text.replace(alt, neu), encoding='utf-8')

          test = Path('KnotenKartenVerwalter/src/test/kotlin/de/TeutonStudio/KnotenKartenVerwalter/GraphPrüfungTest.kt')
          text = test.read_text(encoding='utf-8')
          marker = '    @Test fun aktiverStartBleibtZumAbbrechenAnklickbar() {'
          testfall = '''    @Test fun abgebrochenerDragVomBelegtenEingangBehältDieVerbindung() {
                  val quelle = knoten("q", AnschlussRichtung.Ausgang, zahl.id)
                  val ziel = knoten("z", AnschlussRichtung.Eingang, objekt.id)
                  val bestehend = VerbindungDaten(von = ref(quelle), zu = ref(ziel))
                  val zustand = KartenEditorZustand(
                      KartenDaten(name = "Test", knoten = listOf(quelle, ziel), verbindungen = listOf(bestehend)),
                      prüfung,
                  )

                  zustand.beginneVerbindung(ref(ziel), GraphPunkt.Zero)
                  zustand.brecheVerbindungsVorschauAb()

                  assertEquals(listOf(bestehend), zustand.karte.verbindungen)
                  assertNull(zustand.verbindungsStart)
                  assertNull(zustand.verbindungsVorschau)
                  assertFalse(zustand.kannRückgängig())
              }

          '''.replace('          ', '')
          if text.count(marker) != 1:
              raise SystemExit('Einfügepunkt für den Drag-Abbruchtest ist nicht eindeutig.')
          test.write_text(text.replace(marker, testfall + marker), encoding='utf-8')
          PY

          git add KnotenKartenVerwalter/src/main/kotlin/de/TeutonStudio/KnotenKartenVerwalter/zustand/KartenEditorZustand.kt \
                  KnotenKartenVerwalter/src/main/kotlin/de/TeutonStudio/KnotenKartenVerwalter/schnittstelle/KnotenKartenEditor.kt \
                  KnotenKartenVerwalter/src/test/kotlin/de/TeutonStudio/KnotenKartenVerwalter/GraphPrüfungTest.kt
          git commit --amend --no-edit

      - name: v2.1.17 auf korrigiertem v2.1.16 aufbauen
        run: git cherry-pick b0cca6157a0a048f0f62dee4ad14ce7e43f0bb0e

      - name: Commitfolge prüfen
        shell: bash
        run: |
          test "$(git rev-list --count 9e46f436ae537e07a1352e1886dbbc789323e378..HEAD)" = 2
          test "$(git log -1 --format=%s)" = 'v2.1.17'
          test "$(git log -2 --format=%s | tail -n 1)" = 'v2.1.16'
          ! grep -R -n -w --include='*.kt' 'Falsch' .
          grep -R -n 'brecheVerbindungsVorschauAb' KnotenKartenVerwalter/src/main KnotenKartenVerwalter/src/test

      - name: Tests ausführen und protokollieren
        id: gradle_tests
        shell: bash
        run: |
          set +e
          ./gradlew test --stacktrace > gradle-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 180 gradle-test.log
          exit 0

      - name: Gradle-Testprotokoll hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2.1.16-v2.1.17-gradle-test
          path: gradle-test.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Bei fehlgeschlagenen Tests abbrechen
        if: steps.gradle_tests.outputs.status != '0'
        run: exit 1

      - name: Korrigierte Commitfolge veröffentlichen
        shell: bash
        run: |
          rm -f gradle-test.log
          git push --force-with-lease=refs/heads/master:b0cca6157a0a048f0f62dee4ad14ce7e43f0bb0e origin HEAD:master
