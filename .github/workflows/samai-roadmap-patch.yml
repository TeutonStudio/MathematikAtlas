name: SamAI Roadmap Patch

on:
  push:
    branches:
      - samai/v2.24.0-skalarprodukt

permissions:
  contents: write

jobs:
  patch-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samai/v2.24.0-skalarprodukt
      - name: Releaseplan auf v2.24.0 fortschreiben
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("release/roadmap.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('current_series = "2.23.x"', 'current_series = "2.24.x"', 1)
          text = text.replace('current_version = "2.23.0"', 'current_version = "2.24.0"', 1)
          if 'version = "2.24.0"' not in text:
              text = text.rstrip() + '''

          [[releases]]
          version = "2.24.0"
          title = "Skalarprodukte und Begriffszertifikate"
          roadmap = "v2.24.x Lineare Algebra und zertifizierte Definitionskarten"
          status = "released"
          previous_release = "2.23.0"
          branch = "samai/v2.24.0-skalarprodukt"
          kind = "feature"
          version_axis = "y"
          new_node_types = ["mathematik.begriff.skalarprodukt"]
          reason = "Führt einen separat erzeugbaren Begriffsknoten für Skalarprodukt-Zertifikate ein, vervollständigt das Standardskalarprodukt für komplexe und quaternionische Skalare und erlaubt ausschließlich versionsfeste, nachgewiesene Karten als benutzerdefinierte Definitionen."
          '''
          path.write_text(text, encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/roadmap.toml
          git diff --cached --quiet && exit 0
          git commit -m "chore(v2.24.0): update release roadmap"
          git push origin HEAD:samai/v2.24.0-skalarprodukt
