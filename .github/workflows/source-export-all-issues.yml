name: Aktuellen Abschlussquellbaum exportieren

on:
  pull_request:
    branches:
      - release/v2.16.0-abschluss

permissions:
  contents: read

jobs:
  exportieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quellbaum verpacken
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/MathematikAtlas-all-issues-source.tar.gz" .
      - name: Quellbaum bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: MathematikAtlas-all-issues-source
          path: ${{ runner.temp }}/MathematikAtlas-all-issues-source.tar.gz
          retention-days: 1
