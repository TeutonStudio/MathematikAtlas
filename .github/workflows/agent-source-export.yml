name: Agent source export

on:
  push:
    branches:
      - agent/source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package source tree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/MathematikAtlas-source.tar.gz" .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MathematikAtlas-source
          path: ${{ runner.temp }}/MathematikAtlas-source.tar.gz
          if-no-files-found: error
          retention-days: 1
