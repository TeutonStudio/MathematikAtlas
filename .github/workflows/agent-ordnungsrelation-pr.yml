name: Agent Ordnungsrelation PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  implementieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Patchskript ausführen
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/agent-ordnungsrelation.yml').read_text()
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n"
          script = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          exec(compile(dedent(script), '<ordnungsrelation-agent>', 'exec'))
          PY

      - name: Repository prüfen
        run: python3 scripts/pruefe_repository.py

      - name: Tests
        run: ./gradlew test

      - name: Debug-App bauen
        run: ./gradlew :app:assembleDebug

      - name: Änderungen committen
        shell: bash
        run: |
          rm .github/workflows/agent-ordnungsrelation.yml
          rm .github/workflows/agent-ordnungsrelation-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implementiert gemeinsame Ordnungsrelation"
          git push origin HEAD:${{ github.head_ref }}
