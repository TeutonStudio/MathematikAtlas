name: Knoten-UI-Reparatur anwenden

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  anwenden:
    if: github.head_ref == 'agent/fix-node-ui-289-287'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Reparatur anwenden
        run: python3 scripts/agent_node_ui_fix.py
      - name: Einmalige Hilfsdateien entfernen
        run: |
          rm -f .github/workflows/agent-node-ui-fix.yml
          rm -f .github/workflows/agent-node-ui-pr.yml
          rm -f scripts/agent_node_ui_fix.py
      - name: Architektur prüfen
        run: python3 scripts/pruefe_architektur.py
      - name: Bauen und testen
        run: ./gradlew --stacktrace test :app:assembleDebug
      - name: Reparatur committen
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Knoteninteraktion und Definitionskarten reparieren" -m "Erlaubt Ganzflächen-Drag für Mathematikknoten, ersetzt das Unicode-Zahnrad durch ein kontrastadaptives VectorDrawable und rendert strukturierte Dokumentationsformeln über den gemeinsamen LaTeX-Kern. Ergänzt Regressionstests."
          git push origin HEAD:"$HEAD_REF"
