name: Mathematikkern prüfen

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-math-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Repositorystruktur prüfen
        run: python3 scripts/pruefe_repository.py

      - name: Standardkarten prüfen
        run: python3 scripts/pruefe_standardkarten.py

      - name: Releaseplan prüfen
        run: python3 scripts/pruefe_releaseplan.py

      - name: Kernprüfung ausführen
        run: python3 scripts/pruefe_kern.py

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: TypSystem testen
        run: ./gradlew :TypSystem:test --stacktrace

      - name: MathematikRechenSystem testen
        run: ./gradlew :MathematikRechenSystem:test --stacktrace

      - name: KnotenKartenVerwalter Debug testen
        run: ./gradlew :KnotenKartenVerwalter:testDebugUnitTest --stacktrace

      - name: KnotenKartenVerwalter Release testen
        run: ./gradlew :KnotenKartenVerwalter:testReleaseUnitTest --stacktrace

      - name: MathematikKartenAdapter Debug testen
        run: ./gradlew :MathematikKartenAdapter:testDebugUnitTest --stacktrace

      - name: MathematikKartenAdapter Release testen
        run: ./gradlew :MathematikKartenAdapter:testReleaseUnitTest --stacktrace

      - name: MathematikKnoten Debug testen
        run: ./gradlew :MathematikKnoten:testDebugUnitTest --stacktrace

      - name: MathematikKnoten Release testen
        run: ./gradlew :MathematikKnoten:testReleaseUnitTest --stacktrace

      - name: App Debug testen
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: App Release testen
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Android-Debug-Build erstellen
        run: ./gradlew :app:assembleDebug --stacktrace
