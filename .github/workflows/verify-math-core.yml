name: Mathematikkern prüfen

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-math-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Repositorystruktur prüfen
        run: python3 scripts/pruefe_repository.py

      - name: Standardkarten prüfen
        run: python3 scripts/pruefe_standardkarten.py

      - name: Releaseplan prüfen
        run: python3 scripts/pruefe_releaseplan.py

      - name: Kernprüfung ausführen
        run: python3 scripts/pruefe_kern.py

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: Neutralen Typkern testen
        run: ./gradlew :TypSystem:test --stacktrace

      - name: MathematikRechenSystem testen
        run: ./gradlew :MathematikRechenSystem:test --stacktrace

      - name: KnotenKartenVerwalter testen
        run: ./gradlew :KnotenKartenVerwalter:testDebugUnitTest --stacktrace

      - name: MathematikKartenAdapter testen
        run: ./gradlew :MathematikKartenAdapter:testDebugUnitTest --stacktrace

      - name: MathematikKnoten testen
        run: ./gradlew :MathematikKnoten:testDebugUnitTest --stacktrace

      - name: App testen
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android-Debug-Build erstellen
        run: ./gradlew :app:assembleDebug --stacktrace

  android-runtime:
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.ci-avd
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator platforms;android-35 system-images;android-35;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM freigeben
        run: sudo chmod a+rw /dev/kvm
      - name: Isolierten Emulator starten
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name atlas-ci --path "$ANDROID_AVD_HOME/atlas-ci.avd" --package 'system-images;android-35;google_apis;x86_64' --force
          printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$ANDROID_AVD_HOME/atlas-ci.avd" > "$ANDROID_AVD_HOME/atlas-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -avd atlas-ci -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim > /tmp/atlas-emulator.log 2>&1 &
          emulator_pid=$!
          for versuch in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat /tmp/atlas-emulator.log; exit 1; fi
            if timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then exit 0; fi
            sleep 2
          done
          cat /tmp/atlas-emulator.log
          exit 1
      - name: Compose- und Inspector-Laufzeit prüfen
        run: ./gradlew :KnotenKartenVerwalter:connectedDebugAndroidTest :app:connectedDebugAndroidTest --stacktrace
      - name: Laufzeitberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-tests
          path: |
            **/build/reports/androidTests/
            /tmp/atlas-emulator.log
