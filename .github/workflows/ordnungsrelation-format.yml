name: Ordnungsrelation Format

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  formatieren:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Einrückung korrigieren
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rücke_bereich_ein(path: str, start: str, ende: str, leerzeichen: int) -> None:
              datei = Path(path)
              zeilen = datei.read_text().splitlines()
              start_index = next((i for i, zeile in enumerate(zeilen) if zeile == start), None)
              if start_index is None:
                  raise SystemExit(f'{path}: Startzeile fehlt: {start}')
              ende_index = next((i for i in range(start_index + 1, len(zeilen)) if zeilen[i] == ende), None)
              if ende_index is None:
                  raise SystemExit(f'{path}: Endezeile fehlt: {ende}')
              präfix = ' ' * leerzeichen
              for index in range(start_index, ende_index):
                  if zeilen[index]:
                      zeilen[index] = präfix + zeilen[index]
              datei.write_text('\n'.join(zeilen) + '\n')

          rücke_bereich_ein(
              'MathematikKartenAdapter/src/main/kotlin/de/TeutonStudio/MathematikKartenAdapter/KartenAuswerter.kt',
              '"mathematik.gleichheit" -> mapOf("aussage" to binär("="))',
              '            "mathematik.kleiner" -> mapOf("aussage" to binär("<"))',
              12,
          )
          rücke_bereich_ein(
              'app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/konzepte/KonzeptModell.kt',
              'fun fürKnoten(knoten: KnotenDaten): KonzeptDefinition? =',
              '    fun validierungsFehler(): List<String> = validierungsFehler(alle)',
              4,
          )
          rücke_bereich_ein(
              'MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt',
              'private fun vergleichVorlage(name: String, zeichen: String, relation: String) = KnotenVorlage(',
              '    private fun mengenAussagenVorlage(art: String, name: String, beschreibung: String) = aussagenVorlage(art, name, beschreibung, MathematikAnschlussArten.Menge.id, MathematikAnschlussArten.Menge.id, "Aussagen: Mengenprädikate")',
              4,
          )
          rücke_bereich_ein(
              'MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/MathematikKnotenVorlagen.kt',
              'private fun iterierteAussagenVorlage(name: String, beschreibung: String, operator: String) = KnotenVorlage(',
              '    private fun aussagenOperatorVorlage(art: String, name: String, beschreibung: String) = KnotenVorlage(art, name, "Aussage", beschreibung, GraphGröße(230f, 115f), listOf(eingang("a", MathematikAnschlussArten.Aussage.id, 0, true), eingang("b", MathematikAnschlussArten.Aussage.id, 1, true), ausgang("aussage", MathematikAnschlussArten.Aussage.id)), mapOf("festeEingänge" to "2", "operatorAnzeige" to "wert"))',
              4,
          )
          PY

      - name: Repository prüfen
        run: python3 scripts/pruefe_repository.py

      - name: Tests
        run: ./gradlew test

      - name: Debug-App bauen
        run: ./gradlew :app:assembleDebug

      - name: Formatkorrektur committen
        shell: bash
        run: |
          rm .github/workflows/ordnungsrelation-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Formatiert Ordnungsrelation-Umsetzung"
          git push origin HEAD:${{ github.head_ref }}
