name: SamAI Issue 208 CI Fix

on:
  push:
    branches:
      - samai/v2.23.1-auswerten-umformung

permissions:
  contents: write

jobs:
  fix-compose-imports:
    if: ${{ !contains(github.event.head_commit.message, '[issue-208-ci-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samai/v2.23.1-auswerten-umformung
          fetch-depth: 0
      - name: Fix RowScope weight imports
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path("app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/AuswertenInspektor.kt"),
              Path("app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/UmformungsTabelleUi.kt"),
          ]
          for path in files:
              content = path.read_text()
              content = content.replace("import androidx.compose.foundation.layout.weight\n", "")
              path.write_text(content)

          Path(".github/workflows/samai-issue-208-ci-fix.yml").unlink()
      - name: Commit CI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/AuswertenInspektor.kt app/src/main/kotlin/de/TeutonStudio/MathematikAtlas/UmformungsTabelleUi.kt .github/workflows/samai-issue-208-ci-fix.yml
          git commit -m "Issue 208: Compose-RowScope-Import korrigieren [issue-208-ci-fix]"
          git push origin HEAD:samai/v2.23.1-auswerten-umformung
