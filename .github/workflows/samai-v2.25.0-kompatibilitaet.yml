name: Fix structure calculator compatibility

on:
  push:
    branches:
      - samai/v2.25.0-strukturformelrechner
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: samai/v2.25.0-strukturformelrechner
          fetch-depth: 0

      - name: Preserve vector output and normalize calculator catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          struktur = Path("MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/StrukturFormelRechner.kt")
          text = struktur.read_text(encoding="utf-8")

          replacements = {
              "object StrukturFormelRechnerVorlagen {": """private fun StrukturRechnerKnotenFamilie.ausgangName(): String = when (this) {
    StrukturRechnerKnotenFamilie.VEKTOR -> VEKTOR_RECHNER_AUSGANG
    else -> \"wert\"
}

object StrukturFormelRechnerVorlagen {""",
              "            } + neuerAusgang(operator.ergebnisTyp),": "            } + neuerAusgang(familie, operator.ergebnisTyp),",
              "    } + erhalteOderErzeugeAusgang(knoten, operator.ergebnisTyp)": "    } + erhalteOderErzeugeAusgang(knoten, familie, operator.ergebnisTyp)",
              "    } + erhalteOderErzeugeAusgang(knoten, wurzel.typ)": "    } + erhalteOderErzeugeAusgang(knoten, familie, wurzel.typ)",
              """private fun erhalteOderErzeugeAusgang(knoten: KnotenDaten, typ: FormelTyp): AnschlussDaten {
    val art = anschlussArt(typ)
    val vorhanden = knoten.anschlüsse.firstOrNull {
        it.name == \"wert\" && it.richtung == AnschlussRichtung.Ausgang && it.art == art
    }
    return vorhanden?.copy(
        name = \"wert\",
        richtung = AnschlussRichtung.Ausgang,
        kante = AnschlussKante.Rechts,
        art = art,
        zulässigeArten = emptySet(),
        reihenfolge = 0,
        kannSichErweitern = false,
        dynamischErzeugt = false,
    ) ?: neuerAusgang(typ)
}""": """private fun erhalteOderErzeugeAusgang(
    knoten: KnotenDaten,
    familie: StrukturRechnerKnotenFamilie,
    typ: FormelTyp,
): AnschlussDaten {
    val name = familie.ausgangName()
    val art = anschlussArt(typ)
    val vorhanden = knoten.anschlüsse.firstOrNull {
        it.name == name && it.richtung == AnschlussRichtung.Ausgang && it.art == art
    }
    return vorhanden?.copy(
        name = name,
        richtung = AnschlussRichtung.Ausgang,
        kante = AnschlussKante.Rechts,
        art = art,
        zulässigeArten = emptySet(),
        reihenfolge = 0,
        kannSichErweitern = false,
        dynamischErzeugt = false,
    ) ?: neuerAusgang(familie, typ)
}""",
              """private fun neuerAusgang(typ: FormelTyp) = AnschlussDaten(
    name = \"wert\",
    richtung = AnschlussRichtung.Ausgang,
    kante = AnschlussKante.Rechts,
    art = anschlussArt(typ),
)""": """private fun neuerAusgang(
    familie: StrukturRechnerKnotenFamilie,
    typ: FormelTyp,
) = AnschlussDaten(
    name = familie.ausgangName(),
    richtung = AnschlussRichtung.Ausgang,
    kante = AnschlussKante.Rechts,
    art = anschlussArt(typ),
)""",
              """                    val ergebnis = basis.auswerten(kontext)
                    if (\"wert\" in ergebnis.ausgaben || ergebnis.ausgaben.size != 1) ergebnis
                    else ergebnis.copy(ausgaben = mapOf(\"wert\" to ergebnis.ausgaben.values.single()))""": """                    val ergebnis = basis.auswerten(kontext)
                    val ausgangName = familie.ausgangName()
                    if (ausgangName in ergebnis.ausgaben || ergebnis.ausgaben.size != 1) ergebnis
                    else ergebnis.copy(ausgaben = mapOf(ausgangName to ergebnis.ausgaben.values.single()))""",
              """        ausgaben = mapOf(\"wert\" to BedingterWert(wert, annahmenFuerStrukturFormel())),""": """        ausgaben = mapOf(familie.ausgangName() to BedingterWert(wert, annahmenFuerStrukturFormel())),""",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected structure calculator fragment was not found:\n{old[:160]}")
              text = text.replace(old, new, 1)
          struktur.write_text(text, encoding="utf-8")

          katalog = Path("MathematikKnoten/src/main/kotlin/de/TeutonStudio/MathematikKnoten/AussagenLogikKnoten.kt")
          text = katalog.read_text(encoding="utf-8")
          old = """    return (
        basis +
            listOf(ZahlenRechnerKnotenVorlagen.standard) +
            FaltungsKnotenVorlagen.alle +
            MatrixdiagonaleKnotenVorlagen.alle +
            LineareAlgebraGrundlagenKnotenVorlagen.alle
        )
        .distinctBy(::vorlagenSchlüssel)"""
          new = """    val strukturRechner = StrukturFormelRechnerVorlagen.alle
    val strukturArten = strukturRechner.mapTo(mutableSetOf()) { it.art }
    val katalog = basis +
        listOf(ZahlenRechnerKnotenVorlagen.standard) +
        FaltungsKnotenVorlagen.alle +
        MatrixdiagonaleKnotenVorlagen.alle +
        LineareAlgebraGrundlagenKnotenVorlagen.alle
    return (katalog.filterNot { it.art in strukturArten } + strukturRechner)
        .distinctBy(::vorlagenSchlüssel)"""
          if old not in text:
              raise SystemExit("Expected calculator catalog fragment was not found.")
          katalog.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm .github/workflows/samai-v2.25.0-kompatibilitaet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bewahre Rechnerverträge und eindeutigen Katalog"
          git push origin HEAD:samai/v2.25.0-strukturformelrechner
