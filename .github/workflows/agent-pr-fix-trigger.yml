name: Auswerten-Patch beim Pull Request

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patchen:
    if: ${{ !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auswerten-standardwerte
          fetch-depth: 0

      - name: Hinterlegten Patch ausführen
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/agent-fix-auswerten-standardwerte.yml').read_text(encoding='utf-8')
          marker_start = '      - name: Verantwortungen trennen und Regressionstests ergänzen\n        shell: python\n        run: |\n'
          marker_end = '\n      - name: Patch committen\n'
          if workflow.count(marker_start) != 1 or workflow.count(marker_end) != 1:
              raise SystemExit('Patchskript konnte nicht eindeutig aus dem Workflow gelesen werden.')
          roh = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          skript = '\n'.join(zeile[10:] if zeile.startswith('          ') else zeile for zeile in roh.splitlines())
          exec(compile(skript, '<auswerten-patch>', 'exec'))

          Path('.github/workflows/agent-pr-fix-trigger.yml').unlink()
          trigger = Path('.github/auswerten-standardwerte-trigger')
          if trigger.exists():
              trigger.unlink()

      - name: Patch committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auswerten auf Zahlterme begrenzen und Standardwert-LaTeX reparieren [auswerten-standardwerte-patched]"
          git push origin HEAD:agent/auswerten-standardwerte
