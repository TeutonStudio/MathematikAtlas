    <!--
        Atlas-Integral, Konturvariante 2.

        Korrektur gegenüber Variante 1:
        - obere Hälfte bleibt weit und weich geöffnet,
        - der Mittelstamm läuft schräg nach rechts unten,
        - erst kurz vor dem unteren Ende entsteht ein kleiner Gegenschwung,
        - der Abschluss läuft anschließend nach links unten aus.

        Dadurch liest sich die Gesamtkontur als gestrecktes, asymmetrisches S
        statt als von links nach rechts wandernde Kurve.
    -->
