  { version = "2.25.1", title = "Formel-Definitionskarten und dauerhafte Variableneingänge", roadmap = "v2.25.x Strukturrechner, CAS und dynamische Definitionskarten", status = "released", previous_release = "2.25.0", branch = "release/v2.25.1-formeleingaenge", kind = "fix", version_axis = "x", reason = "Korrigiert die Lebensdauer automatisch aus freien Formelvariablen erzeugter Eingänge, vervollständigt Formel-Definitionskarten, Formeltastatur und Inspektorverhalten und führt keinen neuen registrierten Knotentyp ein." },
  { version = "2.25.2", title = "Generische Termauswertung und Relationsauflösung", roadmap = "v2.25.x Strukturrechner, CAS und dynamische Definitionskarten", status = "released", previous_release = "2.25.1", branch = "release/v2.25.2-auswerten-aufloesen", kind = "fix", version_axis = "x", reason = "Korrigiert die vorhandenen Knoten Auswerten und Gleichung lösen: Auswerten vereinfacht mathematische Objekte typ-erhaltend, Auflösen bestimmt oder definiert Lösungsmengen von Relationen und Standardwerte behalten eine gültige LaTeX-Pfaddarstellung. Es wird kein neuer registrierter Knotentyp eingeführt." },
  { version = "2.25.3", title = "Enzyklopädie- und Konzeptschicht", roadmap = "v2.25.x Wissensmodell, Konzeptbibliothek und Definitionskarten", status = "released", previous_release = "2.25.2", branch = "release/v2.25.3-enzyklopaedie-konzeptschicht", kind = "feature", version_axis = "x", reason = "Konsolidiert Wissenseinträge, Rechnerfamilien, Konzeptknoten, statische JSON-Konzeptkarten und Debug-Previews im Modul MathematikKnoten, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.25.4", title = "Konzeptbibliothek auf erster Hierarchieebene filtern", roadmap = "v2.25.x Wissensmodell, Konzeptbibliothek und Bedienoberfläche", status = "released", previous_release = "2.25.3", branch = "samai/v2.25.4-konzeptbibliothek-filter-ebene-1", kind = "fix", version_axis = "x", reason = "Ergänzt Wortsuche und Anschlussfilter bereits auf der Fachgebietsebene, aggregiert Treffer über die Unterstruktur und erhält den Filterzustand über alle drei Hierarchieebenen, ohne einen neuen registrierten Knotentyp einzuführen." },
  { version = "2.25.5", title = "Live-Synchronisation im CAS-Formelbauer", roadmap = "v2.25.x Strukturrechner, CAS und Bedienoberfläche", status = "released", previous_release = "2.25.4", branch = "release/v2.25.5-formelbauer-live-latex", kind = "fix", version_axis = "x", reason = "Synchronisiert gültige LaTeX-Eingaben unmittelbar mit dem strukturierten Formeleditor, erhält bei ungültigen Zwischenständen die letzte gültige Struktur und entfernt den zusätzlichen Import-Schritt, ohne einen neuen registrierten Knotentyp einzuführen." },
  { version = "2.26.0", title = "Mathematische Eigenschaftsknoten und Inspector", roadmap = "v2.26.x Mathematische Eigenschaften und Bedienoberfläche", status = "released", previous_release = "2.25.5", kind = "feature", version_axis = "y", new_node_types = ["mathematik.methodenEigenschaft", "mathematik.analysisEigenschaft", "mathematik.folgenEigenschaft", "mathematik.methodenStelligkeit", "mathematik.mengenEigenschaft"], reason = "Veröffentlicht die konsolidierten mathematischen Eigenschaftsknoten, Statusdiagnostik sowie die zugehörige Inspector- und Auswertungslogik." },
  { version = "2.26.1", title = "Integral-, Differential- und Notiz-Erweiterungen", roadmap = "v2.26.x Analysis und Kartenwerkzeuge", status = "released", previous_release = "2.26.0", kind = "feature", version_axis = "x", reason = "Historisch als Änderungs-Version veröffentlicht; integriert den Integralpfad, erweitert Differential- und Zahlbereichslogik und ergänzt Kartenwerkzeuge. Die bereits veröffentlichte Versionsnummer wird gemäß Release-Regel nicht nachträglich umnummeriert." },
  { version = "2.27.0", title = "Restriktionsknoten und Methodenerweiterung", roadmap = "v2.27.x Methoden, Restriktion und Standardkarten", status = "released", previous_release = "2.26.1", kind = "feature", version_axis = "y", new_node_types = ["mathematik.restriktion"], reason = "Führt den separat erzeugbaren Restriktionsknoten ein und ergänzt die Methodenerweiterung über dynamische Ergänzungseingänge." },
  { version = "2.27.1", title = "Mitgelieferte Standardkarten für Analysis", roadmap = "v2.27.x Methoden, Restriktion und Standardkarten", status = "released", previous_release = "2.27.0", kind = "feature", version_axis = "x", reason = "Bündelt versionierte Standardkarten für Funktionen sowie Analysis 1 und 2, installiert sie beim App-Start und ergänzt Paket- und Konsistenzprüfungen ohne neuen Knotentyp." },
  { version = "2.27.2", title = "Gradle- und Android-Buildwerkzeug aktualisieren", roadmap = "v2.27.x Build und Projektstabilisierung", status = "released", previous_release = "2.27.1", kind = "maintenance", version_axis = "x", reason = "Aktualisiert Android Gradle Plugin und Gradle-Wrapper sowie die zugehörigen Build-Kompatibilitätseinstellungen ohne fachliche Knotentypänderung." },
  { version = "2.27.3", title = "Standardkarten-Seeding in installierter APK reparieren", roadmap = "v2.27.x Standardkarten und Projektstabilisierung", status = "released", previous_release = "2.27.2", branch = "samai/v2.27.3-standardkarten-seeding", kind = "fix", version_axis = "x", reason = "Trennt den sichtbaren Knoten-Erstellen-Katalog vom lade-kompatiblen Standardkarten-Katalog, sodass historische, migrationsfähige Knotentypen das mitgelieferte Standardkartenpaket nicht mehr vollständig ausfiltern. Ergänzt Regressionstests und führt keinen neuen Knotentyp ein." },
  { version = "2.28.0", title = "Graph einer Methode als symbolische Menge", roadmap = "v2.28.x Methoden, Funktionsgraphen und Mengenkonstruktionen", status = "released", previous_release = "2.27.3", branch = "agent/v2.28.0-methodengraph", kind = "feature", version_axis = "y", new_node_types = ["mathematik.methodenGraph"], reason = "Führt den separat erzeugbaren Graph-Knoten ein und modelliert Graph(f) zentral als symbolische Menge im Produktraum des aktuellen Argument- und Zielraums einer Methode." },
  { version = "2.28.1", title = "Zentraler Koordinatenadapter und Darstellbarkeitsdiagnosen", roadmap = "v2.28.x Visualisierung und Koordinatenverträge", status = "released", previous_release = "2.28.0", branch = "release/v2.28.1-koordinatenadapter", kind = "feature", version_axis = "x", reason = "Vereinheitlicht die reelle Koordinatenextraktion für Tupel, Vektoren, Methoden und Koordinatenbilder, erhält bedingte und projektionsbedürftige Zustände bis zur sichtbaren Visualisierungsdiagnose und führt keinen neuen registrierten Knotentyp ein." },
  { version = "2.28.2", title = "Zahlenfunktionsvertrag und gemeinsame Methodendarstellung", roadmap = "v2.28.x Zahlenrechner, Methoden und Analysis", status = "released", previous_release = "2.28.1", branch = "samai/v2.28.2/zahlenrechner-konsolidierung", kind = "feature", version_axis = "x", reason = "Ergänzt eine signaturbasierte Zahlenfunktionsanforderung für endlichstellige Methoden, vereinheitlicht die cases-Darstellung von Methoden und rendert die erste totale Ableitungsfunktion als f' mit Termzeile, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.28.3", title = "Punktweise Zahlenfunktionen im Zahlenrechner", roadmap = "v2.28.x Zahlenrechner, Methoden und Analysis", status = "released", previous_release = "2.28.2", branch = "samai/v2.28.3/zahlenfunktionen-punktweise", kind = "feature", version_axis = "x", reason = "Erweitert den vorhandenen Zahlenrechner um kontrollierte Zahlenfunktionseingänge, punktweise Operatorhebung, dynamische Ergebnisart und strukturierte Definitionsbedingungen, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.28.4", title = "Polynomkonstruktion im Zahlenrechner", roadmap = "v2.28.x Zahlenrechner, Methoden und Analysis", status = "released", previous_release = "2.28.3", branch = "agent/v2.28.4-zahlenrechner-polynom", kind = "feature", version_axis = "x", reason = "Konsolidiert die vorhandene Polynomkonstruktion als Zustand des Zahlenrechners, verwendet Koeffiziententupel und einen separaten Argumenteingang, liefert direkt einen Zahlterm und hält historische Vektor-zu-Polynom-Karten ladefähig, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.28.5", title = "Ableitungsfunktion und Differential im Zahlenrechner", roadmap = "v2.28.x Zahlenrechner, Methoden und Analysis", status = "released", previous_release = "2.28.4", branch = "samai/v2.28.5/zahlenrechner-differential", kind = "feature", version_axis = "x", reason = "Integriert Ableitungsfunktion, Differential sowie totale und partielle Differentialzustände in den bestehenden Zahlenrechner, erhält historische skalare Differentialzustände und führt keinen neuen registrierten und separat erzeugbaren Knotentyp ein." },
  { version = "2.28.6", title = "Bildmenge und skalierbarer JSON-Editor", roadmap = "v2.28.x Bedienoberfläche und JSON-Editor", status = "released", previous_release = "2.28.5", branch = "samai/v2.28.6/schnelle-issues", kind = "fix", version_axis = "x", reason = "Vereinheitlicht die sichtbare Bildmengenbezeichnung und ergänzt den JSON-Editor um eine viewportbezogene Zeilennummerierung sowie größenabhängige Analysemodi, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.28.7", title = "Tupelkonstruktion aus Dimension und Indexmethode", roadmap = "v2.28.x Methoden und Mengenkonstruktionen", status = "released", previous_release = "2.28.6", branch = "samai/v2.28.7-tupel-indexmethode", kind = "feature", version_axis = "x", reason = "Erweitert den vorhandenen Tupel-Knoten um eine zweite Erzeugungsart aus einer konkreten positiven Dimension und einer einstelligen, einsbasiert ausgewerteten Methode, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.28.8", title = "Geräteübergreifende Eingaben und Linux-Desktopziel", roadmap = "v2.28.x Bedienoberfläche und Plattformen", status = "released", previous_release = "2.28.7", branch = "release/v2.28.8-linux-desktop", kind = "feature", version_axis = "x", reason = "Vereinheitlicht Konzeptbibliotheksgesten und Kartenbefehle, ergänzt den vollständigen PC-Eingabevertrag und veröffentlicht ein Compose-Multiplatform-Desktopziel für Linux, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.29.0", title = "Tupeloperationen, Operatorauswahl und Atlas-Integral", roadmap = "v2.29.x Tupeloperationen und Bedienoberfläche", status = "released", previous_release = "2.28.8", branch = "release/v2.29.0-tupel-operator-integral", kind = "feature", version_axis = "y", new_node_types = ["mathematik.tupelErgänzen", "mathematik.tupelAuflösen"], reason = "Führt mit Tupel ergänzen und Tupel auflösen zwei neue separat erzeugbare Knotentypen mit geordneten, dynamischen Anschlussverträgen ein und bündelt den größeren Rechner-Operatorauswahldialog sowie das Atlas-Integralzeichen v4." },
  { version = "2.29.1", title = "Hierarchische Einstellungen und Kartenverwaltung", roadmap = "v2.29.x Bedienoberfläche und Kartenverwaltung", status = "released", previous_release = "2.29.0", branch = "release/v2.29.1-einstellungen-kartenverwaltung", kind = "feature", version_axis = "x", reason = "Hierarchisiert die bestehenden Einstellungen, ergänzt die kontrollierte Neuerzeugung von Beispielkarten und macht Kartenordner einklappbar, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.29.2", title = "Zahnrad-Symbol für den Knoteninspektor", roadmap = "v2.29.x Bedienoberfläche und Knoteninspektor", status = "released", previous_release = "2.29.1", kind = "fix", version_axis = "x", reason = "Ersetzt die provisorische i-Beschriftung des Knoteninspektors durch ein kontrastadaptives Zahnrad-Symbol, ohne Knotengeometrie oder mathematische Knotentypen zu verändern." },
  { version = "2.29.3", title = "Knoten-Auswertungszeiten und gezielte Cache-Neuberechnung", roadmap = "v2.29.x Auswertungsdiagnose und Bedienoberfläche", status = "released", previous_release = "2.29.2", branch = "agent/v2.29.3-knoten-auswertungsdiagnose", kind = "feature", version_axis = "x", reason = "Ergänzt bestehende Knoten um nichtpersistierte Auswertungszeiten in einer Fußzeile und eine gezielte Cache-Neuberechnung im Inspector, ohne einen neuen registrierten und separat erzeugbaren Knotentyp einzuführen." },
  { version = "2.30.0", title = "Methodensignatur und Argumentprojektion", roadmap = "v2.30.x Methoden, Signaturen und Argumentprojektion", status = "released", previous_release = "2.29.3", branch = "samai/v2.30.0-methoden-signaturprojektion", kind = "feature", version_axis = "y", new_node_types = ["mathematik.methodenWertevorrat", "mathematik.methodenArgumentanzahl"], reason = "Führt getrennte Abfrageknoten für den kanonischen Methoden-Wertevorrat und die logische Argumentanzahl ein, härtet die Zielmengenabfrage und ergänzt eine persistierte Ausgabeprojektion zwischen separierten Argumenten und explizitem Argumenttupel einschließlich Einertupeln." },
  { version = "2.31.0", title = "Rechnernotation, 0-Distanz und Multinomvektor", roadmap = "v2.31.x Rechner, Polynome und Vektorkonsolidierung", status = "released", previous_release = "2.30.0", branch = "agent/v2.31.0-rechner-multinomvektor", kind = "feature", version_axis = "y", new_node_types = ["mathematik.multinomVektor"], reason = "Führt den separat erzeugbaren Multinomvektor ein, vereinheitlicht Polynom- und Monomsemantik, konsolidiert 0-Distanz sowie reine Zeilen-/Spaltenknoten und korrigiert vollständige Rechneroperatorvorschauen." },
  { version = "2.32.0", title = "Nativer LaTeX-Renderer und Methodenargument-Reflexion", roadmap = "v2.32.x Methoden, LaTeX und Definitionskarten", status = "released", previous_release = "2.31.0", branch = "agent/v2.32.0-latex-methoden-korrekturen", kind = "feature", version_axis = "y", new_node_types = ["mathematik.methodenArgumente"], reason = "Führt mit mathematik.methodenArgumente einen neuen separat erzeugbaren Reflexionsknoten ein, behandelt unbekannte Methodensignaturen ohne erfundene Stelligkeit und ersetzt die visuellen LaTeX-Sonderparser für Brüche, Matrizen, cases und große Operatoren durch einen nativen Compose-Multiplatform-Renderer." },
  { version = "2.32.1", title = "Kanonischer Knotenkatalog und Architekturrefactor", roadmap = "v2.32.x Architektur und Plattformkonsolidierung", status = "released", previous_release = "2.32.0", branch = "release/v2.32.1-architektur-refactor", kind = "refactor", version_axis = "x", reason = "Zentralisiert den sichtbaren Mathematikknoten-Katalog für Android und Desktop, gliedert Auswerterregistrierungen in explizite Phasen, sortiert globale Knotenadapter fachlich ein und dokumentiert die verbleibende Desktop-Shadowmodul-Schuld ohne neuen registrierten Knotentyp." },
  { version = "2.32.2", title = "Methodenfundament, methodenfähige Rechner und Axiomprädikate", roadmap = "v2.32.x Methoden, Rechner und Axiome", status = "released", previous_release = "2.32.1", branch = "release/v2.32.2-integration", kind = "feature", version_axis = "x", reason = "Integriert präzisierte Mengenrelationsbezeichnungen, ein erweiterbares Methodenfundament, methoden- und prädikatfähige Rechner sowie parametrisierte Axiome in bestehende Knotentypen und führt keinen neuen registrierten und separat erzeugbaren Knotentyp ein." },
  { version = "2.33.0", title = "SVG-Grafikknoten und Operatorendialog", roadmap = "v2.33.x SVG-Grafiken und Grafikverarbeitung", status = "released", previous_release = "2.32.2", branch = "release/v2.33.0-svg-grafikknoten", kind = "feature", version_axis = "y", new_node_types = ["grafik.svg.knoten", "grafik.svg.stil"], reason = "Führt einen separat erzeugbaren SVG-Grafikknoten mit strukturiertem SVG-AST und Operatorendialog sowie einen wiederverwendbaren SVG-Stil-Knoten ein; SVG-Grundformen, Pfade, Text, Gruppierung und Kombination werden typisiert ausgewertet." },
  { version = "2.33.1", title = "Agentensystem und dokumentierte Pfadverträge", roadmap = "v2.33.x Agenten- und Releaseverträge", status = "released", previous_release = "2.33.0", branch = "release/v2.33.1-agent-system-pfadvertraege", kind = "governance", version_axis = "x", reason = "Schließt PR #439 mit dokumentierten Modulpfaden, README-Lokalisierungswerkzeugen und synchronisierten Release-Metadaten ab. Übernimmt den vorhandenen master-Stand ohne Umschreiben historischer Versionscommits und ohne neuen registrierten Knotentyp." },
  { version = "2.34.0", title = "Beweisbewusste Mengenvisualisierung und allgemeine Orbitmengen", roadmap = "v2.34.x Mengen, Zahlen und Iterationsmengen", status = "released", previous_release = "2.33.1", branch = "release/v2.34.0-mengenvisualisierung-orbits", kind = "feature", version_axis = "y", new_node_types = ["mathematik.orbit", "mathematik.orbitBeschraenktheit"], reason = "Führt separat erzeugbare Orbit- und Orbitbeschränktheitsknoten ein; ergänzt nachvollziehbare exakte und numerische Mengenvisualisierung einschließlich unbekannter Bereiche, komplexer Koordinaten und einer regulären Mandelbrot-Beispielkarte. Basis ist der finale v2.33.1-Commit 21ce83fec32438087ae2fa8bd08f17766f0a20ce." },
  { version = "3.0.0", title = "V3 Alpha – Abstraktion, Visualisierung und Kartenstabilität", roadmap = "v3.0.x Alpha und Beta", status = "released", previous_release = "2.34.0", branch = "samai/v3.0.0-releaseabschluss", kind = "feature", version_axis = "M", reason = "Eröffnet den vom Nutzer beschlossenen v3-Versionsraum mit Strukturformen, stabiler Kartenwiederherstellung, performanterer Graphinteraktion, adaptiver Visualisierung, einheitlicher UI-Geometrie, semantischer Teilgraphabstraktion sowie gehärteten Import- und Speicherpfaden. Der vollständige Diff führt keinen neuen separat erzeugbaren Knotentyp ein; die Major-Achse folgt der ausdrücklichen v3-Roadmapentscheidung." },
  { version = "3.0.1", title = "V3 Alpha konsolidieren: Werteverträge, Operatoren und sichere Kartenverwaltung", roadmap = "v3.0.x Alpha und Beta", status = "released", previous_release = "3.0.0", branch = "release/v3.0.1-alpha-erweiterungen", kind = "feature", version_axis = "x", reason = "Konsolidiert AtlasWert und Tupelmethoden, effektive Anschlussverträge, die kanonische Operatorinfrastruktur, Gleichheit und Selbigkeit sowie Standardwerte, Adaptergeometrie, Kartenherkunft, sichere Importe und Visualisierung bestehender Knoten. Der vollständige Erstellenkatalog enthält dieselben 136 Typen wie v3.0.0; es entsteht kein neuer registrierter und separat erzeugbarer Knotentyp. Vorgänger ist der finale v3.0.0-Commit df4f25dc6c41a31cb77c7627ef9897b827a056bb; die Integrationsbasis enthält GitHub-master 6ac2b2b45cfb64f92c3db4fc4d8aee592dd2faa3." },
  { version = "3.1.0", title = "V3 Alpha: Übersetzer, Tupel-abflachen und gemeinsame Formelwerkzeuge", roadmap = "v3.1.x Alpha-Abschluss", status = "released", previous_release = "3.0.1", branch = "release/v3.1.0-alpha-erweiterungen", kind = "feature", version_axis = "y", new_node_types = ["atlas.uebersetzer", "mathematik.tupelAbflachen"], reason = "Schließt den ausdrücklich beauftragten Alpha-Umfang mit genau zwei neuen registrierten und separat erzeugbaren Knotentypen ab: atlas.uebersetzer und mathematik.tupelAbflachen. Der vollständige Erstellenkatalog enthält 138 statt bisher 136 Typen. Zum selben Release gehören die Erweiterung des bestehenden Matrixprodukts auf geordnete variadische Faktoren mit zusammenhängendem Falk-Schema sowie die gemeinsame Formel- und persistente Stifteditorbasis. Umkehrmethoden aus PR #436 und automatische Handschrift-/Fotoerkennung bleiben ausgeschlossen. Exakte Basis ist der finale, vollständig CI-geprüfte v3.0.1-Commit 2842a03e18797d9689ebaf5fc3e389e1bb60ffc9." },
  { version = "3.1.1", title = "Rechnerkonsolidierung, Prädikate, Gruppen und einheitliche Dialoge", roadmap = "v3.1.x Alpha-Abschluss und Bedienung", status = "released", previous_release = "3.1.0", branch = "samai/v3.1.1/rechneroperatoren-konsolidierung", kind = "feature", version_axis = "x", reason = "Konsolidiert bestehende Rechner einschließlich Migration historischer Operationen, ergänzt Mengenoperatorgrundlage und Prädikatsauswertung, visuelle Gruppenprojektion mit JSON-Format 9 und gemeinsame Dialoge. Der Erstellenkatalog enthält 128 statt 138 Typen; zehn redundante Typen werden migriert, kein neuer registrierter und separat erzeugbarer Knotentyp entsteht. Vorgänger ist der finale v3.1.0-Commit 811955f8; bestätigte Integrationsbasis ist origin/master e8f1c9d6." },
  { version = "3.2.0", title = "Winkelräume, Indexdefinitionen und Kartenabschluss", roadmap = "v3.2.x Winkelräume und Strukturdefinitionen", status = "released", previous_release = "3.1.1", branch = "release/v3.2.0-winkelraum-abschluss", kind = "feature", version_axis = "y", new_node_types = ["mathematik.halbesIntervall", "mathematik.richtungWinkel"], reason = "Abschluss des TODO-Umfangs mit Indexmethoden und ausführbaren Strukturdefinitionen, Vektorpotenz und Unterräumen, Inhaltsminima und Gruppenauswahl, Falk-Schema sowie Winkelraum- und Polarkoordinatenpipeline. Bewahrt die bereits auf master erzeugbaren Typen mathematik.halbesIntervall und mathematik.richtungWinkel; deshalb insgesamt Knoten-Version y. Vorzeichen und Halbkreiswinkel sind der Polarstandard; klassische Polarkarten erhalten explizite Migration und höhere Bilddimensionen eine 2D-/3D-Projektion. Ersetzt die nie auf master veröffentlichte branchlokale TODO-Reservierung 3.1.2 aus 22b566451f77cd3516ab3fa952a9f88384d76b8c. Die alte branchlokale 3.2.0-Komplexreservierung auf samai/v3.2.0/komplex-uebersetzungen (51595dc09207eab4cb4873f2a3eb4bf17fd57263) wird zurückgestellt; deren zusätzlicher Typ mathematik.matrixAlsKomplexDarstellbar gehört nicht zu diesem Release. Veröffentlichter Vorgänger und Katalogbasis sind v3.1.1 ff020f06c5f6aad7e17cef0292cce0b16384917b; Integrationsbasis ist master 7e11b7113e5098921e59b7c98d7ed62369de3fb8. Releaseabschluss; Veröffentlichung erfolgt ausschließlich über den geprüften Squash nach master." },

  { version = "3.2.1", title = "Formel-, Methoden- und Tupelverträge mit Richtungsbildmengen", roadmap = "v3.2.x Winkelräume und Strukturdefinitionen", status = "released", previous_release = "3.2.0", branch = "samai/v3.2.1-variable-grundraum-tupel-ordnung", kind = "feature", version_axis = "x", reason = "Erweitert bestehende Formel-, Methoden- und Tupelverträge um ausgewählte strukturierte Argumente und Ergebnistupel, methodenwertige Aufrufe, aktuelle-only Mathematik-/Wertpaketpersistenz, Übersetzungszeugnisse und offene Voraussetzungen. Ergänzt den bestehenden Variablenknoten um den Mengeneingang für Grundraum, den bestehenden Tupelknoten um geordnete Standardwerte und Sortierung sowie bestehende Richtungsraum-/Bildmengenpfade um konsistente Dimensionen, ausführbare endliche Definitionsgruppen und strukturierte Argumentdomänen. Die 77-Punkte-Matrix und die vollständige Migration aller Legacy-Aufrufer bleiben Folgearbeit. Der Umfang erweitert vorhandene Knotentypen und registriert keinen neuen separat erzeugbaren Knotentyp; daher Änderungs-Version x. Exakte veröffentlichte Basis: v3.2.0 dc072189446fb387af3b9ff04936e0bf12a4d7f7." },
  { version = "3.2.2", title = "Automatische Übersetzerketten, Verbindungsbearbeitung und Vollbild", roadmap = "v3.2.x Graphbedienung und Laufzeit", status = "released", previous_release = "3.2.1", branch = "samai/v3.2.2-verbindungen-vollbild", kind = "feature", version_axis = "x", reason = "Optimiert die vorhandene Graphauswertung mit Topologiecache, indizierten Zugriffen und kollisionssicherer Ergebnisidentität; ergänzt kürzeste Ketten bestehender Übersetzer mit Auswahl, atomare Drag-Einfügung und bewusstes Herausziehen sowie immersives Android-Vollbild. Keine neuen registrierten Knotentypen und kein neues Datenformat. Basis ist der finale v3.2.1-Commit e535190058014810617ea2989d27838afe54692b." },
  { version = "3.3.0", title = "Geometry Nodes, Geometriebedienung und lokale Knotennutzung", roadmap = "v3.3.x Prozedurale Geometrie", status = "released", previous_release = "3.2.2", branch = "samai/v3.3.0-geometry-nodes", kind = "feature", version_axis = "y", new_node_types = ["mathematik.geometryNodes.meshCube", "mathematik.geometryNodes.meshGrid", "mathematik.geometryNodes.points", "mathematik.geometryNodes.meshToPoints", "mathematik.geometryNodes.joinGeometry", "mathematik.geometryNodes.transformGeometry", "mathematik.geometryNodes.position", "mathematik.geometryNodes.index", "mathematik.geometryNodes.scalarMath", "mathematik.geometryNodes.vectorMath", "mathematik.geometryNodes.compare", "mathematik.geometryNodes.setPosition", "mathematik.geometryNodes.instanceOnPoints", "mathematik.geometryNodes.realizeInstances", "mathematik.geometryNodes.preview"], reason = "Führt die bestätigte Geometry-Nodes-Familie für Meshes, Punktwolken, Instanzen und kontextabhängige Felder mit exakt 15 neuen separat erzeugbaren Knotentypen ein; ergänzt Geometriebedienung nach der Desmos-/GeoGebra-Analyse sowie lokale, rücksetzbare Android-Knotennutzungsstatistik. Die 15 neuen Typ-Schlüssel stimmen exakt mit dem Katalogdiff überein; deshalb Knoten-Version y. Kurven gehören nicht zum bestätigten Umfang. Basis ist der finale v3.2.2-Commit d435b4fcf62ce83409911f98c08f0a096e78c0dd. Der Status released beschreibt den geprüften PR-Zielbaum; veröffentlicht erst durch finalen Squashcommit auf master und grüne Releaseprüfungen." },
  { version = "3.3.1", title = "Lokale Mengen-, Tupel- und Bibliotheksänderungen abgleichen", roadmap = "v3.3.x Prozedurale Geometrie und bestehende Knotenverträge", status = "released", previous_release = "3.3.0", branch = "samai/v3.3.1/lokale-aenderungen-abgleichen", kind = "fix", version_axis = "x", reason = "Integriert ausschließlich die auf GitHub noch fehlenden lokalen Erweiterungen vorhandener Mengen-, Tupel-, Aussagen- und Bibliothekspfade sowie zugehörige Agentenanweisungen. Kein neuer separat erzeugbarer und registrierter Knotentyp; daher Änderungs-Version x. Der überholte lokale Geometry-Nodes-Prototyp bleibt gesichert und wird wegen der bereits veröffentlichten gleichnamigen Knotenfamilie nicht parallel registriert. Exakte veröffentlichte Basis ist v3.3.0 a789e606d0c0148bff954d87404fcfef82ada77e. Der Status released beschreibt den PR-Zielbaum; Veröffentlichung erst mit geprüftem finalem Squashcommit auf master." },
  { version = "3.4.0", title = "Methodenquelle, Join-Eingänge und Graphbedienung", roadmap = "v3.4.x Methoden und wiederverwendbare Karten", status = "released", previous_release = "3.3.1", branch = "release/v3.4.0-methoden-grundraeume-visualisierung", kind = "feature", version_axis = "y", new_node_types = ["mathematik.methode"], reason = "Führt mit mathematik.methode einen neuen registrierten und separat erzeugbaren Methodenknoten analog zur Mengenquelle ein. Der Knoten stellt Knoten und versionsfeste Karten als Methoden sowie die Identität mit optionalem Mengeneingang bereit. Nicht verbundene optionale Methodeneingänge verwenden die Identität. Der gesamte Release umfasst außerdem die Grundraumverträge und Migration vorhandener Variablen, die überarbeitete Mengenvisualisierung mit Ansichts- und Samplingsteuerung, geometrische Anschlusskorrekturen sowie Join-Mehrfacheingänge mit Format-10-Migration, Anschlussinformationen, Anschluss-Pie, Einfügelayout, Inspectorbereiche und globale Meldungsebenen auf Android und Desktop einschließlich Regressionstests. Die Prädikatindex-Planung ist Vorbereitung und kein implementiertes Releasefeature. Knoten-Version y; exakte veröffentlichte Basis ist v3.3.1 c4b23c69c431370b600cd4bd810c8d5135c43ff7. Der Status released beschreibt den PR-Zielbaum; Veröffentlichung erst mit geprüftem finalem Squashcommit auf master." },
  { version = "3.4.1", title = "Projektskills für kanonische Knoten und verlustfreie Verträge", roadmap = "v3.4.x Methoden und wiederverwendbare Karten", status = "released", previous_release = "3.4.0", branch = "samai/v3.4.1-projektskills-vertraege", kind = "governance", version_axis = "x", reason = "Präzisiert die vorhandenen Knoten-, Inspector-, Dialog- und Releaseskills zu kanonischer Erzeugung, bevorzugten Rechner-/Übersetzer-/Prädikat-/Methodenpfaden, Legacy-Migrationsnachweisen, stabilen Identitäten, verlustfreien Verträgen und Test-/CI-Gates. Keine Produktbereinigung, neuen Knotentypen, Schemaänderungen oder Freigabe des offenen Gesamtvertrags. Änderungs-Version x; exakte veröffentlichte Basis v3.4.0 d37d479f8f51a1d153f962eeca77838262b88a09. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch geprüften finalen Squashcommit auf master." },
