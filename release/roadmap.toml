releases = [
  { version = "3.4.11", title = "Kanonische Repositorykarten und bereinigte historische Auswerter", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M7b", status = "released", previous_release = "3.4.10", branch = "samai/v3.4.11/konsolidierung-m7b", kind = "refactor", version_axis = "x", reason = "Separates M7b-Änderungsrelease nach vollständig abgenommenem M7a: bereinigt unabhängige historische Auswerter erst nach nachgewiesener Verbrauchermigration und kanonisiert die Repositorykarten auf vorhandene registrierte Konstruktoren. Historische Ladbarkeit, eindeutige Kartenmigrationen, Originalschutz, diagnostische Sperren, Identitäten, Portverträge, Standardwerte und Kartenfallbacks müssen erhalten und über alle betroffenen Verbraucher geprüft bleiben; kein Mathematikfallback für gesperrte Knoten. Der bestehende Polynomoperator erhält den notwendigen Argumentmodus für die strikte historische vektorZuPolynom-Konsolidierung, ohne neuen Operator oder Knotentyp; die Kernüberladung mit Variable validiert und delegiert statt einer zweiten Formelimplementierung. Fehlende historische Zeilenkonstruktor-Ladeumsetzungen werden vor Aliasentfernung ergänzt. Gültige vorhandene Operator-IDs werden über die gesamte kanonische Registry statt nur ein Enum erkannt. Zum finalen Vertragsumfang gehören der getrennte Nullersatz-Divisionsvertrag einschließlich Methoden, erhaltene Anzeigealiase und die Unterbindung automatischer Join-Zusammenfälle beim Laden; ursprüngliche Anschluss- und Verbindungsidentitäten bleiben erhalten. Der Gesamtabschluss M0–M7 benötigt vollständige Verbraucher-, Fixture-, Plattform- und Vertragsnachweise, keine bloße Katalogzahl. Keine neuen registrierten separat erzeugbaren Knotentypen oder Entfernung aus dem kanonischen Katalog, keine Produktionsabhängigkeiten; weiterhin 121 gemeinsame und 123 vollständige Android-Arten. Änderungs-Version x. Exakte veröffentlichte Basis v3.4.10 f2d06d3087a0f27bbe58fad81187e8c6ac0c3501. Sämtliche finalen master-Workflows einschließlich isolierter Android-Laufzeit und Linux-RPM/Neustartpersistenz vor Reservierung vollständig grün bestätigt (Android 39011501316, Linux 39011501582, Kern/Android-Laufzeit 39011501513, Release-Guard 39011501311). Keine Folgeversion reserviert. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.11 auf master und grüne Releaseprüfungen." },
  { version = "3.4.10", title = "Migrationsschutz und historische Rollen", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M7a", status = "released", previous_release = "3.4.9", branch = "samai/v3.4.10/konsolidierung-m7", kind = "fix", version_axis = "x", reason = "Enges M7a-Voraussetzungsrelease des genehmigten sequenziellen M0–M7-Plans: korrigiert nachgewiesene ältere Migrationsfehler im beauftragten Datenvertrag: Originalschutz und Erhalt von Sperrdiagnosen, benannte Portrollen ohne Anschluss-/Verbindungsverlust, korrekte Standardwerte, Logarithmusbasis-/Argumentzuordnung und die historisch einstellige Quadratwurzel. Kanonische Beispiel- und Indexbuilder verwenden die passenden vorhandenen Konstruktoren und Rollen; kein Knotentyp wird neu registriert oder aus dem kanonischen Katalog entfernt. Originalkonfigurationen, Verbindungen, Identitäten und diagnostische Sperren müssen erhalten bleiben; mathematisch ungültige historische Zustände werden ausdrücklich diagnostiziert. Als notwendige CI-Korrektur wird der vollständige Zeichen-Fertigstatus über Sampling und alle aktuellen Zeichenpakete geführt; der Desktop-Bildtest wartet auf diese explizite Barriere bei unverändert striktem Bildvergleich, ohne Sleep, Toleranz oder Retry. Die asynchrone Code-Race ist nachgewiesen; mangels archivierter Screenshots ist ihre konkrete Auslösung des ursprünglichen CI-Fehlers nicht bewiesen. Noch keine Entfernung alter Auswerter und keine allgemeine Kartenkanonisierung. M7b-Bereinigung und Kartenkanonisierung folgen als separat vollständig abgenommenes Änderungsrelease erst nach finalem v3.4.10-Master und vier grünen Master-Workflows; keine Folgeversion reserviert. Keine neuen registrierten separat erzeugbaren Knotentypen oder Entfernung aus dem kanonischen Katalog, keine Produktionsabhängigkeiten; weiterhin 121 gemeinsame und 123 vollständige Android-Arten. Änderungs-Version x. Exakte veröffentlichte Basis v3.4.9 49945974dbe96778b70341f29a32bd96747d18d8, alle finalen master-Workflows vor Reservierung grün bestätigt (Android 39006842925, Linux 39006843006, Kern/Android-Laufzeit 39006842966, Release-Guard 39006843009). Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.10 auf master und grüne Releaseprüfungen." },
  { version = "3.4.9", title = "Präzise Begriffe und Verträge vorhandener Darstellungs- und Raumknoten", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M6", status = "released", previous_release = "3.4.8", branch = "samai/v3.4.9/konsolidierung-m6", kind = "refactor", version_axis = "x", reason = "M6 des genehmigten sequenziellen M0–M7-Plans: präzisiert Begriffe und Verantwortlichkeiten vorhandener Knoten. mengenNorm wird als Maß einer Menge beschrieben, vektorraum als Tensorträger erster Stufe, darstellungsoptimierung als LaTeX-Darstellung mit registriertem metadataerhaltendem Durchreichpfad; Cauchy-Verträge werden präzisiert und numerische Richtung als angenähert gekennzeichnet. Keine neuen registrierten separat erzeugbaren Knotentypen oder Typentfernung, keine Produktionsabhängigkeiten; Katalog weiterhin 121 gemeinsame und 123 vollständige Android-Arten. Änderungs-Version x. Exakte veröffentlichte Basis v3.4.8 fb1984f9f83aa4e586b4e6bf22cb524ab0d9cb5a. Sämtliche finalen master-Workflows einschließlich isolierter Android-Laufzeit und Linux-RPM/Neustartpersistenz vor Reservierung vollständig grün bestätigt (Android 39005206217, Linux 39005206228, Kern/Android-Laufzeit 39005206244, Release-Guard 39005206226). M7 bleibt offen und unreserviert. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.9 auf master und grüne Releaseprüfungen." },
  { version = "3.4.8", title = "Gemeinsame Quellen- und Bereichsverträge bestehender Knoten", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M5", status = "released", previous_release = "3.4.7", branch = "samai/v3.4.8/konsolidierung-m5", kind = "refactor", version_axis = "x", reason = "M5 des genehmigten sequenziellen M0–M7-Plans: vereinheitlicht Typ- und Bereichsableitung vorhandener Quellen sowie Konstantenpfade ohne Typentfernung. Parameter- und Variablenrollen bleiben verschieden; unbekannte Bereiche werden diagnostiziert, Anzeigenamen erzeugen keine Identitäten, Wahr/Falsch-Quellen bleiben erhalten. Keine neuen registrierten separat erzeugbaren Knotentypen, keine Produktionsabhängigkeiten; Katalog 121 gemeinsame und 123 vollständige Android-Arten. Änderungs-Version x. Exakte veröffentlichte Basis v3.4.7 69d4e70a4f1bdbf69b23f0ee708f5893d5232947. Sämtliche finalen master-Workflows einschließlich isolierter Android-Laufzeit und Linux-RPM/Neustartpersistenz vor Reservierung vollständig grün bestätigt (Android 39001388559, Linux 39001388566, Kern/Android-Laufzeit 39001388536, Release-Guard 39001388554). M6–M7 bleiben offen und unreserviert. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.8 auf master und grüne Releaseprüfungen." },
  { version = "3.4.7", title = "Kanonische Mengenoperatoren und graphgebundene endliche Mengen", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M4", status = "released", previous_release = "3.4.6", branch = "samai/v3.4.7/konsolidierung-m4", kind = "refactor", version_axis = "x", reason = "M4 des genehmigten sequenziellen M0–M7-Plans: konsolidiert die drei bestehenden Spezialtypen mathematik.potenzmenge, mathematik.abbildungsmenge und mathematik.einzelmenge in vorhandenen Mengenoperatoren beziehungsweise im ausdrücklichen Graphmodus des vorhandenen endlicheMenge-Knotens. Erhält geordnete Elementeingänge, strukturierte Einzelwerte, stabile Identitäten und strenge diagnostische Migrationen. Standardkarteninstallation bewahrt nachgewiesene Originalhashes und erzeugt bei erforderlicher Aktualisierung neue Revisionen. Ziel 121 gemeinsame und 123 vollständige Android-Arten, keine neuen registrierten separat erzeugbaren Knotentypen oder Produktionsabhängigkeiten. Änderungs-Version x. Exakte veröffentlichte Basis v3.4.6 43726159a87efb50f1adcc5fe7cdafa981a2edd2; sämtliche finalen master-Workflows einschließlich isolierter Android-Laufzeit und Linux-RPM/Neustartpersistenz vor Reservierung vollständig grün bestätigt (Android 38997004505, Linux 38997004486, Kern/Android-Laufzeit 38997004522, Release-Guard 38997004509). M5–M7 bleiben offen und unreserviert. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.7 auf master und grüne Releaseprüfungen." },
  { version = "3.4.6", title = "Kanonische Tupelübersetzungen und Abflachen", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M3", status = "released", previous_release = "3.4.5", branch = "samai/v3.4.6/konsolidierung-m3", kind = "refactor", version_axis = "x", reason = "M3 des genehmigten sequenziellen M0–M7-Plans: konsolidiert vier bestehende Tupel-/Vektorübersetzungs-Spezialtypen in vorhandenen Übersetzerzielen einschließlich ABFLACHEN; erhält Richtung, eine Ebene oder rekursives Abflachen, Zeugnisse, Rückführung und stabile Anschlussidentitäten über nachgewiesene Migrationen. 124 gemeinsame und 126 vollständige Android-Arten, keine neuen registrierten und separat erzeugbaren Knotentypen oder Produktionsabhängigkeiten. Änderungs-Version x. Exakte veröffentlichte Basis v3.4.5 e6760b9a41aaeb186dee7ee7c13254430cb47ee8, sämtliche finalen master-Workflows durch Root-CLI vollständig grün bestätigt. M4–M7 bleiben offen und unreserviert. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.6 auf master und grüne Releaseprüfungen. Ursprünglicher v3.4.4-Androidfehler bleibt historisch dokumentiert; v3.4.5 repariert ausschließlich die Testinteraktion." },
  { version = "3.4.5", title = "Sichtbare Resetaktion im Android-Suchtest absichern", roadmap = "v3.4.x Reparatur der M2-Laufzeitabnahme", status = "released", previous_release = "3.4.4", branch = "samai/v3.4.5/such-reset-reparatur", kind = "fix", version_axis = "x", reason = "Enges Test-Reparaturrelease nach fehlgeschlagener Android-master-Abnahme von v3.4.4: stellt vor echtem Resetklick die Sichtbarkeit des durch die Bildschirmtastatur verdrängbaren LazyColumn-Suchkopfs sicher und prüft unmittelbar den geleerten Suchzustand. Keine Produktionsverhaltensänderung, abgeschwächte Erwartung oder neue Knotentypen. Ursprüngliche Fehlerursache ist noch nicht bewiesen; kein Infrastrukturfehler behauptet. Unabhängige Prüfung und tatsächliche CI-Ausführung bleiben erforderlich. Exakte veröffentlichte Basis v3.4.4 ec152625926698f58e1ddd1d1a1d6420f8b0c6cc; deren abschließendes Android-Laufzeitgate ist weiterhin offen. Änderungs-Version x; M3–M7 unreserviert. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.5 auf master und grüne Releaseprüfungen." },
  { version = "3.4.4", title = "Kanonische Matrix- und Vektoroperatoren", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M2", status = "released", previous_release = "3.4.3", branch = "samai/v3.4.4/konsolidierung-m2", kind = "refactor", version_axis = "x", reason = "M2 des genehmigten sequenziellen M0–M7-Plans: konsolidiert Spur, Matrixdiagonale, Vektorradius und Kreuzprodukt in vorhandenen Operatoren; vier physische Spezialtypen entfallen, 128 gemeinsame und 130 vollständige Android-Arten. Sichert gemeinsame Kernalgorithmen, reelle Normdomäne, Einheitsbasis und polymorphe Transposition sowie identitäts- und voraussetzungserhaltende Methodenhebung. Keine neuen registrierten und separat erzeugbaren Knotentypen oder Produktionsabhängigkeiten; Migrationen und vollständige Verbraucher sind nachzuweisen. Änderungs-Version x. Exakte veröffentlichte und vollständig releasegeprüfte Basis v3.4.3 e665a7fde78fe845dc7c62fa60fa00896d35f58a. M3–M7 bleiben offen und unreserviert. Der Status released beschreibt ausschließlich den PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.4 auf master und grüne Releaseprüfungen." },
  { version = "3.4.3", title = "Kanonische Methodenaufrufe und Prädikate", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M1", status = "released", previous_release = "3.4.2", branch = "samai/v3.4.3/konsolidierung-m1", kind = "refactor", version_axis = "x", reason = "M1 des genehmigten sequenziellen M0–M7-Plans: schließt ID-basierte Methodenbindung, metadataerhaltende Projektion und strukturierte symbolische Aufrufe; migriert MethodenAnwendung zum vorhandenen Methodenaufruf, Ordnungsrelationen zu vorhandenen Prädikatoperatoren und orientierte Analysis zu vorhandenen Methodenoperatoren. Vier Spezialarten entfallen, kein neuer registrierter und separat erzeugbarer Knotentyp. Format- und Anschlussmigrationen sind verlustfrei nachzuweisen; Einzelresultatprojektion erfolgt direkt und erhält tupelwertige Einzelresultate. Änderungs-Version x. Exakte veröffentlichte und vollständig releasegeprüfte Basis v3.4.2 5813c0337b5c7b2284d882b785559dfeea4ae3cd. M2–M7 bleiben offen. Der Status released beschreibt den geprüften PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.3 auf master und grüne Releaseprüfungen." },
  { version = "3.4.2", title = "Kanonischer plattformgleicher Knotenkatalog und sichere Prädikatmigration", roadmap = "v3.4.x Knotenarchitektur-Konsolidierung M0", status = "released", previous_release = "3.4.1", branch = "samai/v3.4.2/konsolidierung-m0", kind = "fix", version_axis = "x", reason = "Konsolidiert vorhandene Mengen- und Raumtypen im gemeinsamen Android-/Desktop-Katalog, entfernt plattformspezifische Erstellen-Ergänzungen und sichtbare Geometriealtarten, erhält deren Lade-/Migrationspfade und sperrt mehrdeutige Prädikat-/Rechnermigrationen diagnostisch ohne Datenverlust. Kein neuer registrierter und separat erzeugbarer Knotentyp; Format 10 bleibt unverändert. M0 des beauftragten sequenziellen M0–M7-Plans; keine Folgeversion reserviert. Der Status released beschreibt den geprüften PR-Zielbaum; Veröffentlichung erst durch finalen Commit v3.4.2 auf master und grüne Releaseprüfungen. Exakte veröffentlichte Basis v3.4.1 9fea31ddbaaef8bd26fa7a2730177eaaa9744909. Historische Draft-PRs #433, #435 und #436 bleiben unverändert außerhalb dieser Integration und werden nicht als Releasebasis verwendet." },
