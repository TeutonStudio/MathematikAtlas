  { version = "2.16.1", title = "Kartesische Tupel und gemeinsame Strukturverträge", roadmap = "v2.16.x Strukturverträge und lineare Algebra", status = "released", previous_release = "2.16.0", branch = "release/v2.16.1-strukturvertraege", kind = "feature", version_axis = "x", reason = "Erweitert bestehende mathematische Laufzeittypen um zentrale Struktur-, Komponenten- und Tensorverträge, ohne einen neuen registrierten Knotentyp einzuführen." },
